      action: Review condition evidence
    - kind: Receiving system
      title: Receiving-Water Response
      description: Follow timing, volume, velocity, temperature, sediment, and pollutants beyond the outlet.
      href: "#block-connected-learning"
      action: Follow the discharge
    - kind: One Water foundation
      title: Water Balance and Mass Balance
      description: Account for where water and material enter, accumulate, divide, transform, and leave a defined boundary.
      href: "#block-final-transfer"
      action: Strengthen the boundary
    - kind: Wastewater connection
      title: Infiltration and Inflow
      description: Investigate how rainfall and groundwater enter a separate sanitary sewer and consume wet-weather capacity.
      href: "#block-wastewater-ii"
      action: Follow the wrong route
