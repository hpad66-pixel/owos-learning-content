final_recap:
  - label: What changed
    body: You replaced a practice label with a water, control, responsibility, evidence, and value story.
  - label: What to observe
    body: Trace the inlet, storage, permanent pool, outlet, overflow, soil, groundwater boundary, underdrain, I&I route, downstream condition, and post-storm response.
  - label: What not to assume
    body: A name, dry surface, permanent pool, lower concentration, model, or permit does not prove present performance.
short_disclaimer: This brief explains the concept. Facility decisions still require your approved procedures and qualified judgment.
block_overrides:
  block-evidence-boundary:
    title: Sources and scope
    body: |
      This working preview uses current United States federal law, federal regulation, and EPA guidance to explain a pathway-first method. EPA materials document that stormwater terminology varies and that performance can involve timing, volume, concentration, total load, groundwater protection, and maintenance.

      This brief cannot determine a real asset's design, capacity, drawdown, infiltration rate, treatment performance, groundwater suitability, maintenance action, or compliance. Those decisions require current drawings, site evidence, approved procedures, applicable permits, and qualified judgment.
