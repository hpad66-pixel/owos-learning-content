public_source_notes:
  source-uscode-green-infrastructure: Current federal definition of green infrastructure. It does not define every practice name or supply design criteria.
  source-ecfr-small-ms4: Current federal small MS4 post-construction and long-term maintenance frame. Exact applicability and permit obligations require separate review.
  source-epa-flow-control: Current EPA explanation of detention and permanent-pool retention basins in a flow-control context.
  source-epa-bmp-terminology: EPA technical report documenting that retention and detention terminology is not used consistently.
  source-epa-groundwater: EPA guidance on infiltration, groundwater interaction, site questions, contamination, pretreatment, and underdrains.
  source-epa-performance: EPA guidance separating concentration, discharged volume, and total pollutant load.
  source-epa-national-bmp-menu: Representative practices and the need to evaluate practices as a system rather than a universal list.
  source-epa-maintenance: Federal maintenance framing. Linked state manuals are excluded from this public brief.
  source-epa-wet-ponds: Federal conceptual wet-pond explanation. State examples and design criteria are excluded.
  source-epa-infiltration-trench: Federal conceptual infiltration-trench explanation without adopting siting or sizing criteria.
  source-usgs-hydrograph: Federal science context for reading flow through time.
  source-epa-swmm: Federal model context used only to explain modeling capability and uncertainty.
  source-epa-sso-faq: Federal sanitary-sewer overflow and I&I context.
  source-epa-sso: Federal separate sanitary-sewer and wet-weather consequence context.
  source-epa-peak-flows: Federal wet-weather wastewater capacity context without facility-specific quantities.
  source-epa-npdes-permit-basics: Federal permit purpose, monitoring, reporting, public participation, and enforcement context.
  source-epa-ms4-program: Federal municipal stormwater program context.
  source-epa-construction-stormwater: Federal construction-stormwater context without compliance guidance.
  source-epa-industrial-stormwater: Federal industrial-stormwater context without compliance guidance.
