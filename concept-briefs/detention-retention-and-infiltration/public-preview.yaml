  sop_title: Stormwater pathway review outline
  sop_intro: Copy this outline into the utility's approved workspace only after the actual asset, applicable authority, and responsible reviewers are identified. It is a review structure, not a maintenance or operating procedure.
  sop_outline:
    - section: Asset identity and intended objective
      prompt: Identify the exact asset, approved drawings, owner, design objective, drainage area, and the question this review must answer.
    - section: Inflow and storm boundary
      prompt: State what enters, the time period or storm condition being reviewed, and any upstream bypass or contributing area.
    - section: Storage and treatment zones
      prompt: Identify each documented surface, media, soil, permanent-pool, and temporary-storage zone.
    - section: Every exit route
      prompt: List controlled outlets, underdrains, infiltration, evapotranspiration, seepage, overflow, bypass, and receiving-water routes.
    - section: Site and groundwater evidence
      prompt: Identify soil, seasonal groundwater, contamination, pretreatment, well, karst, and nearby-use questions requiring qualified review.
    - section: Condition and maintenance evidence
      prompt: Record inlet, outlet, sediment, debris, vegetation, erosion, ponding, underdrain, access, and post-storm observations without diagnosing from one observation.
    - section: Performance evidence
      prompt: State which evidence addresses timing, peak, volume, concentration, total load, treatment, and receiving-water response.
    - section: Decision authority and follow-up
      prompt: Name who reviews, what remains unknown, which approved procedure applies, and what evidence is required before any action.
  related_learning:
