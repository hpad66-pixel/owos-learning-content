hero_summary: First learn what detention, retention, and infiltration mean. Then follow one storm through storage, soil, outlets, wastewater I&I, permits, maintenance, and lifecycle value.
public_version_label: PREVIEW 0.3
scope_label: STORMWATER AND WASTEWATER · UNITED STATES FEDERAL FRAME · ILLUSTRATIVE ROUTES · EDUCATIONAL USE
quick_takeaway:
  label: IN 30 SECONDS
  title: Three related terms. Three different parts of the water story.
  items:
    - Detention holds stormwater temporarily and releases it later.
    - Retention must be tied to the source because it may describe retained runoff or a permanent pool.
    - Infiltration means water enters soil or porous material, but the final destination still has to be traced.
