schema_version: 1
contract: owos-concept-brief/2
brief_id: owos:concept-brief:003
forum_space_id: owos-community:concept-brief:003
mount_id: owos-concept-community
version_context: 0.1.0
purpose: Compare terminology, intended pathways, maintenance observations, source suggestions, and correction proposals without turning discussion into design or operating instruction.
seed_questions:
  - Where does the word retention mean something different in your region or organization?
  - Which water exit is most often missing from an asset description or inspection record?
  - What evidence best distinguishes a blocked pathway from a practice that was never designed to provide that route?
  - Which claim or visual needs a better source, limitation, or correction?
moderation_owner: OWOS Learning Steward
verified_answer_policy: A verified label requires mapping to accepted claims and completion of source, qualified technical, editorial, and owner review.
discussion_boundary: Community discussion is practitioner conversation, not verified instruction, design guidance, permit interpretation, site diagnosis, or authorization to change an asset.
correction_escalation: Identify the claim, exact source locator, proposed change, affected visual or assessment, and practical consequence. Route it through source review, qualified review, revision, and owner approval.
facility_information_warning: Do not post security-sensitive locations, drawings, access information, confidential procedures, permit-sensitive facility data, credentials, personal information, or restricted utility records.
accessibility_behavior: Search, filters, labels, replies, status, and correction controls use programmatic names, keyboard access, visible focus, and announced updates.
drawer_behavior: Light right-side drawer on larger screens and full-screen drawer on small screens. Only one connected-learning drawer opens at a time.
focus_return: Close, Escape, backdrop selection, and browser Back return focus to the opening control and preserve reader position.
review_status: pending_owner_moderation_privacy_accessibility_and_platform_review
