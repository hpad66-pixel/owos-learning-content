schema_version: 1
contract: owos-concept-brief/2
brief_id: owos:concept-brief:003
brief:
  brief_id: owos:concept-brief:003
  slug: detention-retention-and-infiltration
  title: Detention, Retention, and Infiltration
  version: 0.3.0
  status: owner_directed_instructional_and_format_revision_for_review
  owner: Hardeep Anand
  promise: Follow one storm through storage, controlled release, permanent pool, infiltration, evapotranspiration, treatment, and bypass pathways before judging a stormwater practice by its name.
  audiences:
    - stormwater_operator
    - inspector
    - engineer
    - asset_manager
    - finance_professional
    - utility_leader
    - elected_official
    - regulator
    - community_educator
  scope: Public United States concept education about stormwater pathways, performance objectives, evidence, site constraints, and maintenance boundaries.
  authority_scope: united_states_only
  evidence_cutoff: 2026-07-26
  language: en-US
design_fingerprint:
  learner_job: Describe the actual water pathway and intended performance objective before naming, comparing, inspecting, or evaluating a stormwater practice.
  opening_pattern: same_storm_three_destinations
  narrative_archetype: routed_storm_investigation
  central_mental_model: the_name_is_not_the_pathway
  signature_mechanism: one_storm_routed_through_three_water_rooms
  dominant_visual: animated_cutaway_route_map_with_surface_outlet_soil_and_groundwater
  interaction_signature: trace_each_water_fraction_then_compare_claim_to_evidence
  role_treatment: shared_pathway_map_with_role_specific_evidence_questions
  closing_action: write_a_pathway_and_performance_statement_before_using_a_practice_label
  surface_rhythm: graphite_storm_entry_then_three_route_planes_then_subsurface_cutaway_then_ivory_evidence_close
  intentionally_avoided:
    - side_by_side_definition_cards
    - universal_design_values
    - regional_name_as_universal_term
    - asset_rating_from_appearance
    - percent_removal_as_complete_performance
  adjacent_differences:
    - Unlike Mass Balance, this brief follows the disposition and timing of one storm rather than solving a constituent ledger.
    - Unlike Stormwater Control Measure Maintenance, this brief teaches pathway and objective first rather than a seasonal inspection sequence.
    - Unlike the Storm Hydrograph, this brief compares mechanisms and evidence rather than teaching graph interpretation.
