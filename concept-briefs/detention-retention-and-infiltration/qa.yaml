notes:
  - Activation source identity is established by exact title, direct locator, and owner request.
  - The owner approved working-preview implementation on 2026-07-26; learner-facing HTML has been generated for review only.
  - State manuals, state requirements, local criteria, and permit details are excluded from the public source register and narrative.
  - Federal and EPA source identities and locators were reviewed, but material claims remain pending independent verification and qualified technical review.
  - Rendered desktop, phone, reduced-motion, and no-JavaScript QA passed. Tablet, screen-reader, keyboard-only manual, touch-only manual, novice-reader, practitioner, Graph, Community, commercial, and release reviews remain unresolved.
  - Public release remains blocked even though the working visual preview is available.
  - On 2026-07-26 the owner rejected the preview's editorial format and research depth and returned the brief to owner sparring, white-paper research, and curriculum-thesis development.
  - All prior rendered QA is historical evidence for a frozen pre-research prototype. It does not approve the next brief or satisfy the new white-paper gate.
  - Research draft 0.4 reached the 95-point white-paper content threshold after adding the one-storm, five-ledger value model, plain-English permit teaching, municipal, construction, industrial, and wastewater permit context, and role-specific value scenes.
  - Working package validation passes, but reports zero release verification coverage because all twenty-two claims still require an independent verifier, qualified review where applicable, and freshness records.
  - A Florida jurisdiction-specific research white paper, source register, and claim register were completed on 2026-07-26 and isolated under research/ so Florida material does not become universal public authority.
  - The Florida paper scored 97 of 100. Independent Florida legal-source verification, qualified stormwater, hydrogeology, wastewater, and permitting reviews, diagram review, and owner approval remain blocked hard gates.
  - Replacement HTML was authorized and built from the national research-final-0.5 for governed review only. The Florida companion remains isolated from the public national brief.
  - Hardeep approved the national and Florida white-paper teaching direction on 2026-07-26. This advances the package into evidence verification and curriculum design but does not approve technical accuracy, storyboard, replacement HTML, Graph, Community, commercial placement, credentials, or release.
  - The immature pre-research design and seven-beat storyboard were replaced with a proposed twelve-beat curriculum that includes dry storage, permanent pools, subsurface practices, hydrographs, performance measures, maintenance failure paths, wastewater I&I, permit value, finance, cross-role questions, and the final 11-question work product.
  - research/verification-dossier.md now routes every material national claim and proposed visual to independent source, qualified stormwater, wastewater, permitting, visual-truth, editorial, and novice reviews. Author dossier preparation does not increase release verification coverage.
  - Hardeep approved the rebuilt design brief and twelve-beat storyboard and authorized a governed review-only replacement preview on 2026-07-26.
  - The rebuilt public review preview passed automated browser QA with zero failures at 1440-pixel desktop and 390-pixel phone widths, with reduced motion and JavaScript-disabled fallbacks verified.
  - Author visual inspection confirmed corrected editorial measure, margins, hierarchy, diagram containment, mobile reading order, interpretation text, and final recap. Independent accessibility, novice-reader, visual-truth, practitioner, and owner rendered-experience reviews remain unresolved.
  - On 2026-07-26 Hardeep rejected preview 0.2 as weak overall and identified left margins, graphic-text alignment, topic introduction, definition timing, and instructional depth as specific failures.
  - Preview 0.3 adds a thirteenth definition-first beat, introduces later topics before their visuals, strengthens utility explanations, increases responsive editorial gutters, aligns visual frames and captions, and converts the foundation table to stacked mobile records.
  - Preview 0.3 passed the refreshed desktop, phone, reduced-motion, and no-JavaScript browser harness with zero reported failures and zero overflow elements. This is author evidence only. Owner review remains pending.
