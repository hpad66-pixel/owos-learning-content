<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Dry detention basin through five storm states</title>
  <desc id="desc">Five panels show available storage before a storm, rising water, peak storage, recession, and recovery through a controlled outlet.</desc>
  <defs><style>.h{font:700 24px Arial;fill:#102536}.t{font:700 16px Arial;fill:#102536}.s{font:500 13px Arial;fill:#38576b}.p{fill:#f5f1e8;stroke:#9fb0b8;stroke-width:2}.land{fill:#7a9162}.water{fill:#3aa7d8}.out{stroke:#102536;stroke-width:8}</style></defs>
  <rect width="1200" height="520" fill="#fbfaf6"/><text x="45" y="48" class="h">Dry detention: storage fills, releases, and recovers</text>
  <g transform="translate(35 88)"><rect width="210" height="310" rx="16" class="p"/><text x="18" y="34" class="t">1  Before</text><path d="M18 150q86 125 174 0v120H18z" class="land"/><line x1="170" y1="210" x2="205" y2="210" class="out"/><text x="18" y="292" class="s">Storage available</text></g>
  <g transform="translate(265 88)"><rect width="210" height="310" rx="16" class="p"/><text x="18" y="34" class="t">2  Rising</text><path d="M18 150q86 125 174 0v120H18z" class="land"/><path d="M55 205q50 40 100 0v42H55z" class="water"/><line x1="170" y1="210" x2="205" y2="210" class="out"/><text x="18" y="292" class="s">Inflow exceeds outflow</text></g>
  <g transform="translate(495 88)"><rect width="210" height="310" rx="16" class="p"/><text x="18" y="34" class="t">3  Near peak</text><path d="M18 150q86 125 174 0v120H18z" class="land"/><path d="M34 170q70 80 140 0v78H34z" class="water"/><line x1="170" y1="210" x2="205" y2="210" class="out"/><text x="18" y="292" class="s">Temporary storage occupied</text></g>
  <g transform="translate(725 88)"><rect width="210" height="310" rx="16" class="p"/><text x="18" y="34" class="t">4  Recession</text><path d="M18 150q86 125 174 0v120H18z" class="land"/><path d="M50 196q55 52 110 0v52H50z" class="water"/><line x1="170" y1="210" x2="205" y2="210" class="out"/><text x="18" y="292" class="s">Outflow continues</text></g>
  <g transform="translate(955 88)"><rect width="210" height="310" rx="16" class="p"/><text x="18" y="34" class="t">5  Recovery</text><path d="M18 150q86 125 174 0v120H18z" class="land"/><line x1="170" y1="210" x2="205" y2="210" class="out"/><text x="18" y="292" class="s">Space returns for the next storm</text></g>
  <path d="M130 430H1065" stroke="#2f84ad" stroke-width="5"/><text x="44" y="476" class="s">Read the water level and outlet together. No universal drawdown time or performance result is shown.</text>
</svg>
