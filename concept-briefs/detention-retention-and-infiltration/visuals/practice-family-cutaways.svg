<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Bioretention, infiltration trench, and permeable pavement routes</title>
  <desc id="desc">Three cutaways show surface entry, temporary storage, engineered material, native soil, underdrain, groundwater, and overflow.</desc>
  <defs><style>.h{font:700 25px Arial;fill:#102536}.t{font:700 17px Arial;fill:#102536}.s{font:500 13px Arial;fill:#38576b}.panel{fill:#f6f2e9;stroke:#a3b1b9;stroke-width:2}.soil{fill:#8a6c4d}.media{fill:#b79a70}.stone{fill:#788b94}.water{stroke:#2e9ed1;stroke-width:6;fill:none}.pipe{stroke:#243845;stroke-width:9;stroke-dasharray:12 7}</style></defs>
  <rect width="1200" height="650" fill="#fbfaf6"/><text x="42" y="48" class="h">Infiltration is the doorway, not the final destination</text>
  <g transform="translate(35 90)"><rect width="350" height="490" rx="18" class="panel"/><text x="24" y="38" class="t">Bioretention</text><path d="M35 120q140 70 280 0" fill="#6d9259"/><path d="M60 155h230v90H60z" class="media"/><path d="M60 245h230v155H60z" class="soil"/><path d="M175 95v250" class="water"/><path d="M80 305h190" class="pipe"/><path d="M270 305h55" class="water"/><text x="24" y="430" class="s">Surface ponding, media, native soil,</text><text x="24" y="454" class="s">underdrain, plant use, and overflow</text></g>
  <g transform="translate(425 90)"><rect width="350" height="490" rx="18" class="panel"/><text x="24" y="38" class="t">Infiltration trench</text><path d="M35 120h280" stroke="#596b75" stroke-width="16"/><path d="M70 140h210v190H70z" class="stone"/><path d="M45 330h260v70H45z" class="soil"/><path d="M175 95v275" class="water"/><circle cx="120" cy="190" r="13" fill="#d8e0e4"/><circle cx="200" cy="245" r="15" fill="#d8e0e4"/><circle cx="250" cy="175" r="11" fill="#d8e0e4"/><text x="24" y="430" class="s">Stone voids provide temporary storage.</text><text x="24" y="454" class="s">Soil interface and overflow still matter.</text></g>
  <g transform="translate(815 90)"><rect width="350" height="490" rx="18" class="panel"/><text x="24" y="38" class="t">Permeable pavement</text><path d="M35 120h280" stroke="#596b75" stroke-width="22" stroke-dasharray="38 6"/><path d="M55 145h240v130H55z" class="stone"/><path d="M45 275h260v125H45z" class="soil"/><path d="M175 85v250" class="water"/><path d="M90 225h170" class="pipe"/><path d="M260 225h60" class="water"/><text x="24" y="430" class="s">Surface openings feed a stone reservoir.</text><text x="24" y="454" class="s">Soil, underdrain, and overflow divide flow.</text></g>
  <path d="M45 605h1110" stroke="#2e9ed1" stroke-width="4"/><text x="42" y="635" class="s">No infiltration rate, groundwater separation, treatment result, or site suitability is implied.</text>
</svg>
