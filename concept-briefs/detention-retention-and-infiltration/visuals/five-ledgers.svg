<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc">
  <title id="title">One storm writes into five ledgers</title>
  <desc id="desc">A central storm connects to water, environmental, asset, financial, and public-accountability questions.</desc>
  <defs><style>.h{font:700 25px Arial;fill:#fff}.t{font:700 17px Arial;fill:#fff}.s{font:500 14px Arial;fill:#c4dbe6}.b{fill:#123247;stroke:#4a7188;stroke-width:2}.link{stroke:#55c2ff;stroke-width:4}</style></defs>
  <rect width="1000" height="700" fill="#081822"/><text x="40" y="48" class="h">One storm. Five ways to read its value.</text>
  <circle cx="500" cy="350" r="105" fill="#1f78a5"/><text x="452" y="340" class="t">ONE</text><text x="444" y="370" class="t">STORM</text>
  <path d="M420 285L300 190M580 285L700 190M605 350H790M580 420L700 525M420 420L300 525" class="link"/>
  <rect x="90" y="105" width="260" height="145" rx="18" class="b"/><text x="118" y="145" class="t">Water ledger</text><text x="118" y="180" class="s">Where did it go?</text><text x="118" y="208" class="s">When did it leave?</text>
  <rect x="650" y="105" width="260" height="145" rx="18" class="b"/><text x="678" y="145" class="t">Environmental ledger</text><text x="678" y="180" class="s">What reached the</text><text x="678" y="208" class="s">receiving water?</text>
  <rect x="735" y="280" width="230" height="145" rx="18" class="b"/><text x="763" y="320" class="t">Asset ledger</text><text x="763" y="355" class="s">Did storage, outlets,</text><text x="763" y="383" class="s">and routes still work?</text>
  <rect x="650" y="480" width="260" height="145" rx="18" class="b"/><text x="678" y="520" class="t">Financial ledger</text><text x="678" y="555" class="s">What service, cost,</text><text x="678" y="583" class="s">and renewal changed?</text>
  <rect x="90" y="480" width="300" height="145" rx="18" class="b"/><text x="118" y="520" class="t">Public-accountability ledger</text><text x="118" y="555" class="s">Who was responsible?</text><text x="118" y="583" class="s">What evidence changed?</text>
  <text x="40" y="675" class="s">The ledgers are different views of the same physical system, not separate projects.</text>
</svg>
