<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" role="img" aria-labelledby="title desc">
  <title id="title">Water volume, concentration, and pollutant load ledger</title>
  <desc id="desc">A conceptual flow shows discharged water volume and constituent concentration combining to describe total pollutant load.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#2f8fbd"/></marker><style>.h{font:700 26px Arial;fill:#102536}.t{font:700 19px Arial;fill:#102536}.s{font:500 14px Arial;fill:#3c5868}.b{fill:#f3efe6;stroke:#9aacb5;stroke-width:2}.f{fill:none;stroke:#2f8fbd;stroke-width:16;marker-end:url(#a)}</style></defs>
  <rect width="1100" height="580" fill="#fbfaf6"/><text x="45" y="50" class="h">Performance has more than one measure</text>
  <rect x="55" y="125" width="250" height="150" rx="18" class="b"/><text x="85" y="170" class="t">Discharged volume</text><text x="85" y="205" class="s">How much water left</text><text x="85" y="235" class="s">during the period?</text>
  <rect x="425" y="125" width="250" height="150" rx="18" class="b"/><text x="455" y="170" class="t">Concentration</text><text x="455" y="205" class="s">How much constituent</text><text x="455" y="235" class="s">per unit of water?</text>
  <rect x="795" y="125" width="250" height="150" rx="18" class="b"/><text x="825" y="170" class="t">Pollutant load</text><text x="825" y="205" class="s">How much total mass</text><text x="825" y="235" class="s">moved during the period?</text>
  <path d="M305 200H415" class="f"/><text x="340" y="180" class="t">+</text><path d="M675 200H785" class="f"/><text x="710" y="180" class="t">=</text>
  <rect x="165" y="355" width="770" height="120" rx="18" fill="#102f49"/><text x="205" y="400" font-family="Arial" font-size="20" font-weight="700" fill="#fff">A lower concentration alone does not establish a lower total load.</text><text x="205" y="438" font-family="Arial" font-size="15" fill="#c6dce7">Keep peak flow and timing separate. They answer a different hydraulic question.</text>
  <text x="45" y="535" class="s">Conceptual relationship only. Any worked values must be labeled illustrative with units and assumptions.</text>
</svg>
