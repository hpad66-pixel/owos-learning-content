<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">One storm through a connected water system</title>
  <desc id="desc">Rain falls over developed land. Routes branch toward a dry basin, wet pond, subsurface practice, receiving water, and unintended entry into a separate sanitary sewer.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#07131f"/><stop offset="1" stop-color="#102f49"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#55c2ff"/></marker>
    <style>.h{font:700 24px Arial;fill:#fff}.t{font:600 17px Arial;fill:#eaf5fb}.s{font:500 14px Arial;fill:#bad3e2}.box{fill:#102c40;stroke:#4b7690;stroke-width:2}.water{fill:none;stroke:#55c2ff;stroke-width:6;marker-end:url(#arrow)}.warn{fill:none;stroke:#ffb45b;stroke-width:5;stroke-dasharray:10 8;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="680" fill="url(#sky)"/>
  <text x="54" y="52" class="h">Start with the rain. Trace every route.</text>
  <g fill="#55c2ff" opacity=".75"><path d="M120 82l-10 35h20z"/><path d="M275 75l-10 35h20z"/><path d="M430 88l-10 35h20z"/><path d="M590 72l-10 35h20z"/><path d="M750 84l-10 35h20z"/><path d="M910 72l-10 35h20z"/></g>
  <rect x="55" y="145" width="185" height="110" rx="18" class="box"/><text x="80" y="185" class="t">Roof and road</text><text x="80" y="215" class="s">Runoff begins</text>
  <rect x="295" y="145" width="185" height="110" rx="18" class="box"/><text x="320" y="185" class="t">Inlet and pipe</text><text x="320" y="215" class="s">Conveyance</text>
  <rect x="535" y="125" width="210" height="150" rx="18" class="box"/><text x="560" y="165" class="t">Dry basin</text><path d="M565 225q75-55 150 0" fill="#17394d" stroke="#55c2ff" stroke-width="4"/><text x="560" y="252" class="s">Temporary storage</text>
  <rect x="800" y="110" width="250" height="180" rx="18" class="box"/><text x="825" y="150" class="t">Wet pond</text><rect x="825" y="210" width="200" height="48" rx="20" fill="#1f78a5"/><path d="M825 205q100-30 200 0" fill="none" stroke="#8cddff" stroke-width="4"/><text x="825" y="180" class="s">Storm storage above</text><text x="840" y="242" class="s" fill="#fff">Permanent pool</text>
  <rect x="320" y="365" width="260" height="190" rx="18" class="box"/><text x="345" y="405" class="t">Subsurface practice</text><rect x="345" y="440" width="210" height="35" fill="#b89062"/><rect x="345" y="475" width="210" height="45" fill="#725f45"/><path d="M450 420v95" class="water"/><text x="345" y="545" class="s">Soil, underdrain, overflow</text>
  <rect x="700" y="385" width="205" height="125" rx="18" class="box"/><text x="725" y="425" class="t">Outfall</text><text x="725" y="456" class="s">Controlled discharge</text><text x="725" y="482" class="s">and overflow</text>
  <path d="M35 610q180-65 360 0t360 0t410 0v70H35z" fill="#145d80"/><text x="895" y="642" class="t">Receiving water</text>
  <rect x="65" y="385" width="190" height="145" rx="18" class="box"/><text x="90" y="425" class="t">Sanitary sewer</text><text x="90" y="456" class="s">Separate system</text><text x="90" y="484" class="s">I&amp;I is unintended</text>
  <path d="M240 200H295" class="water"/><path d="M480 200H535" class="water"/><path d="M745 200H800" class="water"/><path d="M705 275q30 95 95 110" class="water"/><path d="M905 448q70 40 70 145" class="water"/><path d="M640 275q-40 65-90 90" class="water"/>
  <path d="M150 255v130" class="warn"/><text x="58" y="575" class="s" fill="#ffca84">Wrong route: wet-weather entry</text>
  <text x="54" y="664" class="s">Illustrative route map. It does not calculate flow, flooding, infiltration, treatment, capacity, or compliance.</text>
</svg>
