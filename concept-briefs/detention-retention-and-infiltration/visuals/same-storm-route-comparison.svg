<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">The same storm can follow three different water pathways</title>
  <desc id="desc">Three cutaway stormwater practices show temporary storage and controlled release, permanent pool and displacement, and infiltration with soil, underdrain, groundwater, overflow, and evidence paths.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10232e"/>
      <stop offset="1" stop-color="#1c1b19"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dc6e8" stop-opacity=".35"/>
      <stop offset="1" stop-color="#8ed0ed" stop-opacity=".9"/>
    </linearGradient>
    <pattern id="soil" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect width="18" height="18" fill="#3a3329"/>
      <circle cx="4" cy="5" r="1.5" fill="#a29c91"/>
      <circle cx="13" cy="12" r="1" fill="#6f685e"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#8ed0ed"/>
    </marker>
    <marker id="amberArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#e0a64a"/>
    </marker>
    <style>
      .k{font:700 14px Arial,sans-serif;letter-spacing:2px;fill:#8ed0ed}
      .h{font:800 26px Arial,sans-serif;fill:#f2f1ec}
      .b{font:400 15px Arial,sans-serif;fill:#d9d6cf}
      .s{font:700 12px "Courier New",monospace;fill:#a29c91;letter-spacing:1px}
      .route{fill:none;stroke:#8ed0ed;stroke-width:5;marker-end:url(#arrow)}
      .warn{fill:none;stroke:#e0a64a;stroke-width:4;stroke-dasharray:8 7;marker-end:url(#amberArrow)}
      .panel{fill:#292826;stroke:#4b4842;stroke-width:2}
      .label{fill:#10232e;stroke:#7dc6e8}
    </style>
  </defs>
  <rect width="1200" height="720" fill="url(#sky)"/>
  <text x="48" y="48" class="k">READ THE WATER PATH BEFORE THE PRACTICE NAME</text>
  <text x="48" y="84" class="h">One storm. Three arrangements. Different exits.</text>
  <g transform="translate(42 122)">
    <rect width="352" height="506" rx="20" class="panel"/>
    <text x="24" y="40" class="s">ROUTE 01</text>
    <text x="24" y="72" class="h">Temporary storage</text>
    <text x="24" y="96" class="b">Water waits, then leaves through an outlet.</text>
    <path d="M20 206Q90 154 176 208T332 206V328H20Z" fill="url(#water)"/>
    <path d="M20 330H332V430H20Z" fill="url(#soil)"/>
    <path d="M52 156C82 174 100 187 126 215" class="route"/>
    <path d="M182 276H308" class="route"/>
    <circle cx="304" cy="276" r="11" fill="#1c1b19" stroke="#8ed0ed" stroke-width="4"/>
    <path d="M290 194Q328 182 340 154" class="warn"/>
    <rect x="28" y="350" width="296" height="58" rx="10" class="label"/>
    <text x="44" y="374" class="s" fill="#8ed0ed">NORMAL EXIT</text>
    <text x="44" y="395" class="b" fill="#f2f1ec">Controlled surface release</text>
    <text x="24" y="462" class="s">EVIDENCE TO CHECK</text>
    <text x="24" y="486" class="b">Outlet, storage response, overflow, condition</text>
  </g>
  <g transform="translate(424 122)">
    <rect width="352" height="506" rx="20" class="panel"/>
    <text x="24" y="40" class="s">ROUTE 02</text>
    <text x="24" y="72" class="h">Permanent pool</text>
    <text x="24" y="96" class="b">New runoff raises or displaces stored water.</text>
    <path d="M20 196Q90 184 176 198T332 194V328H20Z" fill="url(#water)"/>
    <path d="M20 330H332V430H20Z" fill="url(#soil)"/>
    <line x1="20" y1="240" x2="332" y2="240" stroke="#f2f1ec" stroke-opacity=".55" stroke-dasharray="5 5"/>
    <text x="30" y="232" class="s">NORMAL POOL</text>
    <path d="M54 154C88 174 105 185 132 208" class="route"/>
    <path d="M184 214H307" class="route"/>
    <circle cx="306" cy="214" r="11" fill="#1c1b19" stroke="#8ed0ed" stroke-width="4"/>
    <path d="M290 178Q326 166 340 140" class="warn"/>
    <rect x="28" y="350" width="296" height="58" rx="10" class="label"/>
    <text x="44" y="374" class="s" fill="#8ed0ed">NORMAL EXIT</text>
    <text x="44" y="395" class="b" fill="#f2f1ec">Displacement through documented outlet</text>
    <text x="24" y="462" class="s">EVIDENCE TO CHECK</text>
    <text x="24" y="486" class="b">Pool level, outlet, sediment, monitoring</text>
  </g>
  <g transform="translate(806 122)">
    <rect width="352" height="506" rx="20" class="panel"/>
    <text x="24" y="40" class="s">ROUTE 03</text>
    <text x="24" y="72" class="h">Subsurface routing</text>
    <text x="24" y="96" class="b">Water divides below and above the surface.</text>
    <path d="M20 192Q90 166 176 196T332 188V242H20Z" fill="url(#water)"/>
    <rect x="20" y="244" width="312" height="82" fill="#564c39"/>
    <rect x="20" y="328" width="312" height="102" fill="url(#soil)"/>
    <path d="M54 150C86 170 108 184 130 203" class="route"/>
    <path d="M112 224V350" class="route"/>
    <path d="M190 224V394" class="route"/>
    <path d="M152 350H288" class="route"/>
    <path d="M290 184Q326 164 340 136" class="warn"/>
    <line x1="26" y1="398" x2="326" y2="398" stroke="#7dc6e8" stroke-width="3"/>
    <text x="32" y="420" class="s">SEASONAL GROUNDWATER BOUNDARY</text>
    <rect x="28" y="444" width="296" height="58" rx="10" class="label"/>
    <text x="44" y="468" class="s" fill="#8ed0ed">POSSIBLE EXITS</text>
    <text x="44" y="489" class="b" fill="#f2f1ec">Soil, underdrain, overflow, evaporation</text>
  </g>
  <g transform="translate(48 658)">
    <circle cx="8" cy="0" r="6" fill="#8ed0ed"/>
    <text x="24" y="5" class="b">Blue shows a planned route.</text>
    <path d="M258 0H290" class="warn"/>
    <text x="306" y="5" class="b">Amber shows overflow or bypass that must stay visible.</text>
    <text x="790" y="5" class="s">ILLUSTRATIVE CONCEPT MAP, NOT A DESIGN MODEL</text>
  </g>
</svg>
