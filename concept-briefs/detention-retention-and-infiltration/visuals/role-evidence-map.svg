<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Different roles use one shared stormwater evidence record</title>
  <desc id="desc">Engineering, operations, finance, leadership, wastewater, and public questions connect to one central record of route, condition, responsibility, and evidence.</desc>
  <defs><style>.h{font:700 25px Arial;fill:#102536}.t{font:700 16px Arial;fill:#102536}.s{font:500 13px Arial;fill:#3d5968}.b{fill:#f4f0e7;stroke:#9bacb5;stroke-width:2}.line{stroke:#2f8fbd;stroke-width:4}</style></defs>
  <rect width="1200" height="650" fill="#fbfaf6"/><text x="42" y="48" class="h">Different roles ask different questions of the same system</text>
  <rect x="400" y="185" width="400" height="275" rx="24" fill="#102f49"/><text x="445" y="230" font-family="Arial" font-size="19" font-weight="700" fill="#fff">SHARED SYSTEM RECORD</text><text x="445" y="280" font-family="Arial" font-size="15" fill="#c7dce7">Water route and storm condition</text><text x="445" y="318" font-family="Arial" font-size="15" fill="#c7dce7">Storage, outlet, overflow, tailwater</text><text x="445" y="356" font-family="Arial" font-size="15" fill="#c7dce7">Condition, maintenance, and ownership</text><text x="445" y="394" font-family="Arial" font-size="15" fill="#c7dce7">Plans, permits, monitoring, and budget</text>
  <rect x="55" y="110" width="255" height="110" rx="16" class="b"/><text x="80" y="148" class="t">Engineer</text><text x="80" y="180" class="s">Which assumptions and boundaries?</text>
  <rect x="55" y="275" width="255" height="110" rx="16" class="b"/><text x="80" y="313" class="t">Operator or inspector</text><text x="80" y="345" class="s">What changed in the field?</text>
  <rect x="55" y="440" width="255" height="110" rx="16" class="b"/><text x="80" y="478" class="t">Finance</text><text x="80" y="510" class="s">What service and lifecycle cost?</text>
  <rect x="890" y="110" width="255" height="110" rx="16" class="b"/><text x="915" y="148" class="t">Leadership</text><text x="915" y="180" class="s">What risk and accountability?</text>
  <rect x="890" y="275" width="255" height="110" rx="16" class="b"/><text x="915" y="313" class="t">Wastewater manager</text><text x="915" y="345" class="s">Is wet weather in the wrong pipe?</text>
  <rect x="890" y="440" width="255" height="110" rx="16" class="b"/><text x="915" y="478" class="t">Public or elected official</text><text x="915" y="510" class="s">What was promised and proven?</text>
  <path d="M310 165L400 245M310 330H400M310 495L400 410M800 245L890 165M800 330H890M800 410L890 495" class="line"/>
  <text x="42" y="615" class="s">Shared terminology connects questions. It does not assign professional or legal responsibility.</text>
</svg>
