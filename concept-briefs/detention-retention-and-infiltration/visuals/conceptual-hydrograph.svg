<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">Conceptual inflow and delayed outflow hydrograph</title>
  <desc id="desc">A qualitative graph compares an earlier higher inflow peak with a later lower outflow peak and identifies recession and event volume.</desc>
  <defs><style>.h{font:700 26px Arial;fill:#fff}.t{font:700 16px Arial;fill:#fff}.s{font:500 14px Arial;fill:#bcd6e4}.axis{stroke:#9db5c1;stroke-width:2}.grid{stroke:#355266;stroke-width:1}.in{fill:none;stroke:#ffb45b;stroke-width:7}.out{fill:none;stroke:#55c2ff;stroke-width:7}</style></defs>
  <rect width="1100" height="620" fill="#081822"/><text x="50" y="52" class="h">Read the storm from left to right</text>
  <g transform="translate(100 110)"><path d="M0 0v390h880" class="axis"/><path d="M0 80h880M0 160h880M0 240h880M0 320h880" class="grid"/><text x="-60" y="200" class="s" transform="rotate(-90 -60 200)">Relative flow</text><text x="410" y="435" class="s">Time</text>
  <path d="M0 390C120 385 150 330 220 115C275 15 330 130 390 260C450 345 560 375 880 390" class="in"/>
  <path d="M0 390C170 385 245 340 350 220C440 125 535 165 625 250C705 330 785 370 880 385" class="out"/>
  <path d="M220 115v275M470 185v205" stroke="#fff" stroke-width="2" stroke-dasharray="7 7"/>
  <text x="150" y="86" class="t" fill="#ffb45b">Earlier inflow peak</text><text x="410" y="155" class="t" fill="#55c2ff">Later outflow peak</text>
  <text x="630" y="300" class="s">Recession continues after rainfall</text><text x="510" y="360" class="s">Area across time represents volume</text></g>
  <rect x="760" y="42" width="22" height="8" fill="#ffb45b"/><text x="790" y="52" class="s">Inflow</text><rect x="900" y="42" width="22" height="8" fill="#55c2ff"/><text x="930" y="52" class="s">Outflow</text>
  <text x="50" y="585" class="s">Qualitative teaching curves only. This is not calibrated model output or a design result.</text>
</svg>
