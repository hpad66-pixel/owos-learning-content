<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Maintenance condition to pathway consequence</title>
  <desc id="desc">Four columns separate visible observation, pathway question, possible consequence, and evidence needed before diagnosis.</desc>
  <defs><style>.h{font:700 25px Arial;fill:#fff}.t{font:700 17px Arial;fill:#fff}.s{font:500 14px Arial;fill:#c5dce8}.box{fill:#123247;stroke:#466b81;stroke-width:2}.arrow{stroke:#55c2ff;stroke-width:5;fill:none}</style></defs>
  <rect width="1200" height="600" fill="#081822"/><text x="40" y="48" class="h">Condition changes the route before it changes the report</text>
  <g transform="translate(35 100)"><rect width="250" height="330" rx="18" class="box"/><text x="24" y="40" class="t">1  Observation</text><text x="24" y="90" class="s">Sediment</text><text x="24" y="125" class="s">Surface clogging</text><text x="24" y="160" class="s">Outlet blockage</text><text x="24" y="195" class="s">Erosion</text><text x="24" y="230" class="s">High downstream water</text><text x="24" y="265" class="s">Changed recovery</text></g>
  <g transform="translate(330 100)"><rect width="250" height="330" rx="18" class="box"/><text x="24" y="40" class="t">2  Pathway question</text><text x="24" y="90" class="s">Storage reduced?</text><text x="24" y="125" class="s">Surface entry restricted?</text><text x="24" y="160" class="s">Ordinary release blocked?</text><text x="24" y="195" class="s">Flow redirected?</text><text x="24" y="230" class="s">Discharge constrained?</text><text x="24" y="265" class="s">Hidden route changed?</text></g>
  <g transform="translate(625 100)"><rect width="250" height="330" rx="18" class="box"/><text x="24" y="40" class="t">3  Possible consequence</text><text x="24" y="90" class="s">Less usable storage</text><text x="24" y="125" class="s">More surface runoff</text><text x="24" y="160" class="s">Longer high water</text><text x="24" y="195" class="s">Sediment movement</text><text x="24" y="230" class="s">Slower drawdown</text><text x="24" y="265" class="s">More overflow</text></g>
  <g transform="translate(920 100)"><rect width="245" height="330" rx="18" class="box"/><text x="24" y="40" class="t">4  Evidence next</text><text x="24" y="90" class="s">Plans and survey</text><text x="24" y="125" class="s">Rainfall and timing</text><text x="24" y="160" class="s">Safe inspection</text><text x="24" y="195" class="s">Water levels</text><text x="24" y="230" class="s">Downstream condition</text><text x="24" y="265" class="s">Qualified review</text></g>
  <path d="M285 265h45M580 265h45M875 265h45" class="arrow"/><rect x="190" y="480" width="820" height="70" rx="16" fill="#7b391f"/><text x="240" y="523" class="t">Observation guides the next question. It is not yet a diagnosis or repair authorization.</text>
</svg>
