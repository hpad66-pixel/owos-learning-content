<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
  <title id="title">Wet pond permanent pool and temporary storm storage</title>
  <desc id="desc">A cross-section separates pond bottom, permanent pool, normal water level, temporary storm storage, outlet, overflow, and downstream water.</desc>
  <defs><style>.h{font:700 26px Arial;fill:#fff}.t{font:700 17px Arial;fill:#fff}.s{font:500 14px Arial;fill:#c8dfeb}.line{stroke:#fff;stroke-width:2;stroke-dasharray:8 7}</style></defs>
  <rect width="1000" height="650" fill="#081822"/><text x="45" y="50" class="h">A wet pond holds normal water and temporary storm storage</text>
  <path d="M70 160h210l140 350h210l140-350h170v420H70z" fill="#6f7c55"/>
  <path d="M285 265l115 245h250l110-245z" fill="#207eaa"/><path d="M285 265q240-30 475 0" fill="none" stroke="#8edfff" stroke-width="5"/>
  <path d="M250 175l60 95h425l60-95z" fill="#55c2ff" opacity=".35"/><path d="M250 175h545" class="line"/>
  <path d="M285 265h475" class="line"/>
  <path d="M350 420h340" class="line"/>
  <text x="70" y="180" class="t">Overflow elevation</text><text x="70" y="210" class="s">Higher release boundary</text>
  <text x="95" y="245" class="t">Temporary storm storage</text><text x="95" y="272" class="s">Water rises here during an event</text>
  <text x="70" y="306" class="t">Normal water level</text><text x="70" y="333" class="s">Conceptual control level</text>
  <text x="445" y="355" class="t">Permanent pool</text><text x="445" y="382" class="s">Normally wet between storms</text>
  <text x="430" y="500" class="t">Pond bottom</text>
  <rect x="730" y="230" width="56" height="115" rx="8" fill="#e7edf0"/><circle cx="758" cy="275" r="12" fill="#081822"/><path d="M785 275h95" stroke="#55c2ff" stroke-width="9"/><text x="810" y="250" class="t">Outlet</text>
  <rect x="820" y="370" width="130" height="80" rx="12" fill="#12344a"/><path d="M830 410q55-30 110 0" fill="none" stroke="#55c2ff" stroke-width="5"/><text x="832" y="478" class="s">Downstream water</text>
  <text x="45" y="610" class="s">Conceptual relationships only. Real elevations, terminology, and performance come from applicable plans and authority.</text>
</svg>
