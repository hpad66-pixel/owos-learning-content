<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Permit to maintained public value</title>
  <desc id="desc">A six-step handoff connects public objective, approved condition, responsible party, access and funding, evidence, and correction.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#2f8fbd"/></marker><style>.h{font:700 25px Arial;fill:#102536}.t{font:700 16px Arial;fill:#102536}.s{font:500 13px Arial;fill:#405b6b}.b{fill:#f4f0e7;stroke:#9cadb6;stroke-width:2}.ar{stroke:#2f8fbd;stroke-width:5;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="560" fill="#fbfaf6"/><text x="42" y="48" class="h">A permit has value when responsibility becomes maintained evidence</text>
  <g transform="translate(35 120)"><rect width="160" height="210" rx="18" class="b"/><text x="20" y="42" class="t">1  Public objective</text><text x="20" y="85" class="s">Protect water</text><text x="20" y="112" class="s">and manage</text><text x="20" y="139" class="s">discharge</text></g>
  <g transform="translate(230 120)"><rect width="160" height="210" rx="18" class="b"/><text x="20" y="42" class="t">2  Approved</text><text x="20" y="68" class="t">condition</text><text x="20" y="112" class="s">Permit and</text><text x="20" y="139" class="s">plans</text></g>
  <g transform="translate(425 120)"><rect width="160" height="210" rx="18" class="b"/><text x="20" y="42" class="t">3  Responsible</text><text x="20" y="68" class="t">party</text><text x="20" y="112" class="s">Named owner</text><text x="20" y="139" class="s">or operator</text></g>
  <g transform="translate(620 120)"><rect width="160" height="210" rx="18" class="b"/><text x="20" y="42" class="t">4  Access and</text><text x="20" y="68" class="t">funded work</text><text x="20" y="112" class="s">Inspection</text><text x="20" y="139" class="s">maintenance</text></g>
  <g transform="translate(815 120)"><rect width="160" height="210" rx="18" class="b"/><text x="20" y="42" class="t">5  Evidence</text><text x="20" y="85" class="s">Records</text><text x="20" y="112" class="s">monitoring</text><text x="20" y="139" class="s">reporting</text></g>
  <g transform="translate(1010 120)"><rect width="155" height="210" rx="18" class="b"/><text x="20" y="42" class="t">6  Correction</text><text x="20" y="85" class="s">Respond</text><text x="20" y="112" class="s">renew</text><text x="20" y="139" class="s">document</text></g>
  <path d="M195 225h35M390 225h35M585 225h35M780 225h35M975 225h35" class="ar"/>
  <rect x="145" y="390" width="910" height="85" rx="18" fill="#102f49"/><text x="190" y="425" font-family="Arial" font-size="18" font-weight="700" fill="#fff">The permit is not the asset, and it does not prove performance.</text><text x="190" y="455" font-family="Arial" font-size="14" fill="#c7dce7">Its value is the accountable chain from authorized condition to work, evidence, and correction.</text>
  <text x="42" y="525" class="s">Federal permit concepts only. Applicability, compliance, enforcement, and state or local requirements are outside this brief.</text>
</svg>
