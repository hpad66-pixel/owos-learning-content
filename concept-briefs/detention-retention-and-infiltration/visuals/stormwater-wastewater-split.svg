<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">One rain event and two utility systems</title>
  <desc id="desc">The intended stormwater route is compared with unintended groundwater and surface inflow into a separate sanitary sewer, pump station, and wastewater treatment system.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#55c2ff"/></marker><marker id="w" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#ffb45b"/></marker><style>.h{font:700 25px Arial;fill:#fff}.t{font:700 17px Arial;fill:#fff}.s{font:500 14px Arial;fill:#c3d9e5}.b{fill:#102f49;stroke:#42667d;stroke-width:2}.blue{stroke:#55c2ff;stroke-width:6;fill:none;marker-end:url(#a)}.orange{stroke:#ffb45b;stroke-width:6;fill:none;stroke-dasharray:11 8;marker-end:url(#w)}</style></defs>
  <rect width="1200" height="650" fill="#081822"/><text x="44" y="48" class="h">Same rain. Different system purpose.</text>
  <path d="M600 75v55" stroke="#55c2ff" stroke-width="8"/><path d="M570 95h60" stroke="#55c2ff" stroke-width="5"/><text x="635" y="105" class="s">Rain and rising groundwater</text>
  <rect x="45" y="155" width="520" height="410" rx="20" class="b"/><text x="75" y="198" class="t">Intended stormwater route</text>
  <rect x="85" y="245" width="145" height="90" rx="14" fill="#17425c"/><text x="110" y="282" class="t">Inlet</text><text x="110" y="307" class="s">and pipe</text>
  <rect x="310" y="245" width="190" height="90" rx="14" fill="#17425c"/><text x="335" y="282" class="t">Storage</text><text x="335" y="307" class="s">or treatment</text>
  <rect x="310" y="410" width="190" height="90" rx="14" fill="#17425c"/><text x="335" y="447" class="t">Outfall</text><text x="335" y="472" class="s">receiving water</text>
  <path d="M230 290h80M405 335v75" class="blue"/>
  <rect x="635" y="155" width="520" height="410" rx="20" class="b"/><text x="665" y="198" class="t">Unintended entry into separate sanitary sewer</text>
  <rect x="670" y="245" width="155" height="90" rx="14" fill="#4b3325"/><text x="692" y="280" class="t">Defect or</text><text x="692" y="306" class="s">direct connection</text>
  <rect x="875" y="245" width="220" height="90" rx="14" fill="#4b3325"/><text x="900" y="280" class="t">Sanitary sewer</text><text x="900" y="306" class="s">extra hydraulic flow</text>
  <rect x="680" y="410" width="170" height="90" rx="14" fill="#4b3325"/><text x="705" y="447" class="t">Pump station</text><text x="705" y="472" class="s">energy and capacity</text>
  <rect x="900" y="410" width="205" height="90" rx="14" fill="#4b3325"/><text x="925" y="447" class="t">Treatment</text><text x="925" y="472" class="s">storage and capital</text>
  <path d="M825 290h50M985 335v40q0 35-135 80M850 455h50" class="orange"/>
  <text x="45" y="615" class="s">Concept only. No I&amp;I source, quantity, system capacity, cost, or remedy is determined.</text>
</svg>
