schema_version: 1
contract: owos-concept-brief/2
brief_id: owos:concept-brief:003
learning:
  outcomes:
    - Trace the possible surface, subsurface, controlled-release, overflow, bypass, and unintended wastewater pathways associated with one storm.
    - Distinguish detention, retention, and infiltration without presenting one regional naming convention as universal.
    - Explain a permanent pool and the temporary storm storage above it without inferring performance from appearance.
    - Read the basic inflow, storage, and delayed-outflow story in a qualitative hydrograph.
    - Select evidence that addresses timing, volume, concentration, total load, site constraints, and maintenance condition.
    - Explain how wet-weather infiltration and inflow consume capacity in a separate sanitary sewer.
    - Connect permit responsibility, maintenance evidence, lifecycle funding, and public value.
    - Complete the 11-question system conversation while making uncertainty visible.
  prior_knowledge:
    - Basic awareness that stormwater runoff moves from land into drainage systems or receiving waters.
  misconception: A familiar practice name, permanent pool, dry surface, permit, or lower concentration proves the complete water pathway and present performance.
  transfer_task: Complete the 11-question system conversation for an unfamiliar conceptual stormwater system and state one result, one uncertainty, one responsibility, and one next piece of evidence.
  cross_sector_connections:
    - Wet-weather infiltration and inflow can consume separate sanitary-sewer conveyance, pumping, treatment, and storage capacity.
    - Drinking-water source protection and recharge planning may involve infiltration, but source-water and groundwater protection questions require their own evidence.
    - Water reuse can retain or store water for beneficial use, but reuse quality, treatment, and authorization are outside this stormwater concept brief.
    - Asset management and finance connect the intended stormwater service to inspection, maintenance, renewal, and lifecycle funding.
  experience_profile:
    visual_explanations_minimum: 4
    dynamic_explanation_required: true
    distributed_checks_minimum: 2
    final_applied_check_required: true
    shared_registry: owos-learning-capabilities/1
