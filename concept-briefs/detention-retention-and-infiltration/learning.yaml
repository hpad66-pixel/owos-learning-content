learner_experience:
  quick_orientation: Follow the water. Find the control. Name the responsibility. Ask for the evidence.
  orientation:
    subject: What actually happens to rain after it lands, and why the name on the drawing is weaker evidence than most people assume.
    audience: Anyone who has to talk about, pay for, inspect, approve, explain, or answer for a stormwater asset without necessarily being the person who designed it. That includes operators, inspectors, engineers working outside their specialty, asset managers, finance staff, executives, elected officials, developers, regulators, educators, and members of the public. The only thing assumed is that you know rain runs off streets and roofs into drains.
    why_it_matters: A utility can approve an asset that does not do what its name implies, spend capital adding capacity when the real problem was a blocked outlet, carry and treat rainwater in a sanitary sewer for years without attributing the cost, or tell the public a pond prevents flooding and lose credibility during the storm that proves otherwise. None of those failures require anyone to be careless. They require only that people trust a familiar word instead of tracing the water.
    time_estimate: Eighteen to twenty five minutes, including the interactive checks.
    scope_boundary: This brief will not size, design, model, permit, inspect, operate, or certify anything. It does not give you a drawdown time, an infiltration rate, a separation distance, a removal percentage, or a compliance determination. It uses United States federal and EPA authority only. State requirements are handled separately.
  primary_navigation_maximum: 4
  required_top_drawers:
    - graph-drawer
    - community-drawer
  closing_recap_labels:
    - What changed
    - What to observe
    - What not to assume
  comment_placement: after_learning_and_commercial
  community_mode: compact_entry_plus_drawer
  sop_boundary: outline_only
  inactive_commercial_placement: hidden
  learner_facing_governance_metadata: minimal
