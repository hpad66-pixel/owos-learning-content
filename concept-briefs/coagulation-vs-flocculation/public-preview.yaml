quick_takeaway:
  label: IN 30 SECONDS
  title: Three different jobs, in the right order.
  items:
    - Coagulation changes particle stability or creates precipitates that can capture particles.
    - Flocculation creates controlled contact so destabilized material can grow into removable aggregates.
    - Sedimentation and filtration remove what the upstream chemistry and contact stages prepared.
