final_recap:
  - label: What changed
    body: The particle condition changes first, then controlled contact builds aggregates, then separation removes them.
  - label: What to observe
    body: Trace source water, chemistry, mixing, clarification, sample location, and downstream filtration together.
  - label: What not to assume
    body: One symptom, one jar result, or this educational model does not identify or authorize a facility setting change.
