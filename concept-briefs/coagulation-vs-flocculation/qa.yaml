automated_checks:
  package_validation:
    status: passed_working
    evidence: python3 tools/concept_brief_compiler.py validate concept-briefs/coagulation-vs-flocculation
  deterministic_build:
    status: passed
    evidence: python3 tools/test-concept-brief-compiler.py
  portfolio_distinctiveness:
    status: passed_one_pilot
    evidence: python3 tools/concept_brief_compiler.py portfolio-check concept-briefs
  release_gate:
    status: blocked_as_required
    evidence: Release validation reported incomplete claim verification, technical review, manual reviews, Graph and Community review, commercial review, and approvals.
  source_snapshot_integrity:
    status: passed
    evidence: All three owner-supplied originals are preserved in sources/intake and match the recorded SHA-256 checksums.
  public_integration_surfaces:
    status: passed_working
    evidence: The current educational edition contains library navigation, curated related learning, Community context, an inline comment form, a privacy boundary, and a copyable eight-section SOP outline.
  desktop_containment:
    status: passed_working_preview
    evidence: Headless Chrome at 1440 pixels reported scroll width equal to viewport width.
  phone_containment:
    status: passed_after_compiler_fix
    evidence: Headless Chrome at 390 pixels reported scroll width 390 and no overflow.
  qualitative_interaction:
    status: passed_working
    evidence: Headless browser selected the flocculation stage and excessive-energy state, updated the model data state, and exposed a breakage explanation in the polite live region.
  canvas_animation:
    status: passed_working
    evidence: Browser frames changed under standard motion at desktop and tablet widths, remained static under reduced motion at phone width, and retained the complete text fallback without JavaScript.
  tablet_containment:
    status: passed_working
    evidence: Headless Chrome at 820 pixels reported scroll width equal to viewport width.
  keyboard_focus:
    status: passed_working
    evidence: Tab navigation reached a native jar control, displayed a solid focus outline, and drawer close returned focus to its opener.
  public_sop_outline:
    status: passed_working
    evidence: The browser copied the complete eight-section outline without storing facility information or presenting a public intake as a finished SOP.
  reduced_motion:
    status: passed_working
    evidence: The 390-pixel reduced-motion context reported reduced motion active and automatic rather than smooth scrolling.
  no_javascript:
    status: passed_working
    evidence: The JavaScript-disabled phone context retained the text equivalent, model boundary, and page containment.
  united_states_authority_scope:
    status: passed_working
    evidence: Package audit found no excluded jurisdiction references, and the compiler regression rejected a non-United States governing source.
  governed_commercial_placement:
    status: passed_working_candidate
    evidence: The compiler renders an APAS house placement and a visibly non-live vendor placeholder; the OWOS platform registry controls logos, copy, links, content targeting, directory linkage, vendor-account assignment, aggregate events, pause, resume, and soft archive.
  commercial_firewall:
    status: passed_automated_pending_human_review
    evidence: The package requires editorial_rights none; the platform requires an explicit independence attestation for Concept Brief and directory placements; commercial ordering cannot change claims, evidence, corrections, reviewers, related learning, Graph ranking, or neutral directory results.
  platform_control_plane:
    status: passed_local_platform_qa
    evidence: The OWOS platform worktree now includes indexable current-edition delivery, Concept Brief catalog placement, a protected Author Studio, a moderated reader-feedback queue with reply and review states, immutable version bundles, separate current-edition and independently verified publication controls, a single active pointer, rollback, dynamic Graph projection, Community context, and commercial runtime bindings. tools/test-concept-briefs.mjs passed.
  public_feedback_workflow:
    status: passed_local_platform_qa
    evidence: Inline technical comments, source suggestions, questions, and field observations post to the authenticated Community. The Author Studio receives the same records and supports steward replies plus open, reviewed, incorporated, and closed states.
  current_edition_publication:
    status: passed_local_platform_qa
    evidence: The catalog and route expose the brief as Current edition with indexable published-educational headers. Public-facing candidate language and noindex behavior were removed. Independently verified release remains a separate stricter control.
  learner_economy_contract:
    status: passed_compiler_and_browser_qa
    evidence: The reusable compiler and package validation require the In 30 Seconds orientation, exactly four or fewer primary controls, minimal learner-facing governance metadata, the three-part closing recap, the compact end comment placement, outline-only SOP value, drawer-based Community expansion, and hidden inactive commercial placements.
  learner_completion_render:
    status: passed_desktop_tablet_phone_reduced_motion_and_no_javascript
    evidence: Browser QA confirmed four primary controls, top Graph and Community drawers with focus return, three recap items, one end-of-brief feedback form after the APAS placement, no inactive vendor card, SOP outline copy, no horizontal overflow, reduced-motion behavior, and the no-JavaScript text equivalent.
  online_visual_asset_parity:
    status: passed_self_contained_build_and_rendered_qa
    evidence: The treatment-train, cross-sector, and APAS SVG assets are embedded in the public HTML. No ../visuals route dependency remains, both instructional figures report natural dimensions at desktop, tablet, and phone sizes, and core figures no longer depend on scroll-reveal timing.
  top_connected_learning_actions:
    status: passed_compiler_and_rendered_browser_qa
    evidence: The reusable compiler now requires Graph and Community controls in public top navigation. Both open same-screen responsive drawers, Escape closes them, and focus returns to the initiating control.
  guided_decision_rehearsal:
    status: passed_compiler_and_rendered_browser_qa
    evidence: The compiler renders a four-step worked example from observed symptom through evidence, authority, monitoring, and rollback; the adjacent Try it yourself panel is clearly optional and does not satisfy or block completion. Desktop, tablet, phone, keyboard, reduced-motion, and no-JavaScript checks reported zero failures.
  guided_rehearsal_contrast:
    status: passed_rendered_visual_review
    evidence: Desktop and phone screenshots were visually inspected after correcting the optional comparison panel to dark text on a pale blue surface.
  course_connection_truth:
    status: passed_repository_inventory
    evidence: The Concept Brief and Course Engines share the governed capability and learning-record contracts. No coagulation or water-treatment course exists under apps, so course_connections remains empty and the package records the missing governed destination instead of inventing one.
  platform_community_economy:
    status: passed_local_platform_qa
    evidence: Concept Brief runtime sets the shared Community component to drawer-only mode. The full Community interface does not reappear inside the brief; the header control, compact brief entry, and final comment form route into the same moderated backend queue.
  learn_catalog_metadata_subtraction:
    status: passed_local_platform_qa
    evidence: OWOS Learn no longer markets the internal governed-claim count on the public Concept Brief card. The internal catalog may retain the count for administrator and governance use.
  positive_feedback_and_testimonial_consent:
    status: passed_compiler_browser_and_api_qa
    evidence: The end form includes What worked for me and a separate publication-consent control. The backend preserves consent on the Community record and rejects a super-administrator feature request when consent is absent.
  testimonial_moderation_and_public_projection:
    status: passed_local_platform_qa
    evidence: A consented appreciation remains private until an OWOS learning steward approves it. The public endpoint returns only consented and featured comments, exposes no user ID, labels the material as learner experience rather than evidence, and supports unfeature without deleting history.
  concept_brief_audience_analytics:
    status: passed_local_platform_qa
    evidence: The runtime records session-bounded views, engaged reads, completion reaches, and authenticated comments against the Concept Brief slug. Author Studio reports views, recent unique viewers, reads, completion reaches, comments, reviewed comments, consented appreciations, and featured testimonials; the central administrator analytics also includes the Concept Brief content family.
  learn_catalog_render:
    status: passed_desktop_and_phone
    evidence: Headless Chrome rendered the Concept Brief card and filter in OWOS Learn at 1440 and 390 pixels with no horizontal overflow and correct type filtering.
  author_studio_render:
    status: passed_local_platform_qa
    evidence: Headless Chrome loaded the registered brief, Graph record, Community record, commercial contract, approvals, compiled HTML, and fail-closed release controls in the administrator Author Studio.
  public_graph_build:
    status: passed_local_platform_qa
    evidence: The OWOS public Graph builder completed with 124 public pages and 356 links, including the Concept Brief, coagulation, flocculation, jar testing, sedimentation, and filtration nodes.
  expert_claim_review_packet:
    status: generated_pending_expert_completion
    evidence: qa/expert-claim-review-packet.md contains all 36 candidate material claims and all 13 rejected or withheld claims; qa/expert-claim-review-register.csv provides one structured response row for each of the 49 inventoried claims.
notes:
  - Working package created from the supplied prototype and product direction.
  - The corrected preview restores the supplied v4.2 page's twelve numbered sections, black, blue, white, and gold surface rhythm, Bebas Neue, Barlow, Libre Baskerville, and Space Mono hierarchy, dense cards, evidence tables, role views, and connected-learning close.
  - The second visual correction restores the original full-width canvas interaction pattern, four-stage tabs, stability graphic, horizontal treatment train, scroll reveals, and gold pull-quote pacing.
  - Numeric simulator thresholds, universal jar-test settings, unsupported chemistry equations, and overbroad regulatory statements were not restored as confident instruction.
  - The controlled commercial-placement candidate is owner-approved. No real vendor, fact, technical value, Graph edge, Community policy, legal clearance, or release is approved.
  - The APAS and vendor-placeholder block passed desktop, tablet, and phone rendering with no horizontal overflow. The provisional APAS wordmark is a preview asset and remains replaceable from the administrator-controlled campaign record.
  - The expert claim-review packet and editable CSV register are ready for independent practitioner review. They do not change verification status until a named qualified reviewer returns claim-level decisions and evidence locators.
  - The supplied HTML material-claim inventory is complete for version 4.2: 49 traced claims, including 36 candidate delivery claims and 13 rejected original propositions retained for correction history.
  - The supplied HTML, strategy handoff, and FOG OS visual-reference deck are preserved inside the package with matching SHA-256 checksums.
  - The Concept Brief library, curated related-learning drawer and section, Community context handoff, inline comment form, and copyable SOP outline are implemented in the current educational edition.
  - The final learner-facing pass keeps top Graph and Community drawers, limits primary navigation to Start, Live Jar, Graph, and Community, and places the compact comment form at the true end before the footer.
  - Positive learner feedback is never published automatically. Public testimonial projection requires explicit member consent and separate moderator approval, and removal preserves the original Community and moderation record.
  - The browser-saved JSON intake was removed after owner review because it added workflow without delivering a governed facility procedure. A full SOP builder is reserved for a separate authenticated agent product.
  - Primary-source research trace is complete for the current delivery claims, but independent verification and qualified technical review are not complete.
  - The current educational edition uses only current United States federal requirements and EPA guidance for its governing frame. State regulations and state training sources are excluded from learner-facing content; AWWA material remains clearly labeled professional context.
  - Reviewer packet: qa/technical-review-dossier.md.
  - Working QA report: qa/working-build-report.md.
  - In-app browser initialization failed; the bundled headless Chrome runtime completed the rendered checks.
  - The complete platform control plane is implemented and locally validated. The public route is the indexable current educational edition. A separate independently verified release state remains unavailable until its stricter evidence records exist.
  - The former cryptic transfer instruction is replaced by a learner-visible decision rehearsal and optional personal practice. Personal practice is not required for completion and prohibits facility-sensitive input.
  - The in-app browser plugin failed during initialization with a runtime property error. The repository browser QA harness completed the rendered review in headless Chrome with zero failures.
