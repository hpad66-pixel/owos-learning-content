  dominant_visual: animated_particle_jar
  interaction_signature: alter_conditions_then_diagnose_visible_consequence
  role_treatment: one_process_seen_through_operator_engineer_executive_and_supplier_decisions
  closing_action: record_one_facility_specific_question_before_changing_dose_or_mixing
  surface_rhythm:
    - black_mechanism
    - blue_orientation
    - white_explanation
    - black_consequence
    - off_white_evidence
  intentionally_avoided:
    - fixed_nine_section_sequence
    - decorative_icon_grid
    - generic_end_quiz
    - unlabeled_operating_thresholds
  adjacent_differences:
    - A sedimentation brief should center a settling-column or loading-rate mechanism rather than reuse the jar.
