- claim_id: claim-zeta-range
  claim_text: Raw water typically has zeta potential from minus 15 to minus 30 millivolts, and successful
    coagulation drives it toward zero.
  claim_type: sourced_fact
  material: false
  technical: true
  evidence_tier: supplied_prototype
  source_ids: []
  verification_methods: [source_trace]
