schema_version: 1
contract: owos-concept-brief/2
brief_id: owos:concept-brief:001
inventory_status: complete_for_supplied_html_v4_2
inventory_method: Material factual, regulatory, technical, quantitative, practice, and outcome assertions
  were extracted from all visible source sections. Interface labels and purely rhetorical copy were excluded.
claims:
- claim_id: claim-distinct-jobs
  claim_text: Coagulation and flocculation are separately defined processes in federal regulation. Coagulation
    destabilises and agglomerates colloidal and suspended material into flocs using coagulant chemicals
    and mixing. Flocculation enhances agglomeration of smaller floc particles into larger, more easily
    settleable particles through gentle stirring.
  claim_type: sourced_fact
  material: true
  technical: true
  evidence_tier: us_federal_primary_authority
  source_ids: [source-ecfr-141-2, source-epa-lt1]
  verification_methods: [source_trace]
  verification_status: pending
  scope: Drinking-water clarification.
  limitations: Coagulation can involve charge neutralization, sweep coagulation, adsorption, bridging,
    or combinations; the chemical-versus-physical shorthand is incomplete.
  affected_blocks: [block-opening]
  research_disposition: retain_with_mechanism_nuance
- claim_id: claim-universal-nonsettling
  claim_text: All clay, silt, algae, organic colour, bacteria, and precipitated metals are too small and
    electrically stable to ever settle, so gravity can never remove them.
  claim_type: sourced_fact
  material: false
  technical: true
  evidence_tier: supplied_prototype
  source_ids: []
  verification_methods: [source_trace]
  verification_status: rejected
  scope: Original opening statement.
  limitations: The listed materials span different particle sizes, densities, surface chemistries, and
    settling behaviour.
  affected_blocks: [block-opening]
  research_disposition: replace_with_conditioned_statement
- claim_id: claim-particle-stability
  claim_text: Some fine and colloidal particles settle very slowly because of their size and stability,
    and coagulation-flocculation can improve their removal.
  claim_type: sourced_fact
  material: true
  technical: true
  evidence_tier: government_guidance
  source_ids: [source-epa-lt1]
  verification_methods: [source_trace]
  verification_status: pending
  scope: Drinking-water clarification.
  limitations: Settling behaviour remains water-specific and particle-specific.
  affected_blocks: [block-opening]
  research_disposition: replacement_for_claim_universal_nonsettling
- claim_id: claim-us-credit-at-coagulation
  claim_text: Under the United States Surface Water Treatment Rule, turbidity and log-removal credit is
    earned in coagulation rather than at the filter.
  claim_type: regulatory_requirement
  material: false
  technical: true
  evidence_tier: supplied_prototype
  source_ids: [source-epa-swtr-turbidity]
  verification_methods: [source_trace]
  verification_status: rejected
  scope: Original United States regulatory statement.
  limitations: Filtered-water turbidity is a regulated performance measure and removal credit is associated
    with the treatment train, not coagulation alone.
  affected_blocks: [block-evidence-boundary]
  research_disposition: do_not_publish
- claim_id: claim-us-filtered-water-turbidity
  claim_text: Under applicable United States Surface Water Treatment Rules, conventional and direct filtration
    systems must meet combined filter effluent turbidity limits of 0.3 NTU in at least 95 percent of measurements
    each month and 1 NTU as the maximum.
  claim_type: regulatory_requirement
  material: true
  technical: true
  evidence_tier: us_federal_regulation
  source_ids: [source-ecfr-141-173, source-ecfr-141-551, source-epa-swtr-turbidity]
  verification_methods: [source_trace]
  verification_status: pending
  jurisdiction: United States
  effective_date: current_electronic_cfr_reviewed_2026-07-25
  scope: Public water systems using conventional or direct filtration and covered by the applicable federal
    Surface Water Treatment Rule provisions.
  limitations: System size, rule subpart, filtration technology, monitoring, reporting, and current federal
    applicability must be confirmed before use.
  affected_blocks: [block-evidence-boundary]
  research_disposition: proposed_us_federal_regulatory_replacement
- claim_id: claim-sludge-factor
  claim_text: One milligram per litre of alum fed produces about 0.26 milligrams per litre of sludge.
  claim_type: technical_standard
  material: false
  technical: true
  evidence_tier: supplied_prototype
  source_ids: []
  verification_methods: [source_trace]
  verification_status: rejected
  scope: Removed numeric teaching factor.
  limitations: This is not total plant sludge production; captured source-water solids, organics, other
    chemicals, product basis, and water content change actual residuals.
  affected_blocks: [block-evidence-boundary]
  research_disposition: remove_numeric_factor_unless_exact_stoichiometric_basis_is_verified
- claim_id: claim-turbidity-proxy
  claim_text: Filtered-water turbidity is an operational indicator of treatment performance and potential
    pathogen-removal performance, not a direct measurement of pathogen concentration.
  claim_type: sourced_fact
  material: true
  technical: true
  evidence_tier: federal_health_guidance
  source_ids: [source-epa-swtr-turbidity, source-epa-lt1]
  verification_methods: [source_trace]
  verification_status: pending
  scope: Drinking-water treatment performance.
  limitations: It must not be described as a complete or visible proxy for pathogen protection.
  affected_blocks: [block-evidence-boundary]
  research_disposition: replace_public_trust_wording
- claim_id: claim-consent-order
