- claim_id: claim-pin-floc
  claim_text: Pin floc, meaning small floc that is difficult to settle and filter, is documented by EPA
    as a consequence of dosing coagulant at excessive rates. The appearance alone does not identify a
    cause, because inadequate contact and marginal chemistry can also produce it.
  claim_type: sourced_fact
  material: true
  technical: true
  evidence_tier: government_guidance
  source_ids: [source-epa-swtr-turbidity]
  verification_methods: [source_trace, independent_full_text_extraction]
  verification_status: pending
  scope: One documented plant performance evaluation. Not a general rule that pin floc always indicates
    overdosing.
  limitations: A single case study. Establishes that excessive dosing can cause pin floc, not that it
    always does. Inadequate contact and marginal chemistry remain plausible from the same observation.
  affected_blocks: [block-pin-floc]
  research_disposition: narrow_term_by_sample_location_process_stage_and_downstream_result
  correction_note: Reversed 2026-07-27. The previous text taught pin floc as an intended intermediate
    and cited EPA 816-R-04-007, which contains the term zero times. Current EPA guidance uses it as an
    overdose signature.
