  technical: true
  evidence_tier: professional_practice_pending
  source_ids: [source-pnws-awwa]
  verification_methods: [source_trace]
  verification_status: pending
  scope: Idealized bulk mixing parameter.
  limitations: Unit consistency, delivered power, nonuniform shear, basin geometry, and limitations of
    mean G must be taught.
  affected_blocks: [block-terms]
  research_disposition: retain_qualitative_definition_and_withhold_equation_until_original_engineering_verification
  authority_note: Sole source is an AWWA conference paper, professional context rather than federal authority.
    A technical_standard classification read as governing.
