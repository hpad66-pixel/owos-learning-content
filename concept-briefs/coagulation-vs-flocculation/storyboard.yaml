schema_version: 1
contract: owos-concept-brief/2
brief_id: owos:concept-brief:001
status: research_incorporated_working_build_authorized_release_approval_pending
authorization_note: Hardeep Anand directed Codex to incorporate all research recommendations into the next HTML. The visual and animation language remain preserved while evidence status, citations, corrections, and boundaries are strengthened. This does not approve publication.
beats:
  - beat_id: beat-01-why
    learner_question: Why does the distinction matter?
    instructor_purpose: Establish the mechanism and the regulatory, operational, and public-trust stakes.
    block_ids: [block-opening]
    claims: [claim-distinct-jobs, claim-us-credit-at-coagulation, claim-turbidity-proxy]
    visual_or_interaction: stakes_grid
    learner_action: Separate the chemical condition from downstream contact and separation.
    intended_realization: Coagulation and flocculation are connected but perform different jobs.
    assessment_evidence: Learner can name the three-part mental model.
    transition: See the sequence as a controlled qualitative model.
    surface: white
    mobile_treatment: Stack the three stakes cards.
    reduced_motion_treatment: No motion required.
  - beat_id: beat-02-live-jar
    learner_question: What changes when one condition is weak?
    instructor_purpose: Show cause and consequence without transferable numeric thresholds.
    block_ids: [block-jar]
    claims: [claim-charge, claim-shear]
    visual_or_interaction: interaction-jar
    learner_action: Change one qualitative condition and diagnose the affected stage.
    intended_realization: A symptom locates an investigation, not an automatic setting.
    assessment_evidence: Learner states why the model cannot authorize a facility change.
    transition: Name the observations and mechanisms.
    surface: black
    mobile_treatment: Stack controls, vessel, and live explanation.
    reduced_motion_treatment: Discrete particle states carry the full meaning.
  - beat_id: beat-03-terms
    learner_question: What language do I need to describe the sequence accurately?
    instructor_purpose: Define the main concepts in plain English with visible boundaries.
    block_ids: [block-terms]
    claims: [claim-colloid-range, claim-zeta-range, claim-g-equation, claim-alkalinity]
    visual_or_interaction: term_card_matrix
    learner_action: Match each term to an observation or decision.
    intended_realization: The terms are related but not interchangeable.
    assessment_evidence: Learner explains one term without turning it into a universal target.
    transition: Follow the effect into the treatment train.
    surface: white
    mobile_treatment: Stack cards in reading order.
    reduced_motion_treatment: No motion required.
  - beat_id: beat-04-system
    learner_question: Where does the consequence appear downstream?
    instructor_purpose: Connect upstream condition and contact to separation, filtration, and adjacent sectors.
    block_ids: [block-system-fit]
    claims: [claim-downstream, claim-cross-sector-same-physics]
    visual_or_interaction: visual-treatment-train
    learner_action: Trace one weak stage through the train.
    intended_realization: A downstream symptom narrows the investigation but does not prove one cause.
    assessment_evidence: Learner names two observations needed before choosing an action.
    transition: Examine where evidence does and does not agree.
    surface: black
    mobile_treatment: Use the vertical visual and stacked sector boundaries.
    reduced_motion_treatment: Static arrows and labels carry the meaning.
  - beat_id: beat-05-evidence-split
    learner_question: Why is there no single correct rapid-mix number?
    instructor_purpose: Separate design convention, research, product response, and regulation.
    block_ids: [block-evidence-split]
    claims: [claim-design-ranges-universal, claim-park-study, claim-aktas-study]
    visual_or_interaction: evidence_comparison
    learner_action: Identify which evidence class can answer the facility question.
    intended_realization: Study values and design conventions are not automatic plant setpoints.
    assessment_evidence: Learner states one transfer limitation.
    transition: Correct the statements that would distort the diagnosis.
    surface: white
    mobile_treatment: Render each evidence row as a stacked record.
    reduced_motion_treatment: No motion required.
  - beat_id: beat-06-corrections
    learner_question: Which original statements must not survive unchanged?
    instructor_purpose: Preserve the correction record instead of silently rewriting the prototype.
    block_ids: [block-research-delta, block-corrections]
    claims: [claim-negative-charge-universal, claim-pin-floc, claim-pacl-pac]
    visual_or_interaction: correction_table
    learner_action: Compare the circulated statement with its governed correction.
    intended_realization: Accuracy work changes the teaching, not just the footnotes.
    assessment_evidence: Learner identifies why one original statement is unsafe.
    transition: Turn the corrected mechanism into a test workflow.
    surface: off_white
    mobile_treatment: Stack correction records with labels.
    reduced_motion_treatment: No motion required.
  - beat_id: beat-07-protocol
    learner_question: What does a defensible jar-test workflow preserve?
    instructor_purpose: Retain the workflow while removing universal speeds and timers.
    block_ids: [block-protocol]
    claims: [claim-jar-rpm-universal, claim-jar-purpose, claim-jar-sampling]
    visual_or_interaction: qualitative_protocol
    learner_action: Name the records required at each stage.
    intended_realization: Repeatability comes from the approved method, not a borrowed timer.
    assessment_evidence: Learner names sample location and method controls.
    transition: Apply the workflow to operating judgment.
    surface: black
    mobile_treatment: Stack the three stages vertically.
    reduced_motion_treatment: No timers or continuous animation.
  - beat_id: beat-08-judgment
    learner_question: What should I do before changing a setting?
    instructor_purpose: Contrast tempting shortcuts with governed investigation.
    block_ids: [block-decisions]
    claims: [claim-dose-year-round, claim-dose-change-sop, claim-alkalinity]
    visual_or_interaction: do_not_do_comparison
    learner_action: Rewrite one shortcut as an evidence question.
    intended_realization: Evidence and authority come before a process change.
    assessment_evidence: Learner names monitoring and rollback needs.
    transition: Audit the facility record.
    surface: white
    mobile_treatment: Place each unsafe and governed choice in sequence.
    reduced_motion_treatment: No motion required.
  - beat_id: beat-09-diagnostic
    learner_question: What is missing from our current decision record?
    instructor_purpose: Expose the evidence and governance gaps without assigning a misleading score.
    block_ids: [block-diagnostic, block-cross-sector-transfer, block-stage-check, block-transfer-check]
    claims: [claim-data-integration, claim-dose-change-sop]
    visual_or_interaction: eight_question_audit
    learner_action: Mark one question that cannot yet be answered from the record.
    intended_realization: A missing record is a work item, not an invitation to guess.
    assessment_evidence: Learner identifies one next evidence action.
    transition: Give each role a bounded responsibility.
    surface: black
    mobile_treatment: Use a numbered one-column audit.
    reduced_motion_treatment: No motion required.
  - beat_id: beat-10-roles
    learner_question: What does this mean for my role?
    instructor_purpose: Translate one mechanism into operator, engineering, leadership, data, source-water, and finance decisions.
    block_ids: [block-role-actions]
    claims: [claim-role-actions, claim-data-integration, claim-no-capital]
    visual_or_interaction: role_action_grid
    learner_action: Select the role action that fits current authority.
    intended_realization: Different roles own different evidence and decisions.
    assessment_evidence: Learner states who can authorize the next step.
    transition: Inspect the source and review boundary.
    surface: white
    mobile_treatment: Stack role cards.
    reduced_motion_treatment: No motion required.
  - beat_id: beat-11-evidence
    learner_question: How much of this working brief is actually verified?
    instructor_purpose: Show the source manifest, pending claims, corrections, and release boundary.
    block_ids: [block-evidence-boundary]
    claims: [claim-every-number-sourced, claim-evidence-boundary]
    visual_or_interaction: source_manifest
    learner_action: Distinguish source trace from qualified verification.
    intended_realization: A source is necessary, but it is not the same as completed review.
    assessment_evidence: Learner can explain why the preview remains blocked from release.
    transition: Continue into the Graph, Community, or governed SOP lifecycle.
    surface: off_white
    mobile_treatment: Stack source records and keep limitations adjacent.
    reduced_motion_treatment: No motion required.
  - beat_id: beat-12-connected
    learner_question: What can this brief become next?
    instructor_purpose: Connect terms, questions, Community, courses, and a private facility SOP without blurring editorial and commercial boundaries.
    block_ids: [block-sop-boundary, block-faq]
    claims: [claim-dose-change-sop, claim-no-operating-advice]
    visual_or_interaction: graph_and_community
    learner_action: Choose a bounded next action.
    intended_realization: A public brief and a facility-approved SOP are different products.
    assessment_evidence: Learner names the missing facility inputs and approvals.
    transition: Continue through the same-page Graph and Community context.
    surface: white
    mobile_treatment: Keep the product boundary and FAQ in one readable column.
    reduced_motion_treatment: No motion required.
