brief_id: owos:concept-brief:001
learning:
  outcomes:
    - Explain the different jobs of coagulation, flocculation, and downstream separation.
    - Diagnose which stage and evidence should be investigated before a process change.
    - Explain why an illustrative model cannot authorize a facility operating decision.
  prior_knowledge:
    - Basic awareness that drinking-water clarification removes particles before filtration.
  misconception: Coagulation and flocculation are two names for one mixing step and a visible symptom identifies the setting to change.
  transfer_task: Step through a worked decision rehearsal, then optionally rewrite one tempting facility shortcut as a bounded evidence question.
  cross_sector_connections:
    - Wastewater chemical phosphorus removal and solids separation use related particle-conditioning and separation ideas within different process and regulatory boundaries.
    - Stormwater treatment practices may use settling, filtration, or chemical treatment, but the source, loading, operation, and authority boundaries differ.
  experience_profile:
    visual_explanations_minimum: 2
    dynamic_explanation_required: true
    distributed_checks_minimum: 2
    final_applied_check_required: true
    shared_registry: owos-learning-capabilities/1
