learner_experience:
  quick_orientation: Three concise mechanism statements before the numbered learning sequence.
  orientation:
    subject: How coagulation and flocculation do two different jobs in drinking-water clarification, and how to tell which stage a problem belongs to.
    audience: Plant operators, engineers, compliance staff, utility leadership, data and source-water roles, and suppliers who work around drinking-water clarification. You need only the basic awareness that clarification removes particles before filtration. No chemistry background is assumed.
    why_it_matters: Treating the two steps as one operation leads people to change a coagulant dose or a mixing setting in response to a symptom they have not traced. That can shift solids loading, clarification, filtration, residuals handling, and chemical cost, and it leaves no record explaining why the change was considered, authorized, monitored, or reversed.
    time_estimate: Plan for roughly twenty minutes of reading plus a few minutes of participation in the live jar and the two learning checks. Timed novice-reader and active-participation study is still pending, so treat this as an estimate rather than a credit-bearing time claim.
    scope_boundary: This brief does not give facility-specific dosing, mixing, design, regulatory, safety, or health guidance, and it does not replace an approved facility procedure or qualified professional judgment. It centers conventional and direct filtration drinking-water treatment under United States authority. Wastewater, stormwater, reuse, and industrial work appear only as adjacent contexts that need their own separately governed evidence.
  primary_navigation_maximum: 4
  required_top_drawers:
    - graph-drawer
    - community-drawer
  closing_recap_labels:
    - What changed
    - What to observe
    - What not to assume
  comment_placement: after_learning_and_commercial
  community_mode: compact_entry_plus_drawer
  sop_boundary: outline_only
  inactive_commercial_placement: hidden
