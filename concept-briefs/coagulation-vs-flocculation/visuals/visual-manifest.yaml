visuals:
  - visual_id: visual-treatment-train
    title: Conventional clarification treatment train
    locator: visuals/treatment-train-placeholder.svg
    asset_class: explanatory_diagram
    teaching_idea: Show how clarification stages connect to downstream settling and filtration.
    learner_conclusion: A problem at one stage changes the load and conditions seen downstream.
    reading_guide: Read the treatment train from left to right, then use the lower diagnostic rail to trace a downstream symptom backward through source water, chemistry, mixing, and observations.
    alternative_text: Horizontal conventional surface-water treatment train from source through rapid mix, flocculation, separation, filtration, and disinfection. A lower diagnostic rail lists evidence to review before assigning one cause.
    mobile_treatment: The complete overview scales to the content width and the four adjacent-sector cards provide the same sequence and boundary in readable stacked text.
    reduced_motion_treatment: Dashed flow lines remain visible without animation.
    creator: OWOS Concept Engine working build
    source: Independently redrawn from the governed narrative and claim register
    license: internal_working_asset
    permission_status: pending
    originality_status: original_working_asset
    storyboard_status: working_build_authorized
    rendered_review_status: pending
  - visual_id: visual-cross-sector-particle-pathways
    title: Cross-sector particle pathways
    locator: visuals/cross-sector-particle-pathways.svg
    asset_class: explanatory_diagram
    teaching_idea: Show that water, wastewater, and stormwater can share particle-conditioning and separation concepts while retaining different sources, loading patterns, process boundaries, procedures, and authority.
    learner_conclusion: Transfer the diagnostic question across sectors, but never transfer a setting or operating instruction without new evidence and qualified authority.
    reading_guide: Read each sector row from left to right, then read the lower boundary rail to see what must be reverified before the concept transfers.
    alternative_text: Three sector-specific rows trace particles or solids from source through conditioning or aggregation to separation. A boundary states that shared physics does not create shared settings or authority.
    mobile_treatment: Stack the three sector rows vertically and retain the lower boundary as the final step.
    reduced_motion_treatment: The diagram is static and carries the complete relationship without motion.
