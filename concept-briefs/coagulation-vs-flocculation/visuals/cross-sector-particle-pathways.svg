<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Cross-sector particle conditioning and separation pathways</title>
  <desc id="desc">Three parallel pathways show drinking water, wastewater, and stormwater moving from a distinct source and operating boundary through particle conditioning or aggregation to a sector-specific separation step. A lower rail states that shared physics does not create shared settings, procedures, or regulatory authority.</desc>
  <rect width="1200" height="720" rx="28" fill="#10232e"/>
  <text x="70" y="78" fill="#f2f1ec" font-family="Arial" font-size="34" font-weight="700">Related mechanism. Different operating world.</text>
  <text x="70" y="116" fill="#a29c91" font-family="Arial" font-size="18">Trace each row from its source boundary to the separation job.</text>
  <g font-family="Arial" font-size="19">
    <g transform="translate(70 165)">
      <rect width="1060" height="130" rx="20" fill="#1c1b19" stroke="#7dc6e8" stroke-width="3"/>
      <text x="30" y="39" fill="#7dc6e8" font-weight="700">DRINKING WATER</text>
      <rect x="30" y="62" width="230" height="46" rx="10" fill="#302f2c"/><text x="145" y="92" fill="#f2f1ec" text-anchor="middle">Source-water particles</text>
      <path d="M280 85H390" stroke="#7dc6e8" stroke-width="5"/><path d="M390 85l-18-12v24z" fill="#7dc6e8"/>
      <rect x="410" y="62" width="230" height="46" rx="10" fill="#302f2c"/><text x="525" y="92" fill="#f2f1ec" text-anchor="middle">Condition and contact</text>
      <path d="M660 85H770" stroke="#7dc6e8" stroke-width="5"/><path d="M770 85l-18-12v24z" fill="#7dc6e8"/>
      <rect x="790" y="62" width="240" height="46" rx="10" fill="#302f2c"/><text x="910" y="92" fill="#f2f1ec" text-anchor="middle">Settle and filter</text>
    </g>
    <g transform="translate(70 320)">
      <rect width="1060" height="130" rx="20" fill="#1c1b19" stroke="#4ac88c" stroke-width="3"/>
      <text x="30" y="39" fill="#4ac88c" font-weight="700">WASTEWATER</text>
      <rect x="30" y="62" width="230" height="46" rx="10" fill="#302f2c"/><text x="145" y="92" fill="#f2f1ec" text-anchor="middle">Biological and chemical solids</text>
      <path d="M280 85H390" stroke="#4ac88c" stroke-width="5"/><path d="M390 85l-18-12v24z" fill="#4ac88c"/>
      <rect x="410" y="62" width="230" height="46" rx="10" fill="#302f2c"/><text x="525" y="92" fill="#f2f1ec" text-anchor="middle">Aggregate under process conditions</text>
      <path d="M660 85H770" stroke="#4ac88c" stroke-width="5"/><path d="M770 85l-18-12v24z" fill="#4ac88c"/>
      <rect x="790" y="62" width="240" height="46" rx="10" fill="#302f2c"/><text x="910" y="92" fill="#f2f1ec" text-anchor="middle">Clarify and handle solids</text>
    </g>
    <g transform="translate(70 475)">
      <rect width="1060" height="130" rx="20" fill="#1c1b19" stroke="#e0a64a" stroke-width="3"/>
      <text x="30" y="39" fill="#e0a64a" font-weight="700">STORMWATER</text>
      <rect x="30" y="62" width="230" height="46" rx="10" fill="#302f2c"/><text x="145" y="92" fill="#f2f1ec" text-anchor="middle">Event-driven suspended material</text>
      <path d="M280 85H390" stroke="#e0a64a" stroke-width="5"/><path d="M390 85l-18-12v24z" fill="#e0a64a"/>
      <rect x="410" y="62" width="230" height="46" rx="10" fill="#302f2c"/><text x="525" y="92" fill="#f2f1ec" text-anchor="middle">Route, store, or treat</text>
      <path d="M660 85H770" stroke="#e0a64a" stroke-width="5"/><path d="M770 85l-18-12v24z" fill="#e0a64a"/>
      <rect x="790" y="62" width="240" height="46" rx="10" fill="#302f2c"/><text x="910" y="92" fill="#f2f1ec" text-anchor="middle">Settle, filter, or discharge</text>
    </g>
  </g>
  <rect x="70" y="635" width="1060" height="48" rx="12" fill="#292826"/>
  <text x="600" y="666" fill="#f2f1ec" font-family="Arial" font-size="19" text-anchor="middle">Transfer the question and mental model. Reverify the source, loading, process, procedure, and authority.</text>
</svg>
