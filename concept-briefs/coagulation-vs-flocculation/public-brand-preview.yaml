public_source_notes:
  source-ecfr-141-173: Federal filtration requirements for covered systems serving 10,000 or more people. Confirm applicability with the primacy agency.
  source-ecfr-141-551: Federal combined-filter-effluent requirements for covered systems serving fewer than 10,000 people. Confirm applicability with the primacy agency.
  source-epa-swtr-turbidity: Federal guidance for interpreting turbidity requirements and treatment optimization. Guidance, not regulation.
  source-epa-lt1: Federal technical guidance on coagulation, rapid mixing, flocculation, and turbidity.
  source-epa-lt2: Federal guidance on optimization, jar testing, source-water variability, and pilot evaluation.
  source-tdec: Tennessee operator training reference for chemistry, polymers, alkalinity, and flocculation.
  source-pnws-awwa: United States professional engineering context for G and equipment-specific mixing. Not a regulation or standard.
