  block-evidence-boundary:
    title: Sources and scope
    body: |
      This brief is grounded in United States federal regulations and agency guidance, selected state training material, and clearly labeled professional context. The links below let readers inspect the original sources.

      Regulations and design requirements depend on the system, treatment technology, state, and current rule text. This brief explains the concept. It does not replace the applicable regulation, approved facility procedure, or qualified professional judgment.
  block-sop-boundary:
    title: From understanding to action
    body: |
      Use this brief to build a better question and collect the right evidence. A facility procedure is a different product. It must identify the actual water, approved chemicals, equipment, limits, monitoring, authority, rollback steps, and named approvers.

      Keep the public explanation general. Keep facility-specific operating instructions inside the utility's approved procedure and access controls.
