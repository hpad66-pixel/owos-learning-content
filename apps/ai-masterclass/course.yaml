course:
  id: owos-ai-masterclass-series
  title: "One Water AI: The Applied Intelligence Curriculum for the Water Sector"
  status: master_blueprint_draft
  owner: Hardeep Anand
  authoring_authority: owos-learning-content
  delivery:
    authoring_tool: Articulate 360
    learner_platform: LearnWorlds
    graph_context: GraphDB
  release:
    public: false
    credential_claims: false
    graph_promotion: approval_required
  module_structure:
    create_on_blueprint_approval: true
    specimen_module: module-01-ai-in-utility-work
    courses: 8
    modules: 64
    optional_extensions:
      - id: builder-bridge
        title: Builder Bridge
        modules: 8
        guided_hours: 48
        purpose: "Prepare participants who need hands-on foundations in Python, APIs, Git, testing, cloud controls, and deployment."
      - id: advanced-agent-systems
        title: Advanced Agent Systems
        modules: 8
        guided_hours: 48
        purpose: "Extend qualified participants into formal agent design, retrieval, memory, multi-agent coordination, interaction, and water robotics."
  program:
    umbrella: One Water AI
    premium_cohort: One Water AI Executive Fellowship
    tracks:
      - Utility Operations and Practice
      - Engineering, Planning and Capital Delivery
      - Executive and Public Leadership
      - Data, AI and Governance
      - Consulting and Industry Innovation
      - Research and Academia
      - Emerging Professionals and Students
    duration_weeks: 24
    guided_hours: 132
    optional_extension_hours: 96
    architecture: "64-module universal core plus two optional 8-module extension lines"
    readiness_diagnostic_required: true
    cohort_size: 25
    target_tuition_usd: 10000
    fieldbook: work-products/ONE-WATER-AI-FIELDBOOK-BLUEPRINT.md
