<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img"><title>Conflicting claims can remain visible after a scoped decision</title><desc>A provenance network retains procedure, maintenance, and permit claims while a review node holds one action and approves notification use</desc>
<defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#f7fbfd"/><stop offset="1" stop-color="#e5eef3"/></linearGradient><filter id="d"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-opacity=".13"/></filter></defs>
<rect width="1200" height="675" rx="28" fill="url(#g)"/><rect x="42" y="38" width="1116" height="599" rx="24" fill="#fff" stroke="#aebfc9" filter="url(#d)"/>
<rect x="42" y="38" width="1116" height="72" rx="24" fill="#10243a"/><rect x="42" y="84" width="1116" height="26" fill="#10243a"/>
<text x="78" y="84" fill="#fff" font-family="Arial" font-size="28" font-weight="700">Conflicting claims can remain visible after a scoped decision</text>
<style>.h{font:700 23px Arial;fill:#10243a}.p{font:18px Arial;fill:#334b5c}.s{font:700 16px Arial;fill:#fff}.b{fill:#fff;stroke:#91a7b4;stroke-width:2}.x{fill:#a13f3f}.l{stroke:#607b8c;stroke-width:4;fill:none}.q{stroke:#a13f3f;stroke-width:4;stroke-dasharray:10 8;fill:none}</style><rect class="b" x="80" y="150" width="280" height="110" rx="18"/><rect class="b" x="80" y="300" width="280" height="110" rx="18"/><rect class="b" x="80" y="450" width="280" height="110" rx="18"/><text class="h" x="115" y="195">Procedure: start B</text><text class="p" x="115" y="230">version questioned</text><text class="h" x="115" y="345">Maintenance: B out</text><text class="p" x="115" y="380">reviewed 09:10</text><text class="h" x="115" y="495">Permit: notify</text><text class="p" x="115" y="530">current authority</text><path class="l" d="M360 205H510M360 355H510M360 505H510"/><rect class="x" x="510" y="235" width="270" height="240" rx="24"/><text class="s" x="575" y="285">REVIEW NODE</text><text class="s" x="555" y="335">hold pump start</text><text class="s" x="555" y="380">approve notification</text><text class="s" x="555" y="425">preserve conflict</text><path class="l" d="M780 355H900"/><rect class="b" x="900" y="255" width="220" height="200" rx="20"/><text class="h" x="945" y="305">DECISION</text><text class="p" x="935" y="350">scoped use</text><text class="p" x="935" y="390">evidence receipt</text><text class="p" x="935" y="425">effective time</text></svg>