<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">One graph in plain language, diagram, and Turtle</title><desc id="d">The same Outfall 12 located in Watershed 4 statement appears in three equivalent views.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#e8752f"/></marker></defs><rect width="1200" height="620" rx="30" fill="#102a43"/><text x="55" y="60" fill="#fff" font-family="system-ui" font-size="30" font-weight="800">One claim. Three views.</text><g font-family="system-ui"><rect x="55" y="110" width="1090" height="110" rx="24" fill="#fff"/><text x="85" y="150" fill="#147d88" font-size="14" font-weight="800">PLAIN LANGUAGE</text><text x="85" y="190" fill="#17324d" font-size="23" font-weight="800">Outfall 12 is located in Watershed 4.</text><rect x="55" y="250" width="1090" height="145" rx="24" fill="#dff2ee"/><text x="85" y="290" fill="#147d88" font-size="14" font-weight="800">DIRECTED GRAPH</text><rect x="170" y="315" width="250" height="55" rx="27" fill="#fff"/><text x="295" y="350" text-anchor="middle" fill="#17324d" font-size="18" font-weight="800">util:Outfall_12</text><path d="M420 342H765" stroke="#e8752f" stroke-width="5" marker-end="url(#a)"/><text x="592" y="330" text-anchor="middle" fill="#a34e1f" font-size="16" font-weight="800">util:locatedIn</text><rect x="780" y="315" width="250" height="55" rx="27" fill="#fff"/><text x="905" y="350" text-anchor="middle" fill="#17324d" font-size="18" font-weight="800">util:Watershed_4</text><rect x="55" y="425" width="1090" height="135" rx="24" fill="#fff1e6"/><text x="85" y="465" fill="#a34e1f" font-size="14" font-weight="800">TURTLE</text><text x="85" y="515" fill="#17324d" font-family="monospace" font-size="22" font-weight="800">util:Outfall_12  util:locatedIn  util:Watershed_4 .</text></g></svg>
