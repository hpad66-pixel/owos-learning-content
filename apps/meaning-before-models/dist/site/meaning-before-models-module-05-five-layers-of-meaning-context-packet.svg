<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">The bounded Zone 3 AI context packet</title>
  <desc id="desc">A task envelope contains evidence, definitions, current policy, time, permission, conflicts, workflow state, and output limits while unrelated and unauthorized records stay outside.</desc>
  <rect width="1200" height="720" rx="32" fill="#102a43"/>
  <text x="60" y="64" fill="#fff" font-family="system-ui" font-size="30" font-weight="850">Context is not everything we can retrieve.</text>
  <text x="60" y="98" fill="#c9e2ea" font-family="system-ui" font-size="17">It is the governed package this task needs now.</text>
  <g font-family="system-ui">
    <rect x="86" y="148" width="770" height="494" rx="32" fill="#f7faf9"/>
    <rect x="118" y="182" width="706" height="76" rx="18" fill="#17324d"/>
    <text x="146" y="213" fill="#ffb27b" font-size="14" font-weight="850">TASK ENVELOPE</text><text x="146" y="240" fill="#fff" font-size="18" font-weight="750">Draft Zone 3 critical-facility exposure list for human review</text>
    <g>
      <rect x="118" y="282" width="216" height="132" rx="18" fill="#dfeeff"/><text x="140" y="317" fill="#17324d" font-size="17" font-weight="850">Evidence</text><text x="140" y="347" fill="#526d7d" font-size="14">Event 771</text><text x="140" y="372" fill="#526d7d" font-size="14">mapped accounts</text><text x="140" y="397" fill="#526d7d" font-size="14">facility status</text>
      <rect x="352" y="282" width="216" height="132" rx="18" fill="#efe4ff"/><text x="374" y="317" fill="#17324d" font-size="17" font-weight="850">Meaning</text><text x="374" y="347" fill="#526d7d" font-size="14">active account</text><text x="374" y="372" fill="#526d7d" font-size="14">critical facility</text><text x="374" y="397" fill="#526d7d" font-size="14">exposed</text>
      <rect x="586" y="282" width="238" height="132" rx="18" fill="#fff1e6"/><text x="608" y="317" fill="#17324d" font-size="17" font-weight="850">Policy + time</text><text x="608" y="347" fill="#526d7d" font-size="14">current procedure</text><text x="608" y="372" fill="#526d7d" font-size="14">effective at 2:10 a.m.</text><text x="608" y="397" fill="#526d7d" font-size="14">jurisdiction</text>
      <rect x="118" y="434" width="216" height="132" rx="18" fill="#dff2ee"/><text x="140" y="469" fill="#17324d" font-size="17" font-weight="850">Permission</text><text x="140" y="499" fill="#526d7d" font-size="14">named operator</text><text x="140" y="524" fill="#526d7d" font-size="14">draft access</text><text x="140" y="549" fill="#526d7d" font-size="14">no notification</text>
      <rect x="352" y="434" width="216" height="132" rx="18" fill="#fff4cc"/><text x="374" y="469" fill="#17324d" font-size="17" font-weight="850">Conflicts</text><text x="374" y="499" fill="#526d7d" font-size="14">CIS vs GIS flag</text><text x="374" y="524" fill="#526d7d" font-size="14">unresolved premise</text><text x="374" y="549" fill="#526d7d" font-size="14">review required</text>
      <rect x="586" y="434" width="238" height="132" rx="18" fill="#ffd9d2"/><text x="608" y="469" fill="#17324d" font-size="17" font-weight="850">Output limits</text><text x="608" y="499" fill="#526d7d" font-size="14">cite evidence</text><text x="608" y="524" fill="#526d7d" font-size="14">label uncertainty</text><text x="608" y="549" fill="#526d7d" font-size="14">human review only</text>
    </g>
    <rect x="902" y="180" width="238" height="182" rx="22" fill="#fff1e6"/><text x="930" y="218" fill="#a34e1f" font-size="15" font-weight="850">KEEP OUT</text><text x="930" y="255" fill="#17324d" font-size="15">all customer records</text><text x="930" y="286" fill="#17324d" font-size="15">unlabeled old procedures</text><text x="930" y="317" fill="#17324d" font-size="15">unrelated incident files</text>
    <rect x="902" y="390" width="238" height="182" rx="22" fill="#dff2ee"/><text x="930" y="428" fill="#0c646d" font-size="15" font-weight="850">CONTEXT ENGINE</text><text x="930" y="465" fill="#17324d" font-size="15">retrieves</text><text x="930" y="496" fill="#17324d" font-size="15">filters + validates</text><text x="930" y="527" fill="#17324d" font-size="15">assembles package</text>
  </g>
  <text x="600" y="684" text-anchor="middle" fill="#c9e2ea" font-family="system-ui" font-size="16">Better context improves grounding. It does not create perfect determinism or permission to act.</text>
</svg>
