<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="t d"><title id="t">Record role network</title><desc id="d">A physical pump connects to distinct sensor work order drawing and label resources through different predicates.</desc><rect width="1200" height="600" rx="28" fill="#edf5f3"/><g font-family="Arial"><text x="52" y="62" font-size="28" font-weight="700" fill="#102f49">ONE PUMP. FOUR DIFFERENT KINDS OF RECORD.</text><g stroke="#f47c2c" stroke-width="5" fill="none"><path d="M600 295L300 165"/><path d="M600 295L900 165"/><path d="M600 295L300 445"/><path d="M600 295L900 445"/></g><g fill="#fff" stroke="#8aa5b1" stroke-width="2"><rect x="120" y="95" width="300" height="135" rx="18"/><rect x="780" y="95" width="300" height="135" rx="18"/><rect x="120" y="375" width="300" height="135" rx="18"/><rect x="780" y="375" width="300" height="135" rx="18"/></g><circle cx="600" cy="295" r="115" fill="#102f49"/><text x="524" y="280" font-size="15" font-weight="700" fill="#73d2bd">PHYSICAL ASSET</text><text x="518" y="322" font-size="27" font-weight="700" fill="#fff">Pump P-104</text><text x="174" y="135" font-size="14" font-weight="700" fill="#437caa">SCADA POINT P104_RUN</text><text x="174" y="177" font-size="22" font-weight="700" fill="#102f49">monitors</text><text x="838" y="135" font-size="14" font-weight="700" fill="#437caa">WORK ORDER WO-4821</text><text x="838" y="177" font-size="22" font-weight="700" fill="#102f49">concerns</text><text x="174" y="415" font-size="14" font-weight="700" fill="#437caa">DRAWING D-17</text><text x="174" y="457" font-size="22" font-weight="700" fill="#102f49">depicts</text><text x="838" y="415" font-size="14" font-weight="700" fill="#437caa">"HIGH SERVICE PUMP 1"</text><text x="838" y="457" font-size="22" font-weight="700" fill="#102f49">labels</text><g fill="#a7431d" font-size="14" font-weight="700"><text x="404" y="181">monitors</text><text x="727" y="181">concerns</text><text x="410" y="430">depicts</text><text x="740" y="430">labels</text></g><text x="52" y="558" font-size="19" font-weight="700" fill="#102f49">The relationships connect the records without pretending the records are the asset.</text></g></svg>
