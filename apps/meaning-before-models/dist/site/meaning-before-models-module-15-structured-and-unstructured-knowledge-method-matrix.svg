<text x="78" y="84" fill="#fff" font-family="Arial" font-size="28" font-weight="700">Four methods preserve different evidence</text>
<style>.h{font:700 23px Arial;fill:#10243a}.p{font:18px Arial;fill:#334b5c}.s{font:700 16px Arial;fill:#fff}.b{fill:#fff;stroke:#91a7b4;stroke-width:2}.x{fill:#246b83}.l{stroke:#607b8c;stroke-width:4;fill:none}.q{stroke:#246b83;stroke-width:4;stroke-dasharray:10 8;fill:none}</style><rect class="b" x="75" y="145" width="1050" height="430" rx="20"/><rect class="x" x="75" y="145" width="1050" height="65" rx="20"/><text class="s" x="110" y="185">METHOD</text><text class="s" x="330" y="185">PRIMARY JOB</text><text class="s" x="650" y="185">PRESERVES</text><text class="s" x="900" y="185">DOES NOT PROVE</text><g class="p"><text x="110" y="265">Keyword</text><text x="330" y="265">exact retrieval</text><text x="650" y="265">terms + locator</text><text x="900" y="265">authority</text><text x="110" y="345">Vector</text><text x="330" y="345">similar passages</text><text x="650" y="345">score + source</text><text x="900" y="345">truth</text><text x="110" y="425">Extraction</text><text x="330" y="425">candidate claims</text><text x="650" y="425">span + model</text><text x="900" y="425">approval</text><text x="110" y="505">Graph</text><text x="330" y="505">explicit relations</text><text x="650" y="505">IDs + provenance</text><text x="900" y="505">real-world accuracy</text></g></svg>