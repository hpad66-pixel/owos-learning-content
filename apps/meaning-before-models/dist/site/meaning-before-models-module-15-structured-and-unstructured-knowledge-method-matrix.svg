<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img"><title>Four methods preserve different evidence</title><desc>A matrix compares keyword search, vector similarity, extraction, and graph assertion by job, preserved evidence, and boundary</desc>
