<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Machine-readable ledger and node-link view</title><desc id="d">The left side shows RDF triples as the graph content and the right side shows one node-link visualization projected from those statements.</desc><rect width="1200" height="620" rx="28" fill="#eef3f5"/><rect x="45" y="45" width="520" height="530" rx="22" fill="#101c2d"/><text x="80" y="90" font-family="Arial" font-size="18" font-weight="700" fill="#9ee7dc">THE GRAPH CONTENT</text><text x="80" y="122" font-family="Arial" font-size="15" fill="#cbd5e1">A set of machine-readable statements</text><g font-family="monospace" font-size="17" fill="#f8fafc"><rect x="75" y="160" width="460" height="66" rx="12" fill="#172943"/><text x="95" y="200">Pump_P104 → serves → Zone_3</text><rect x="75" y="244" width="460" height="66" rx="12" fill="#172943"/><text x="95" y="284">Zone_3 → contains → Premise_882</text><rect x="75" y="328" width="460" height="66" rx="12" fill="#172943"/><text x="95" y="368">Premise_882 → hasAccount → Account_882</text><rect x="75" y="412" width="460" height="66" rx="12" fill="#172943"/><text x="95" y="452">WO_4821 → concerns → Pump_P104</text></g><text x="80" y="530" font-family="Arial" font-size="17" fill="#fbbf24">Change a statement and the graph changes.</text><path d="M590 310h55" stroke="#0f766e" stroke-width="5"/><path d="m635 294 25 16-25 16" fill="#0f766e"/><rect x="675" y="45" width="480" height="530" rx="22" fill="white" stroke="#b7c5ca" stroke-width="2"/><text x="710" y="90" font-family="Arial" font-size="18" font-weight="700" fill="#172943">ONE VISUAL PROJECTION</text><text x="710" y="122" font-family="Arial" font-size="15" fill="#526077">Layout can move while statements stay unchanged</text><g stroke="#66788b" stroke-width="4"><path d="M805 245 930 180M805 245 930 320M930 320 1050 405M805 245 740 420"/></g><g font-family="Arial" text-anchor="middle"><circle cx="805" cy="245" r="58" fill="#0f766e"/><text x="805" y="240" font-size="16" font-weight="700" fill="white">Pump</text><text x="805" y="262" font-size="16" fill="white">P-104</text><circle cx="930" cy="180" r="48" fill="#d7eee8"/><text x="930" y="186" font-size="15">Zone 3</text><circle cx="930" cy="320" r="48" fill="#f5dfb9"/><text x="930" y="326" font-size="15">Premise</text><circle cx="1050" cy="405" r="48" fill="#ded8ef"/><text x="1050" y="411" font-size="15">Account</text><circle cx="740" cy="420" r="48" fill="#f1d8d1"/><text x="740" y="426" font-size="15">WO-4821</text></g><text x="915" y="530" text-anchor="middle" font-family="Arial" font-size="17" fill="#526077">Useful for people. Not a substitute for the statements.</text></svg>
