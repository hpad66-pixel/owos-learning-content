<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Two-Key Action Console</title>
  <desc id="desc">Knowledge fitness and action authority are two independent gates. The wastewater work-order proposal is grounded but held because evidence is stale and Priority 1 authority is missing.</desc>
  <rect width="1200" height="720" rx="34" fill="#f5f7fb"/>
  <text x="70" y="76" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#14213d">Two-Key Action Console</text>
  <text x="70" y="112" font-family="Arial,sans-serif" font-size="19" fill="#42526b">Both keys must pass before software changes external state.</text>
  <rect x="70" y="154" width="480" height="392" rx="28" fill="#e8f4f1" stroke="#147d6f" stroke-width="3"/>
  <circle cx="136" cy="220" r="34" fill="#147d6f"/>
  <text x="136" y="230" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#fff">1</text>
  <text x="190" y="210" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#123f39">Knowledge fitness</text>
  <text x="190" y="239" font-family="Arial,sans-serif" font-size="17" fill="#285d57">Is the proposal fit to consider?</text>
  <g font-family="Arial,sans-serif" font-size="18" fill="#163b37">
    <text x="112" y="302">✓ Target identity resolves to LS-7</text>
    <text x="112" y="346">✓ Upstream relationship path is traceable</text>
    <text x="112" y="390">✓ Source and provenance are attached</text>
    <text x="112" y="434">✕ Inspection exceeds freshness limit</text>
    <text x="112" y="478">✓ Declared graph checks pass</text>
  </g>
  <rect x="112" y="503" width="394" height="58" rx="16" fill="#fff4d6" stroke="#b77900" stroke-width="2"/>
  <text x="309" y="539" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#7b4b00">RESULT: REFRESH EVIDENCE</text>
  <rect x="650" y="154" width="480" height="392" rx="28" fill="#eeeafa" stroke="#6548a8" stroke-width="3"/>
  <circle cx="716" cy="220" r="34" fill="#6548a8"/>
  <text x="716" y="230" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#fff">2</text>
  <text x="770" y="210" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#34265c">Action authority</text>
  <text x="770" y="239" font-family="Arial,sans-serif" font-size="17" fill="#5b4b7f">May this actor do this now?</text>
  <g font-family="Arial,sans-serif" font-size="18" fill="#352b54">
    <text x="692" y="302">✓ Operator identity is authenticated</text>
    <text x="692" y="346">✓ Draft work-order tool is allowed</text>
    <text x="692" y="390">✕ Priority 1 exceeds delegated role</text>
    <text x="692" y="434">✕ Supervisor approval is missing</text>
    <text x="692" y="478">✓ Valve operation remains prohibited</text>
  </g>
  <rect x="692" y="503" width="394" height="58" rx="16" fill="#fff4d6" stroke="#b77900" stroke-width="2"/>
  <text x="889" y="539" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#7b4b00">RESULT: ASK SUPERVISOR</text>
  <path d="M550 350h100" stroke="#738099" stroke-width="5"/>
  <circle cx="600" cy="350" r="22" fill="#f5f7fb" stroke="#738099" stroke-width="4"/>
  <text x="600" y="357" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#42526b">+</text>
  <rect x="256" y="612" width="688" height="70" rx="22" fill="#14213d"/>
  <text x="600" y="640" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#c9d4e5">Grounded proposal ≠ permission to act</text>
  <text x="600" y="667" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#fff">CURRENT DISPOSITION: REFRESH, THEN ASK</text>
</svg>
