<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">From shared meaning to a current customer record</title>
  <desc id="desc">The Active Service Account concept crosses a governed semantic mapping to CIS fields and a current record, with separate tests for meaning, mapping, and source state.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#e8752f"/></marker><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".12"/></filter></defs>
  <rect width="1200" height="660" rx="32" fill="#eef6f5"/>
  <text x="60" y="62" fill="#17324d" font-family="system-ui" font-size="30" font-weight="850">A correct concept can still cross a broken bridge.</text>
  <g font-family="system-ui" filter="url(#s)">
    <rect x="58" y="130" width="270" height="350" rx="26" fill="#17324d"/>
    <text x="88" y="176" fill="#ffb27b" font-size="15" font-weight="850">SHARED MEANING</text>
    <text x="88" y="222" fill="#fff" font-size="25" font-weight="850">ActiveServiceAccount</text>
    <text x="88" y="270" fill="#d9e8ef" font-size="16">effective at decision time</text><text x="88" y="300" fill="#d9e8ef" font-size="16">not ended or suspended</text>
    <line x1="88" y1="330" x2="298" y2="330" stroke="#54758d"/>
    <text x="88" y="372" fill="#fff" font-size="17" font-weight="750">servesPremise</text><text x="88" y="402" fill="#d9e8ef" font-size="15">named relationship</text>
    <rect x="88" y="430" width="172" height="34" rx="17" fill="#147d88"/><text x="174" y="452" fill="#fff" font-size="13" font-weight="800" text-anchor="middle">ONTOLOGY REVIEW</text>
    <rect x="386" y="190" width="300" height="260" rx="26" fill="#fff"/>
    <text x="416" y="236" fill="#e8752f" font-size="15" font-weight="850">SEMANTIC MAPPING</text>
    <text x="416" y="278" fill="#17324d" font-size="20" font-weight="800">ActiveServiceAccount</text>
    <text x="416" y="316" fill="#526d7d" font-size="16">ACCT_STAT = "A"</text><text x="416" y="346" fill="#526d7d" font-size="16">START_DT ≤ event time</text><text x="416" y="376" fill="#526d7d" font-size="16">END_DT is empty or later</text>
    <rect x="416" y="400" width="196" height="34" rx="17" fill="#fff1e6"/><text x="514" y="422" fill="#a34e1f" font-size="13" font-weight="800" text-anchor="middle">REGRESSION TEST</text>
    <rect x="744" y="130" width="398" height="350" rx="26" fill="#fff"/>
    <text x="778" y="176" fill="#147d88" font-size="15" font-weight="850">AUTHORITATIVE CIS RECORD</text>
    <text x="778" y="222" fill="#17324d" font-size="25" font-weight="850">Service Account 901</text>
    <g font-size="16"><text x="778" y="274" fill="#526d7d">ACCT_STAT</text><text x="1052" y="274" fill="#17324d" text-anchor="end" font-weight="800">A</text><text x="778" y="314" fill="#526d7d">START_DT</text><text x="1052" y="314" fill="#17324d" text-anchor="end" font-weight="800">2024-01-15</text><text x="778" y="354" fill="#526d7d">END_DT</text><text x="1052" y="354" fill="#17324d" text-anchor="end" font-weight="800">empty</text><text x="778" y="394" fill="#526d7d">PREMISE_KEY</text><text x="1052" y="394" fill="#17324d" text-anchor="end" font-weight="800">88</text></g>
    <rect x="778" y="424" width="200" height="34" rx="17" fill="#dff2ee"/><text x="878" y="446" fill="#0c646d" font-size="13" font-weight="800" text-anchor="middle">SOURCE FRESHNESS</text>
  </g>
  <path d="M328 305H380" stroke="#e8752f" stroke-width="5" marker-end="url(#a)"/><path d="M686 305H738" stroke="#e8752f" stroke-width="5" marker-end="url(#a)"/>
  <g font-family="system-ui"><rect x="156" y="535" width="888" height="72" rx="22" fill="#fff"/><text x="600" y="565" text-anchor="middle" fill="#17324d" font-size="17" font-weight="800">Three separate questions</text><text x="600" y="590" text-anchor="middle" fill="#526d7d" font-size="15">Is the meaning approved? Is the mapping current? Is the source record fit for this decision?</text></g>
</svg>
