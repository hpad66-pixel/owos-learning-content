<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Named source groups inside an RDF dataset</title><desc id="d">Five colored named graph containers sit inside an RDF dataset boundary while governance controls surround the dataset.</desc><rect width="1200" height="620" rx="28" fill="#f2f5f6"/><rect x="55" y="55" width="1090" height="450" rx="30" fill="white" stroke="#172943" stroke-width="4"/><text x="90" y="102" font-family="Arial" font-size="23" font-weight="700" fill="#172943">RDF DATASET</text><text x="1070" y="102" text-anchor="end" font-family="Arial" font-size="16" fill="#526077">addressable graph content</text><g font-family="Arial" text-anchor="middle"><g transform="translate(95 145)"><rect width="185" height="270" rx="22" fill="#d7eee8" stroke="#0f766e" stroke-width="3"/><text x="92" y="48" font-size="17" font-weight="700">GIS GRAPH</text><text x="92" y="82" font-size="14">assets</text><text x="92" y="108" font-size="14">zones</text><text x="92" y="134" font-size="14">premises</text><circle cx="92" cy="195" r="30" fill="#0f766e"/><text x="92" y="201" font-size="13" fill="white">6 triples</text></g><g transform="translate(300 145)"><rect width="185" height="270" rx="22" fill="#e4def2" stroke="#6d5aa8" stroke-width="3"/><text x="92" y="48" font-size="17" font-weight="700">CUSTOMER</text><text x="92" y="82" font-size="14">accounts</text><text x="92" y="108" font-size="14">status</text><text x="92" y="134" font-size="14">class</text><circle cx="92" cy="195" r="30" fill="#6d5aa8"/><text x="92" y="201" font-size="13" fill="white">6 triples</text></g><g transform="translate(505 145)"><rect width="185" height="270" rx="22" fill="#f4e1be" stroke="#b7791f" stroke-width="3"/><text x="92" y="48" font-size="17" font-weight="700">MAINTENANCE</text><text x="92" y="82" font-size="14">work</text><text x="92" y="108" font-size="14">condition</text><text x="92" y="134" font-size="14">crew</text><circle cx="92" cy="19