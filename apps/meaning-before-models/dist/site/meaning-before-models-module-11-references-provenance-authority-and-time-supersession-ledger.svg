<text x="78" y="83" fill="#fff" font-family="Arial" font-size="28" font-weight="700">Supersession changes current use without erasing history</text>
<style>.h{font:700 23px Arial;fill:#10243a}.p{font:18px Arial;fill:#334b5c}.s{font:700 16px Arial;fill:#fff}.box{fill:#fff;stroke:#9fb0bc;stroke-width:2}.accent{fill:#bf6820}.line{stroke:#607b8c;stroke-width:4;fill:none}.dash{stroke:#bf6820;stroke-width:4;stroke-dasharray:9 8;fill:none}</style>
<rect x="170" y="375" width="860" height="150" rx="22" fill="#eef1f4" stroke="#8c9aa5" stroke-width="3"/><text class="h" x="220" y="420">OP-7 v1.2 • RETAINED HISTORY</text><text class="p" x="220" y="460">Effective: 2024-01-01 to 2025-12-31</text><text class="p" x="220" y="495">Current use: prohibited • Audit use: allowed</text><rect x="125" y="165" width="950" height="170" rx="22" fill="#fff5e7" stroke="#bf6820" stroke-width="4"/><text class="h" x="180" y="215">OP-7 v2.0 • CURRENT GOVERNING VERSION</text><text class="p" x="180" y="260">Effective: 2026-01-01 onward</text><text class="p" x="180" y="300">Authority: Operations policy • Review: approved</text><path class="dash" d="M600 335V375"/><rect class="accent" x="790" y="550" width="240" height="45" rx="11"/><text class="s" x="830" y="579">supersedes v1.2</text></svg>