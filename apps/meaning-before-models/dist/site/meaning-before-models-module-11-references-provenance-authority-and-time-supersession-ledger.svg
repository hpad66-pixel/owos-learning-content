<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img">
<title>Supersession changes current use without erasing history</title><desc>A layered procedure ledger shows version 1.2 superseded and retained for audit beneath current approved version 2.0 with effective intervals</desc>
