<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Five questions and five meaning jobs</title>
  <desc id="desc">A five-row comparison distinguishes data model, taxonomy, ontology, semantic layer, and AI context by question, utility artifact, and failure.</desc>
  <rect width="1200" height="760" rx="32" fill="#f4faf8"/>
  <text x="58" y="60" fill="#17324d" font-family="system-ui" font-size="30" font-weight="850">Do not memorize five boxes. Ask five different questions.</text>
  <g font-family="system-ui">
    <text x="64" y="112" fill="#526d7d" font-size="15" font-weight="800">JOB</text><text x="280" y="112" fill="#526d7d" font-size="15" font-weight="800">QUESTION</text><text x="668" y="112" fill="#526d7d" font-size="15" font-weight="800">ZONE 3 ARTIFACT</text><text x="948" y="112" fill="#526d7d" font-size="15" font-weight="800">IF MISSING</text>
    <g>
      <rect x="46" y="132" width="1108" height="104" rx="18" fill="#fff" stroke="#cddddd"/>
      <rect x="46" y="132" width="196" height="104" rx="18" fill="#dfeeff"/><text x="70" y="176" fill="#17324d" font-size="20" font-weight="850">Data model</text><text x="70" y="205" fill="#526d7d" font-size="14">structure</text>
      <text x="280" y="174" fill="#17324d" font-size="17">How is information structured?</text><text x="668" y="174" fill="#17324d" font-size="17">CIS status and dates</text><text x="948" y="174" fill="#a63d32" font-size="17">Needed fact absent</text>
    </g>
    <g>
      <rect x="46" y="250" width="1108" height="104" rx="18" fill="#fff" stroke="#cddddd"/>
      <rect x="46" y="250" width="196" height="104" rx="18" fill="#e8f4dd"/><text x="70" y="294" fill="#17324d" font-size="20" font-weight="850">Taxonomy</text><text x="70" y="323" fill="#526d7d" font-size="14">classification</text>
      <text x="280" y="292" fill="#17324d" font-size="17">How are terms organized?</text><text x="668" y="292" fill="#17324d" font-size="17">Facility type list</text><text x="948" y="292" fill="#a63d32" font-size="17">Item misclassified</text>
    </g>
    <g>
      <rect x="46" y="368" width="1108" height="104" rx="18" fill="#fff" stroke="#cddddd"/>
      <rect x="46" y="368" width="196" height="104" rx="18" fill="#efe4ff"/><text x="70" y="412" fill="#17324d" font-size="20" font-weight="850">Ontology</text><text x="70" y="441" fill="#526d7d" font-size="14">shared meaning</text>
      <text x="280" y="410" fill="#17324d" font-size="17">What do concepts and relations mean?</text><text x="668" y="410" fill="#17324d" font-size="17">servesPremise rule</text><text x="948" y="410" fill="#a63d32" font-size="17">Teams disagree</text>
    </g>
    <g>
      <rect x="46" y="486" width="1108" height="104" rx="18" fill="#fff" stroke="#cddddd"/>
      <rect x="46" y="486" width="196" height="104" rx="18" fill="#fff1e6"/><text x="70" y="530" fill="#17324d" font-size="20" font-weight="850">Semantic layer</text><text x="70" y="559" fill="#526d7d" font-size="14">enterprise connection</text>
      <text x="280" y="528" fill="#17324d" font-size="17">Where does meaning resolve?</text><text x="668" y="528" fill="#17324d" font-size="17">Concept-to-CIS map</text><text x="948" y="528" fill="#a63d32" font-size="17">Wrong records</text>
    </g>
    <g>
      <rect x="46" y="604" width="1108" height="104" rx="18" fill="#fff" stroke="#cddddd"/>
      <rect x="46" y="604" width="196" height="104" rx="18" fill="#dff2ee"/><text x="70" y="648" fill="#17324d" font-size="20" font-weight="850">AI context</text><text x="70" y="677" fill="#526d7d" font-size="14">task package now</text>
      <text x="280" y="646" fill="#17324d" font-size="17">What does this task need now?</text><text x="668" y="646" fill="#17324d" font-size="17">Time, evidence, limits</text><text x="948" y="646" fill="#a63d32" font-size="17">Unsafe answer</text>
    </g>
  </g>
</svg>
