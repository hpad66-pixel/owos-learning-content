<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">The anatomy of one RDF triple</title>
  <desc id="desc">Pump P-104 is the subject, serves is the predicate, and Pressure Zone 3 is the object. An incorrect reversed statement appears below.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#17324d" flood-opacity=".14"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#e8752f"/>
    </marker>
    <marker id="badArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#bf4b42"/>
    </marker>
  </defs>
  <rect width="1200" height="650" rx="34" fill="#f4f8f8"/>
  <text x="600" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#17324d">Read one statement from left to right</text>

  <g filter="url(#shadow)" font-family="Arial, sans-serif">
    <rect x="60" y="120" width="290" height="210" rx="24" fill="#173d5b"/>
    <text x="90" y="164" font-size="17" font-weight="700" letter-spacing="2" fill="#a7d9d4">SUBJECT</text>
    <text x="205" y="230" text-anchor="middle" font-size="30" font-weight="700" fill="#ffffff">Pump P-104</text>
    <text x="205" y="273" text-anchor="middle" font-size="18" fill="#d7e7ef">What are we describing?</text>

    <rect x="455" y="120" width="290" height="210" rx="24" fill="#fff1e6" stroke="#e8752f" stroke-width="4"/>
    <text x="485" y="164" font-size="17" font-weight="700" letter-spacing="2" fill="#a74718">PREDICATE</text>
    <text x="600" y="230" text-anchor="middle" font-size="30" font-weight="700" fill="#873c16">serves</text>
    <text x="600" y="273" text-anchor="middle" font-size="18" fill="#7b543c">How does it relate?</text>

    <rect x="850" y="120" width="290" height="210" rx="24" fill="#dff2ee" stroke="#147d88" stroke-width="4"/>
    <text x="880" y="164" font-size="17" font-weight="700" letter-spacing="2" fill="#0e626c">OBJECT</text>
    <text x="995" y="220" text-anchor="middle" font-size="27" font-weight="700" fill="#0e5962">Pressure</text>
    <text x="995" y="254" text-anchor="middle" font-size="27" font-weight="700" fill="#0e5962">Zone 3</text>
    <text x="995" y="293" text-anchor="middle" font-size="18" fill="#3d6f70">What is on the other end?</text>
  </g>

  <path d="M350 225H443" stroke="#e8752f" stroke-width="8" marker-end="url(#arrow)"/>
  <path d="M745 225H838" stroke="#e8752f" stroke-width="8" marker-end="url(#arrow)"/>
  <text x="600" y="374" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#17324d">Pump_P104  →  serves  →  Pressure_Zone_3</text>
  <rect x="270" y="408" width="660" height="6" rx="3" fill="#d5e2e5"/>

  <g font-family="Arial, sans-serif">
    <circle cx="86" cy="494" r="26" fill="#bf4b42"/>
    <path d="M75 483L97 505M97 483L75 505" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    <text x="130" y="478" font-size="18" font-weight="700" letter-spacing="1.5" fill="#8f342e">REVERSED CLAIM</text>
    <text x="130" y="521" font-size="26" font-weight="700" fill="#17324d">Pressure_Zone_3  →  serves  →  Pump_P104</text>
    <path d="M770 512H920" stroke="#bf4b42" stroke-width="6" marker-end="url(#badArrow)"/>
    <text x="942" y="502" font-size="18" font-weight="700" fill="#8f342e">Different meaning</text>
    <text x="942" y="527" font-size="16" fill="#6d4d4a">Familiar words, wrong direction</text>
    <rect x="60" y="566" width="1080" height="58" rx="18" fill="#ffffff" stroke="#bdd2d5" stroke-width="2"/>
    <text x="600" y="602" text-anchor="middle" font-size="20" fill="#17324d">The positions are simple. Identity, direction, source, and authority make the statement trustworthy.</text>
  </g>
</svg>
