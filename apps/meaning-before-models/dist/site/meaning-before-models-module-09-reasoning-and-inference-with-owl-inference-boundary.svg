<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img">
<title>Reasoning may inform action but does not authorize it</title><desc>An entailed utility relationship passes a logic gate and supports discovery but must also pass current evidence policy permission and human accountability before action</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f8fbfd"/><stop offset="1" stop-color="#e8f0f4"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-opacity=".12"/></filter></defs>
<rect width="1200" height="675" rx="28" fill="url(#bg)"/><rect x="42" y="38" width="1116" height="599" rx="24" fill="#fff" stroke="#b8c7d0" filter="url(#s)"/>
<rect x="42" y="38" width="1116" height="70" rx="24" fill="#10243a"/><rect x="42" y="84" width="1116" height="24" fill="#10243a"/>
<text x="78" y="83" fill="#fff" font-family="Arial" font-size="28" font-weight="700">Reasoning may inform action but does not authorize it</text>
<style>.h{font:700 23px Arial;fill:#10243a}.p{font:18px Arial;fill:#334b5c}.s{font:700 16px Arial;fill:#fff}.box{fill:#fff;stroke:#9fb0bc;stroke-width:2}.accent{fill:#d07922}.line{stroke:#607b8c;stroke-width:4;fill:none}.dash{stroke:#d07922;stroke-width:4;stroke-dasharray:9 8;fill:none}</style>
<rect class="box" x="85" y="175" width="275" height="310" rx="20"/><text class="h" x="120" y="220">LOGIC GATE</text><text class="p" x="120" y="270">Assertions</text><text class="p" x="120" y="310">OWL axioms</text><text class="p" x="120" y="350">Proof trace</text><rect class="accent" x="410" y="215" width="300" height="220" rx="22"/><text class="s" x="465" y="260">ALLOWED SUPPORT</text><text class="s" x="455" y="310">Discovery • classification</text><text class="s" x="468" y="350">analysis • explanation</text><path class="line" d="M360 330H410M710 330H760"/><rect class="box" x="760" y="150" width="355" height="360" rx="20"/><text class="h" x="805" y="198">ACTION GATE</text><text class="p" x="805" y="250">Current evidence</text><text class="p" x="805" y="290">Operating policy</text><text class="p" x="805" y="330">Permission</text><text class="p" x="805" y="370">Accountable review</text><line x1="790" y1="410" x2="1080" y2="410" stroke="#d07922" stroke-width="5"/><text class="h" x="805" y="462">Only then: bounded action</text></svg>