<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img">
<title>The graph has three epistemic fields</title><desc>Three labeled fields show known true with an assertion, known false with an explicit negative, and unknown with no supporting statement</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f8fbfd"/><stop offset="1" stop-color="#e8f0f4"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-opacity=".12"/></filter></defs>
<rect width="1200" height="675" rx="28" fill="url(#bg)"/><rect x="42" y="38" width="1116" height="599" rx="24" fill="#fff" stroke="#b8c7d0" filter="url(#s)"/>
<rect x="42" y="38" width="1116" height="70" rx="24" fill="#10243a"/><rect x="42" y="84" width="1116" height="24" fill="#10243a"/>
<text x="78" y="83" fill="#fff" font-family="Arial" font-size="28" font-weight="700">The graph has three epistemic fields</text>
<style>.h{font:700 23px Arial;fill:#10243a}.p{font:18px Arial;fill:#334b5c}.s{font:700 16px Arial;fill:#fff}.box{fill:#fff;stroke:#9fb0bc;stroke-width:2}.accent{fill:#6c55a3}.line{stroke:#607b8c;stroke-width:4;fill:none}.dash{stroke:#6c55a3;stroke-width:4;stroke-dasharray:9 8;fill:none}</style>
<rect x="85" y="160" width="310" height="385" rx="24" fill="#e8f8f0" stroke="#258561" stroke-width="3"/><text class="h" x="135" y="210">KNOWN TRUE</text><text class="p" x="120" y="265">Positive assertion or</text><text class="p" x="120" y="297">supported entailment</text><circle cx="240" cy="405" r="58" fill="#258561"/><text class="s" x="207" y="413">TRUE</text><rect x="445" y="160" width="310" height="385" rx="24" fill="#fff1ee" stroke="#b24b45" stroke-width="3"/><text class="h" x="495" y="210">KNOWN FALSE</text><text class="p" x="480" y="265">Explicit modeled negative</text><text class="p" x="480" y="297">with scoped evidence</text><circle cx="600" cy="405" r="58" fill="#b24b45"/><text class="s" x="565" y="413">FALSE</text><rect x="805" y="160" width="310" height="385" rx="24" fill="#f7f0ff" stroke="#6c55a3" stroke-width="3"/><text class="h" x="875" y="210">UNKNOWN</text><text class="p" x="840" y="265">Statement absent from</text><text class="p" x="840" y="297">available graph</text><circle cx="960" cy="405" r="58" fill="#6c55a3"/><text class="s" x="950" y="413">?</text></svg>