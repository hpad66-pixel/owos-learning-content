<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620"><title>OWOS explanatory visual</title><desc>Original instructional diagram with all relationships labeled in the surrounding lesson.</desc><rect width="1200" height="620" rx="28" fill="#eee9df"/><text x="60" y="65" font-family="Arial" font-size="27" font-weight="700" fill="#26334b">ACTIVE CUSTOMER / MODELING WALL</text><g font-family="Arial"><g transform="rotate(-2 220 250)"><rect x="55" y="125" width="300" height="210" rx="12" fill="#fff2a8"/><text x="85" y="175" font-size="18" font-weight="700">CUSTOMER SERVICE</text><text x="85" y="220" font-size="20">open account</text><text x="85" y="275" font-size="15">Who can we contact?</text></g><g transform="rotate(2 540 250)"><rect x="380" y="125" width="300" height="210" rx="12" fill="#cdeee4"/><text x="410" y="175" font-size="18" font-weight="700">BILLING</text><text x="410" y="220" font-size="20">billable agreement</text><text x="410" y="275" font-size="15">Who can be charged?</text></g><g transform="rotate(-1 860 250)"><rect x="705" y="125" width="300" height="210" rx="12" fill="#d9e4f1"/><text x="735" y="175" font-size="18" font-weight="700">OPERATIONS</text><text x="735" y="220" font-size="20">receiving service now</text><text x="735" y="275" font-size="15">Which premises are served?</text></g><rect x="320" y="405" width="560" height="125" rx="24" fill="#26334b"/><text x="600" y="450" text-anchor="middle" font-size="18" font-weight="700" fill="#9ee7dc">STARTING QUESTION</text><text x="600" y="488" text-anchor="middle" font-size="20" fill="white">Which active critical customers are exposed</text><text x="600" y="516" text-anchor="middle" font-size="20" fill="white">to this pressure event, as of now?</text><path d="M1080 150v310" stroke="#b4533f" stroke-width="5" stroke-dasharray="10 8"/><text x="1105" y="310" font-size="17" fill="#8b3827" transform="rotate(90 1105 310)">ONE LABEL • SEVERAL DECISIONS</text></g></svg>
