<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">The relationship hiding inside the alarm</title>
  <desc id="desc">A control room alarm for Pump P-104 connects through a serves relationship to Pressure Zone 3, with GIS, work order, and customer records contributing separate evidence.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef8f8"/>
      <stop offset="1" stop-color="#f8f4ea"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#147d88"/>
      <stop offset="1" stop-color="#5ab7b5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#17324d" flood-opacity=".14"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#e8752f"/>
    </marker>
  </defs>
  <rect width="1200" height="720" rx="36" fill="url(#sky)"/>
  <path d="M0 540C180 470 330 590 510 526C690 462 850 552 1200 462V720H0Z" fill="#d8ece7"/>
  <path d="M0 620C250 548 430 670 655 594C846 530 1000 600 1200 530V720H0Z" fill="#bedfd7"/>

  <g filter="url(#shadow)">
    <rect x="55" y="58" width="310" height="232" rx="22" fill="#102a43"/>
    <rect x="80" y="88" width="260" height="118" rx="13" fill="#071b2d"/>
    <polyline points="98,165 130,158 160,169 192,128 220,146 251,105 322,105" fill="none" stroke="#64d7cf" stroke-width="7"/>
    <circle cx="251" cy="105" r="9" fill="#ef8b4a"/>
    <rect x="80" y="222" width="260" height="44" rx="10" fill="#f8d7c2"/>
    <circle cx="105" cy="244" r="8" fill="#d8522f"/>
    <text x="125" y="251" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#7b2e1a" textLength="190" lengthAdjust="spacingAndGlyphs">02:00  LOW PRESSURE</text>
    <text x="79" y="42" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#17324d">CONTROL ROOM</text>
    <text x="83" y="318" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#17324d">An event is recorded</text>
    <text x="83" y="348" font-family="Arial, sans-serif" font-size="17" fill="#48647a">The alarm says what happened.</text>
  </g>

  <g transform="translate(450 110)" filter="url(#shadow)">
    <rect x="0" y="92" width="270" height="230" rx="26" fill="#ffffff"/>
    <rect x="30" y="55" width="210" height="70" rx="18" fill="#163d59"/>
    <text x="135" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#ffffff">PUMP P-104</text>
    <circle cx="135" cy="210" r="64" fill="#e6f3f2" stroke="#147d88" stroke-width="8"/>
    <path d="M98 210C112 172 152 166 176 194C197 218 177 254 145 256C121 257 103 240 98 210Z" fill="url(#water)"/>
    <circle cx="135" cy="210" r="18" fill="#ffffff"/>
    <path d="M135 148V180M195 210H166M135 272V240M75 210H104" stroke="#147d88" stroke-width="8" stroke-linecap="round"/>
    <text x="135" y="363" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#17324d">A physical asset</text>
    <text x="135" y="393" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#48647a">The pump exists in the system.</text>
  </g>

  <path d="M720 320C790 320 800 320 862 320" fill="none" stroke="#e8752f" stroke-width="10" marker-end="url(#arrow)"/>
  <rect x="745" y="269" width="118" height="48" rx="24" fill="#fff0e6" stroke="#e8752f" stroke-width="3"/>
  <text x="804" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#a74718">serves</text>

  <g transform="translate(875 106)" filter="url(#shadow)">
    <path d="M0 180L145 45L290 180V340H0Z" fill="#ffffff"/>
    <path d="M38 200L145 99L252 200" fill="none" stroke="#147d88" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="56" y="195" width="178" height="105" rx="10" fill="#dff2f0"/>
    <rect x="120" y="225" width="50" height="75" rx="5" fill="#147d88"/>
    <circle cx="68" cy="150" r="18" fill="#ef8b4a"/>
    <circle cx="232" cy="160" r="13" fill="#ef8b4a"/>
    <text x="145" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#17324d">PRESSURE ZONE 3</text>
    <text x="145" y="383" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#17324d">An operational consequence</text>
    <text x="145" y="413" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#48647a">The zone connects to served places.</text>
  </g>

  <g font-family="Arial, sans-serif">
    <g transform="translate(80 488)">
      <rect width="230" height="100" rx="18" fill="#ffffff" stroke="#9cc9c4" stroke-width="3"/>
      <path d="M25 67L62 30L95 52L132 20L197 60" fill="none" stroke="#147d88" stroke-width="5"/>
      <text x="25" y="88" font-size="17" font-weight="700" fill="#17324d">GIS network model</text>
    </g>
    <g transform="translate(346 533)">
      <rect width="230" height="100" rx="18" fill="#ffffff" stroke="#e8bc9d" stroke-width="3"/>
      <rect x="24" y="18" width="55" height="55" rx="8" fill="#fff0e6"/>
      <path d="M38 46L49 57L67 35" fill="none" stroke="#e8752f" stroke-width="5"/>
      <text x="95" y="48" font-size="17" font-weight="700" fill="#17324d">Work order</text>
      <text x="95" y="72" font-size="15" fill="#48647a">Asset condition</text>
    </g>
    <g transform="translate(612 567)">
      <rect width="230" height="100" rx="18" fill="#ffffff" stroke="#9cc9c4" stroke-width="3"/>
      <circle cx="51" cy="40" r="19" fill="#147d88"/>
      <path d="M20 82C25 58 77 58 82 82" fill="#9cc9c4"/>
      <text x="100" y="48" font-size="17" font-weight="700" fill="#17324d" textLength="110" lengthAdjust="spacingAndGlyphs">Customer system</text>
      <text x="100" y="72" font-size="15" fill="#48647a">Served accounts</text>
    </g>
    <g transform="translate(878 530)">
      <rect width="230" height="100" rx="18" fill="#ffffff" stroke="#b9c8d5" stroke-width="3"/>
      <path d="M28 18H77V78H28Z" fill="#e9eef3"/>
      <path d="M38 32H66M38 45H66M38 58H58" stroke="#48647a" stroke-width="4"/>
      <text x="96" y="48" font-size="17" font-weight="700" fill="#17324d">Procedure</text>
      <text x="96" y="72" font-size="15" fill="#48647a" textLength="120" lengthAdjust="spacingAndGlyphs">Human action boundary</text>
    </g>
  </g>

  <text x="600" y="693" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#17324d">The relationship connects evidence. It does not authorize the response.</text>
</svg>
