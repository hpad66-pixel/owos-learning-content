<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="t d"><title id="t">One identifier and several human-readable labels</title><desc id="d">A stable Outfall 12 identifier connects to three labels while its watershed relationship remains unchanged.</desc><rect width="1200" height="600" rx="30" fill="#102a43"/><text x="55" y="60" fill="#fff" font-family="system-ui" font-size="30" font-weight="800">Identity survives a rename.</text><g font-family="system-ui"><rect x="70" y="125" width="370" height="320" rx="28" fill="#fff"/><text x="105" y="170" fill="#147d88" font-size="14" font-weight="800">STABLE IDENTIFIER</text><text x="105" y="225" fill="#17324d" font-size="24" font-weight="850">util:Outfall_12</text><text x="105" y="270" fill="#526d7d" font-size="16">denotes one resource</text><line x1="105" y1="306" x2="405" y2="306" stroke="#cddddd"/><text x="105" y="350" fill="#17324d" font-size="17" font-weight="800">Relationship stays stable</text><text x="105" y="390" fill="#526d7d" font-size="16">locatedIn util:Watershed_4</text><g><rect x="570" y="110" width="520" height="100" rx="20" fill="#dff2ee"/><text x="600" y="145" fill="#147d88" font-size="13" font-weight="800">CURRENT LABEL</text><text x="600" y="180" fill="#17324d" font-size="21" font-weight="800">"Outfall 12"</text><rect x="570" y="235" width="520" height="100" rx="20" fill="#fff1e6"/><text x="600" y="270" fill="#a34e1f" font-size="13" font-weight="800">OPERATIONS ALIAS</text><text x="600" y="305" fill="#17324d" font-size="21" font-weight="800">"OF-12"</text><rect x="570" y="360" width="520" height="100" rx="20" fill="#efe4ff"/><text x="600" y="395" fill="#6c3fa0" font-size="13" font-weight="800">PUBLIC DISPLAY NAME</text><text x="600" y="430" fill="#17324d" font-size="21" font-weight="800">"North Creek discharge point"</text></g><text x="600" y="530" text-anchor="middle" fill="#c9e2ea" font-size="16">Three labels. One identified resource. One unchanged relationship.</text></g></svg>
