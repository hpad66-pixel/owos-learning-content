<style>.h{font:700 23px Arial;fill:#10243a}.p{font:18px Arial;fill:#334b5c}.s{font:700 16px Arial;fill:#fff}.b{fill:#fff;stroke:#91a7b4;stroke-width:2}.x{fill:#2f648c}.l{stroke:#607b8c;stroke-width:4;fill:none}.q{stroke:#2f648c;stroke-width:4;stroke-dasharray:10 8;fill:none}</style><rect class="b" x="70" y="185" width="270" height="330" rx="22"/><text class="h" x="110" y="230">SOURCE ROW</text><text class="p" x="110" y="285">OUTFALL_ID = OF-0007</text><text class="p" x="110" y="330">STATUS = Active</text><text class="p" x="110" y="375">FLOW = 2.4</text><text class="p" x="110" y="420">UNIT = MGD</text><path class="q" d="M340 350H455"/><rect class="x" x="455" y="160" width="300" height="380" rx="24"/><text class="s" x="520" y="215">MAPPING RULES</text><text class="s" x="510" y="280">identity crosswalk</text><text class="s" x="510" y="330">controlled code</text><text class="s" x="510" y="380">value + unit</text><text class="s" x="510" y="430">source receipt</text><path class="q" d="M755 350H850"/><rect class="b" x="850" y="185" width="285" height="330" rx="22"/><text class="h" x="890" y="230">EXPECTED TRIPLES</text><text class="p" x="890" y="285">O-7 type Outfall</text><text class="p" x="890" y="330">O-7 status Active</text><text class="p" x="890" y="375">Obs-9 value 2.4</text><text class="p" x="890" y="420">Obs-9 unit MGD</text></svg>