<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img">
<title>The shape and the record play different roles</title><desc>A Pump P-104 RDF record is compared with a PumpShape requiring identifier flow value unit and status</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f8fbfd"/><stop offset="1" stop-color="#e8f0f4"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-opacity=".12"/></filter></defs>
<rect width="1200" height="675" rx="28" fill="url(#bg)"/><rect x="42" y="38" width="1116" height="599" rx="24" fill="#fff" stroke="#b8c7d0" filter="url(#s)"/>
<rect x="42" y="38" width="1116" height="70" rx="24" fill="#10243a"/><rect x="42" y="84" width="1116" height="24" fill="#10243a"/>
<text x="78" y="83" fill="#fff" font-family="Arial" font-size="28" font-weight="700">The shape and the record play different roles</text>
<style>.h{font:700 23px Arial;fill:#10243a}.p{font:18px Arial;fill:#334b5c}.s{font:700 16px Arial;fill:#fff}.box{fill:#fff;stroke:#9fb0bc;stroke-width:2}.accent{fill:#0c7b72}.line{stroke:#607b8c;stroke-width:4;fill:none}.dash{stroke:#0c7b72;stroke-width:4;stroke-dasharray:9 8;fill:none}</style>
<rect class="box" x="85" y="150" width="430" height="420" rx="22"/><text class="h" x="125" y="200">DATA GRAPH: PUMP P-104</text><text class="p" x="125" y="255">rdf:type → Pump</text><text class="p" x="125" y="300">ratedFlow → 12.5</text><text class="p" x="125" y="345">status → Active</text><text x="125" y="405" font-family="Arial" font-size="20" fill="#b23f3f">assetIdentifier → MISSING</text><text x="125" y="450" font-family="Arial" font-size="20" fill="#b23f3f">ratedFlowUnit → MISSING</text><path class="dash" d="M515 360H680"/><rect class="box" x="680" y="150" width="435" height="420" rx="22"/><text class="h" x="720" y="200">SHAPES GRAPH: PUMP SHAPE</text><text class="p" x="720" y="255">targetClass Pump</text><text class="p" x="720" y="300">assetIdentifier minCount 1</text><text class="p" x="720" y="345">ratedFlow datatype decimal</text><text class="p" x="720" y="390">ratedFlowUnit minCount 1</text><text class="p" x="720" y="435">status in controlled list</text><rect class="accent" x="760" y="490" width="275" height="48" rx="12"/><text class="s" x="810" y="520">EXECUTABLE CONTRACT</text></svg>