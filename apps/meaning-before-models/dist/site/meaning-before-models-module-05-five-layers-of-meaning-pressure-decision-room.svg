<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">The 2:10 a.m. Zone 3 pressure decision room</title>
  <desc id="desc">A pressure event passes through SCADA, GIS, CIS, and procedure evidence to a meaning desk, runtime controls, and a named human decision.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102a43"/><stop offset="1" stop-color="#173f5f"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".18"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#e8752f"/></marker>
  </defs>
  <rect width="1200" height="720" rx="32" fill="url(#bg)"/>
  <text x="64" y="68" fill="#fff" font-family="system-ui" font-size="30" font-weight="800">2:10 a.m. • Pressure Event 771 • Zone 3</text>
  <text x="64" y="105" fill="#c9e2ea" font-family="system-ui" font-size="18">The data is present. Four words are still disputed.</text>
  <g filter="url(#shadow)">
    <rect x="60" y="145" width="230" height="154" rx="22" fill="#fff"/>
    <circle cx="112" cy="196" r="25" fill="#fff1e6"/><path d="M96 201h32M112 185v32" stroke="#e8752f" stroke-width="6"/>
    <text x="154" y="190" fill="#17324d" font-family="system-ui" font-size="21" font-weight="800" textLength="110" lengthAdjust="spacingAndGlyphs">Physical event</text>
    <text x="88" y="245" fill="#526d7d" font-family="system-ui" font-size="16">Pressure below threshold</text>
    <text x="88" y="273" fill="#526d7d" font-family="system-ui" font-size="16">Observed in Zone 3</text>
  </g>
  <path d="M290 222H348" stroke="#e8752f" stroke-width="5" marker-end="url(#arrow)"/>
  <g font-family="system-ui">
    <rect x="360" y="130" width="470" height="300" rx="26" fill="#eef6f5"/>
    <text x="392" y="174" fill="#17324d" font-size="24" font-weight="800">Evidence desk</text>
    <g>
      <rect x="392" y="202" width="190" height="84" rx="16" fill="#fff"/><text x="414" y="235" fill="#147d88" font-size="15" font-weight="800">SCADA</text><text x="414" y="262" fill="#17324d" font-size="15">event + timestamp</text>
      <rect x="606" y="202" width="190" height="84" rx="16" fill="#fff"/><text x="628" y="235" fill="#147d88" font-size="15" font-weight="800">GIS</text><text x="628" y="262" fill="#17324d" font-size="15">zone + premises</text>
      <rect x="392" y="306" width="190" height="84" rx="16" fill="#fff"/><text x="414" y="339" fill="#147d88" font-size="15" font-weight="800">CIS</text><text x="414" y="366" fill="#17324d" font-size="15">accounts + status</text>
      <rect x="606" y="306" width="190" height="84" rx="16" fill="#fff"/><text x="628" y="339" fill="#147d88" font-size="15" font-weight="800">PROCEDURES</text><text x="628" y="366" fill="#17324d" font-size="15">versions + authority</text>
    </g>
  </g>
  <path d="M830 280H888" stroke="#e8752f" stroke-width="5" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)" font-family="system-ui">
    <rect x="900" y="145" width="240" height="285" rx="24" fill="#fff"/>
    <text x="930" y="186" fill="#17324d" font-size="22" font-weight="800" textLength="170" lengthAdjust="spacingAndGlyphs">Meaning unresolved</text>
    <g fill="#fff1e6"><rect x="930" y="212" width="180" height="38" rx="19"/><rect x="930" y="263" width="180" height="38" rx="19"/><rect x="930" y="314" width="180" height="38" rx="19"/><rect x="930" y="365" width="180" height="38" rx="19"/></g>
    <g fill="#a63d32" font-size="16" font-weight="750"><text x="954" y="237">active?</text><text x="954" y="288">critical facility?</text><text x="954" y="339">exposed?</text><text x="954" y="390">current?</text></g>
  </g>
  <path d="M600 430V486" stroke="#e8752f" stroke-width="5" marker-end="url(#arrow)"/>
  <g font-family="system-ui">
    <rect x="198" y="505" width="804" height="145" rx="26" fill="#dff2ee"/>
    <text x="230" y="548" fill="#17324d" font-size="22" font-weight="800">Governed decision path</text>
    <g fill="#fff" stroke="#9eb8b8"><rect x="230" y="570" width="132" height="52" rx="14"/><rect x="382" y="570" width="132" height="52" rx="14"/><rect x="534" y="570" width="132" height="52" rx="14"/><rect x="686" y="570" width="132" height="52" rx="14"/><rect x="838" y="570" width="132" height="52" rx="14"/></g>
    <g fill="#17324d" font-size="14" font-weight="750" text-anchor="middle"><text x="296" y="601">Structure</text><text x="448" y="601">Classification</text><text x="600" y="601">Meaning</text><text x="752" y="601">Mapping</text><text x="904" y="601">Task context</text></g>
  </g>
  <text x="600" y="689" text-anchor="middle" fill="#c9e2ea" font-family="system-ui" font-size="16">The graph supports the decision. The duty manager retains authority.</text>
</svg>
