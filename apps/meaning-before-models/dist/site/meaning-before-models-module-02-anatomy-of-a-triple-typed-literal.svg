<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">Evidence anatomy of the value 7.2</title><desc id="d">A central 7.2 decimal value is surrounded by measured property, datatype, time, source, and unit evidence.</desc><rect width="1200" height="650" rx="30" fill="#eef6f5"/><text x="55" y="60" fill="#17324d" font-family="system-ui" font-size="30" font-weight="800">The characters 7.2 do not explain themselves.</text><g font-family="system-ui"><circle cx="600" cy="330" r="110" fill="#102a43"/><text x="600" y="315" text-anchor="middle" fill="#ffb27b" font-size="15" font-weight="800">LEXICAL FORM</text><text x="600" y="370" text-anchor="middle" fill="#fff" font-size="48" font-weight="850">7.2</text><g><rect x="65" y="135" width="330" height="110" rx="20" fill="#fff"/><text x="95" y="176" fill="#147d88" font-size="14" font-weight="800">MEASURED PROPERTY</text><text x="95" y="214" fill="#17324d" font-size="21" font-weight="800">pH</text><rect x="805" y="135" width="330" height="110" rx="20" fill="#fff"/><text x="835" y="176" fill="#147d88" font-size="14" font-weight="800">DATATYPE</text><text x="835" y="214" fill="#17324d" font-size="21" font-weight="800">decimal</text><rect x="65" y="410" width="330" height="110" rx="20" fill="#fff"/><text x="95" y="451" fill="#147d88" font-size="14" font-weight="800">OBSERVED TIME</text><text x="95" y="489" fill="#17324d" font-size="21" font-weight="800">09:30 date-time</text><rect x="805" y="410" width="330" height="110" rx="20" fill="#fff"/><text x="835" y="451" fill="#147d88" font-size="14" font-weight="800">SOURCE</text><text x="835" y="489" fill="#17324d" font-size="21" font-weight="800">Lab result LR-771</text><rect x="435" y="525" width="330" height="80" rx="20" fill="#fff1e6"/><text x="600" y="558" text-anchor="middle" fill="#a34e1f" font-size="14" font-weight="800">UNIT WHEN APPLICABLE</text><text x="600" y="586" text-anchor="middle" fill="#17324d" font-size="17">identified separately</text></g><g stroke="#e8752f" stroke-width="4"><line x1="395" y1="225" x2="505" y2="280"/><line x1="805" y1="225" x2="695" y2="280"/><line x1="395" y1="445" x2="505" y2="385"/><line x1="805" y1="445" x2="695" y2="385"/><line x1="600" y1="440" x2="600" y2="525"/></g></g></svg>
