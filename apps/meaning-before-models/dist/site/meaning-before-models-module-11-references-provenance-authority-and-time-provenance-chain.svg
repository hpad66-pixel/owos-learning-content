<text x="78" y="83" fill="#fff" font-family="Arial" font-size="28" font-weight="700">Provenance follows the claim through production</text>
<style>.h{font:700 23px Arial;fill:#10243a}.p{font:18px Arial;fill:#334b5c}.s{font:700 16px Arial;fill:#fff}.box{fill:#fff;stroke:#9fb0bc;stroke-width:2}.accent{fill:#167873}.line{stroke:#607b8c;stroke-width:4;fill:none}.dash{stroke:#167873;stroke-width:4;stroke-dasharray:9 8;fill:none}</style>
