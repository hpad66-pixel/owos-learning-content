<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img">
<title>Provenance follows the claim through production</title><desc>A sensor observation entity passes through ingestion and unit normalization activities with gateway and steward agents before becoming a published RDF claim</desc>
