<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t d">
<title id="t">Meaning and evidence workbench</title><desc id="d">Five inspection panels separate identity, semantics, source authority and time, validation, and inference.</desc>
<rect width="1200" height="720" rx="28" fill="#f6f1e8"/><text x="55" y="65" font-family="Arial" font-size="31" font-weight="700" fill="#0c2338">Inspect five different failure jobs without blending them</text>
<g font-family="Arial"><g transform="translate(55 115)"><rect width="340" height="220" rx="18" fill="#fff" stroke="#afc7d3" stroke-width="3"/><text x="25" y="45" font-size="24" font-weight="700" fill="#087fbd">IDENTITY</text><text x="25" y="90" font-size="21" fill="#233d50">LS-007 = LIFT_7?</text><text x="25" y="128" font-size="18" fill="#536a7e">Coordinates · equipment</text><text x="25" y="160" font-size="18" fill="#536a7e">crosswalk · steward</text><rect x="25" y="180" width="130" height="25" rx="12" fill="#fff0c3"/><text x="90" y="199" text-anchor="middle" font-size="15" font-weight="700">NEEDS EVIDENCE</text></g>
<g transform="translate(430 115)"><rect width="340" height="220" rx="18" fill="#fff" stroke="#afc7d3" stroke-width="3"/><text x="25" y="45" font-size="24" font-weight="700" fill="#087fbd">SEMANTICS</text><text x="25" y="90" font-size="21" fill="#233d50">pumps_to ≠ caused</text><text x="25" y="128" font-size="18" fill="#536a7e">Shared predicate</text><text x="25" y="160" font-size="18" fill="#536a7e">bounded ontology rule</text></g>
<g transform="translate(805 115)"><rect width="340" height="220" rx="18" fill="#fff" stroke="#afc7d3" stroke-width="3"/><text x="25" y="45" font-size="24" font-weight="700" fill="#087fbd">SOURCE + TIME</text><text x="25" y="90" font-size="21" fill="#233d50">Inspection 778</text><text x="25" y="128" font-size="18" fill="#536a7e">Authority · version</text><text x="25" y="160" font-size="18" fill="#536a7e">observed · effective · stale</text></g>
<g transform="translate(245 390)"><rect width="340" height="220" rx="18" fill="#fff" stroke="#afc7d3" stroke-width="3"/><text x="25" y="45" font-size="24" font-weight="700" fill="#15865f">VALIDATION</text><text x="25" y="90" font-size="21" fill="#233d50">Date missing</text><text x="25" y="128" font-size="18" fill="#536a7e">SHACL violation</text><text x="25" y="160" font-size="18" fill="#536a7e">Conformance is not truth</text></g>
<g transform="translate(620 390)"><rect width="340" height="220" rx="18" fill="#fff" stroke="#afc7d3" stroke-width="3"/><text x="25" y="45" font-size="24" font-weight="700" fill="#15865f">INFERENCE</text><text x="25" y="90" font-size="21" fill="#233d50">Requires inspection</text><text x="25" y="128" font-size="18" fill="#536a7e">Permitted conclusion</text><text x="25" y="160" font-size="18" fill="#b13d3d">Cause claim prohibited</text></g></g>
</svg>
