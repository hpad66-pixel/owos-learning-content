<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="t d">
  <title id="t">Proposal Autopsy</title><desc id="d">An oversized enterprise graph proposal lacks five controls required for a pilot.</desc>
  <rect width="1000" height="620" rx="32" fill="#f4f8fb"/>
  <rect x="48" y="54" width="438" height="510" rx="26" fill="#102d45"/>
  <text x="82" y="110" fill="#86e3d3" font-family="Arial" font-size="20" font-weight="700">THE IMPRESSIVE PROPOSAL</text>
  <text x="82" y="176" fill="#fff" font-family="Arial" font-size="38" font-weight="700">Connect everything.</text>
  <text x="82" y="224" fill="#fff" font-family="Arial" font-size="38" font-weight="700">Answer anything.</text>
  <g fill="#d9e9f2" font-family="Arial" font-size="21"><text x="82" y="300">Thousands of entities</text><text x="82" y="344">Every source copied</text><text x="82" y="388">Artificial intelligence ready</text><text x="82" y="432">Ninety-day delivery</text></g>
  <rect x="530" y="54" width="422" height="510" rx="26" fill="#fff" stroke="#ccdae3" stroke-width="3"/>
  <text x="564" y="110" fill="#8c2f39" font-family="Arial" font-size="20" font-weight="700">MISSING PILOT CONTROLS</text>
  <g font-family="Arial"><g fill="#fff" stroke="#d56262" stroke-width="3">
    <rect x="564" y="142" width="354" height="62" rx="14"/><rect x="564" y="222" width="354" height="62" rx="14"/><rect x="564" y="302" width="354" height="62" rx="14"/><rect x="564" y="382" width="354" height="62" rx="14"/><rect x="564" y="462" width="354" height="62" rx="14"/>
  </g><g fill="#22394a" font-size="22" font-weight="700"><text x="590" y="181">Bounded question</text><text x="590" y="261">Baseline and target</text><text x="590" y="341">Accountable owner</text><text x="590" y="421">Authority boundary</text><text x="590" y="501">Stop condition</text></g></g>
</svg>
