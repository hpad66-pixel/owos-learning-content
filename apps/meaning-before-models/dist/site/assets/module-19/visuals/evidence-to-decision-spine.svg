<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img" aria-labelledby="t d">
  <title id="t">Evidence-to-Decision Spine</title><desc id="d">A vertical governed path connects a utility question to measured learning.</desc>
  <rect width="1000" height="720" rx="32" fill="#f4f8fb"/>
  <text x="500" y="58" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#16364e">The graph is one component in a decision system</text>
  <line x1="500" y1="104" x2="500" y2="656" stroke="#178f83" stroke-width="8"/>
  <g font-family="Arial" font-weight="700" font-size="20">
    <g><circle cx="500" cy="120" r="25" fill="#ffcb67"/><rect x="100" y="88" width="320" height="64" rx="16" fill="#fff" stroke="#d2e0e7"/><text x="126" y="127" fill="#20394b">1. Operational question</text></g>
    <g><circle cx="500" cy="200" r="25" fill="#86e3d3"/><rect x="580" y="168" width="320" height="64" rx="16" fill="#fff" stroke="#d2e0e7"/><text x="606" y="207" fill="#20394b">2. Identity and meaning</text></g>
    <g><circle cx="500" cy="280" r="25" fill="#6aa9d2"/><rect x="100" y="248" width="320" height="64" rx="16" fill="#fff" stroke="#d2e0e7"/><text x="126" y="287" fill="#20394b">3. Current evidence</text></g>
    <g><circle cx="500" cy="360" r="25" fill="#b8a6e8"/><rect x="580" y="328" width="320" height="64" rx="16" fill="#fff" stroke="#d2e0e7"/><text x="606" y="367" fill="#20394b">4. Runtime context</text></g>
    <g><circle cx="500" cy="440" r="25" fill="#ef9b79"/><rect x="100" y="408" width="320" height="64" rx="16" fill="#fff" stroke="#d2e0e7"/><text x="126" y="447" fill="#20394b">5. Authority and approval</text></g>
    <g><circle cx="500" cy="520" r="25" fill="#ffcb67"/><rect x="580" y="488" width="320" height="64" rx="16" fill="#fff" stroke="#d2e0e7"/><text x="606" y="527" fill="#20394b">6. Draft and verification</text></g>
    <g><circle cx="500" cy="600" r="25" fill="#86e3d3"/><rect x="100" y="568" width="320" height="64" rx="16" fill="#fff" stroke="#d2e0e7"/><text x="126" y="607" fill="#20394b">7. Measured learning</text></g>
  </g>
</svg>
