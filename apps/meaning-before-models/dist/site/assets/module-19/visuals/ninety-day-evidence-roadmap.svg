<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-labelledby="t d">
  <title id="t">Ninety-Day Evidence Roadmap</title><desc id="d">Four phases create evidence gates from scope through investment decision.</desc>
  <rect width="1000" height="680" rx="32" fill="#f4f8fb"/>
  <text x="70" y="74" font-family="Arial" font-size="30" font-weight="700" fill="#17384f">Ninety days must reduce uncertainty</text>
  <g font-family="Arial">
    <g><rect x="70" y="120" width="200" height="360" rx="22" fill="#123953"/><text x="94" y="164" fill="#86e3d3" font-size="18" font-weight="700">WEEKS 1-3</text><text x="94" y="205" fill="#fff" font-size="23" font-weight="700">Scope + identity</text><text x="94" y="250" fill="#dceaf1" font-size="17">Question</text><text x="94" y="282" fill="#dceaf1" font-size="17">Baseline</text><text x="94" y="314" fill="#dceaf1" font-size="17">Crosswalk</text><rect x="94" y="380" width="152" height="66" rx="12" fill="#fff"/><text x="110" y="407" fill="#17384f" font-size="15" font-weight="700">GATE</text><text x="110" y="430" fill="#17384f" font-size="14">Identity risk known</text></g>
    <g><rect x="290" y="120" width="200" height="360" rx="22" fill="#1d6171"/><text x="314" y="164" fill="#fff1b8" font-size="18" font-weight="700">WEEKS 4-6</text><text x="314" y="205" fill="#fff" font-size="23" font-weight="700">Meaning + sources</text><text x="314" y="250" fill="#e4f3f5" font-size="17">Mappings</text><text x="314" y="282" fill="#e4f3f5" font-size="17">Queries</text><text x="314" y="314" fill="#e4f3f5" font-size="17">Shapes</text><rect x="314" y="380" width="152" height="66" rx="12" fill="#fff"/><text x="330" y="407" fill="#17384f" font-size="15" font-weight="700">GATE</text><text x="330" y="430" fill="#17384f" font-size="14">Evidence trace works</text></g>
    <g><rect x="510" y="120" width="200" height="360" rx="22" fill="#4c5c8f"/><text x="534" y="164" fill="#dfe7ff" font-size="18" font-weight="700">WEEKS 7-9</text><text x="534" y="205" fill="#fff" font-size="23" font-weight="700">Controls + failure</text><text x="534" y="250" fill="#edf0ff" font-size="17">Permissions</text><text x="534" y="282" fill="#edf0ff" font-size="17">Retries</text><text x="534" y="314" fill="#edf0ff" font-size="17">Verification</text><rect x="534" y="380" width="152" height="66" rx="12" fill="#fff"/><text x="550" y="407" fill="#17384f" font-size="15" font-weight="700">GATE</text><text x="550" y="430" fill="#17384f" font-size="14">Denied paths hold</text></g>
    <g><rect x="730" y="120" width="200" height="360" rx="22" fill="#8c4c4e"/><text x="754" y="164" fill="#ffe5d2" font-size="18" font-weight="700">WEEKS 10-12</text><text x="754" y="205" fill="#fff" font-size="23" font-weight="700">Measure + decide</text><text x="754" y="250" fill="#fff0ea" font-size="17">Target</text><text x="754" y="282" fill="#fff0ea" font-size="17">Cost</text><text x="754" y="314" fill="#fff0ea" font-size="17">Residual risk</text><rect x="754" y="380" width="152" height="66" rx="12" fill="#fff"/><text x="770" y="407" fill="#17384f" font-size="15" font-weight="700">DECISION</text><text x="770" y="430" fill="#17384f" font-size="14">Build · Revise · Stop</text></g>
  </g>
  <rect x="70" y="520" width="860" height="96" rx="18" fill="#fff" stroke="#d2e0e7"/><text x="100" y="558" font-family="Arial" font-size="18" font-weight="700" fill="#8c2f39">STOP IF</text><text x="100" y="590" font-family="Arial" font-size="17" fill="#344f60">Identity, evidence, authority, security, verification, value, or simpler-solution gates fail.</text>
</svg>
