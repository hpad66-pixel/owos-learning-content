<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img"><title>One source change can corrupt every downstream answer</title><desc>A source column rename passes through a stale mapping to missing triples wrong query results and unsafe dashboard and agent answers unless a regression gate stops it</desc>
<defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#f7fbfd"/><stop offset="1" stop-color="#e5eef3"/></linearGradient><filter id="d"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-opacity=".13"/></filter></defs>
<rect width="1200" height="675" rx="28" fill="url(#g)"/><rect x="42" y="38" width="1116" height="599" rx="24" fill="#fff" stroke="#aebfc9" filter="url(#d)"/>
<rect x="42" y="38" width="1116" height="72" rx="24" fill="#10243a"/><rect x="42" y="84" width="1116" height="26" fill="#10243a"/>
<text x="78" y="84" fill="#fff" font-family="Arial" font-size="28" font-weight="700">One source change can corrupt every downstream answer</text>
<style>.h{font:700 23px Arial;fill:#10243a}.p{font:18px Arial;fill:#334b5c}.s{font:700 16px Arial;fill:#fff}.b{fill:#fff;stroke:#91a7b4;stroke-width:2}.x{fill:#b13e3e}.l{stroke:#607b8c;stroke-width:4;fill:none}.q{stroke:#b13e3e;stroke-width:4;stroke-dasharray:10 8;fill:none}</style><rect class="b" x="70" y="270" width="210" height="160" rx="18"/><text class="h" x="105" y="315">SOURCE CHANGE</text><text class="p" x="105" y="360">OUTFALL_ID renamed</text><text class="p" x="105" y="395">mapping not updated</text><path class="l" d="M280 350H360"/><rect x="360" y="270" width="210" height="160" rx="18" fill="#fff0ee" stroke="#b13e3e" stroke-width="3"/><text class="h" x="400" y="315">STALE MAP</text><text class="p" x="400" y="360">subject missing</text><path class="l" d="M570 350H650"/><rect x="650" y="270" width="210" height="160" rx="18" fill="#fff0ee" stroke="#b13e3e" stroke-width="3"/><text class="h" x="690" y="315">WRONG GRAPH</text><text class="p" x="690" y="360">path disappears</text><path class="l" d="M860 350H940"/><rect x="940" y="270" width="190" height="160" rx="18" fill="#fff0ee" stroke="#b13e3e" stroke-width="3"/><text class="h" x="975" y="315">CONSUMERS</text><text class="p" x="975" y="360">false no-impact</text><path class="q" d="M465 270V170H755V270"/><rect class="x" x="500" y="130" width="220" height="55" rx="12"/><text class="s" x="540" y="165">REGRESSION GATE</text></svg>