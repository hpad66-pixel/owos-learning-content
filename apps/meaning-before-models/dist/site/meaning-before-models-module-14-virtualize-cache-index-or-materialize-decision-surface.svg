<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img"><title>Access patterns occupy different operating positions</title><desc>A decision surface places virtualization cache index materialization and hybrid architecture according to source dependence and persisted retrieval state</desc>
<defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#f7fbfd"/><stop offset="1" stop-color="#e5eef3"/></linearGradient><filter id="d"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-opacity=".13"/></filter></defs>
<rect width="1200" height="675" rx="28" fill="url(#g)"/><rect x="42" y="38" width="1116" height="599" rx="24" fill="#fff" stroke="#aebfc9" filter="url(#d)"/>
<rect x="42" y="38" width="1116" height="72" rx="24" fill="#10243a"/><rect x="42" y="84" width="1116" height="26" fill="#10243a"/>
<text x="78" y="84" fill="#fff" font-family="Arial" font-size="28" font-weight="700">Access patterns occupy different operating positions</text>
<style>.h{font:700 23px Arial;fill:#10243a}.p{font:18px Arial;fill:#334b5c}.s{font:700 16px Arial;fill:#fff}.b{fill:#fff;stroke:#91a7b4;stroke-width:2}.x{fill:#9a5c24}.l{stroke:#607b8c;stroke-width:4;fill:none}.q{stroke:#9a5c24;stroke-width:4;stroke-dasharray:10 8;fill:none}</style><line x1="170" y1="535" x2="1080" y2="535" stroke="#334b5c" stroke-width="5"/><line x1="170" y1="535" x2="170" y2="155" stroke="#334b5c" stroke-width="5"/><text class="h" x="400" y="590">LOWER SOURCE DEPENDENCE → HIGHER</text><text class="h" transform="translate(95 500) rotate(-90)">MORE PERSISTED RETRIEVAL STATE</text><circle cx="900" cy="450" r="72" fill="#dff2ed" stroke="#14766f" stroke-width="4"/><text class="h" x="845" y="458">VIRTUAL</text><circle cx="700" cy="330" r="70" fill="#fff0df" stroke="#9a5c24" stroke-width="4"/><text class="h" x="660" y="338">CACHE</text><circle cx="485" cy="290" r="70" fill="#eef0fa" stroke="#5f5a9a" stroke-width="4"/><text class="h" x="450" y="298">INDEX</text><circle cx="310" cy="210" r="78" fill="#e7eff6" stroke="#32698c" stroke-width="4"/><text class="h" x="250" y="218">MATERIALIZE</text><rect class="x" x="750" y="165" width="250" height="58" rx="13"/><text class="s" x="815" y="201">HYBRID BY SOURCE</text></svg>