<rect width="1200" height="675" rx="28" fill="url(#g)"/><rect x="42" y="38" width="1116" height="599" rx="24" fill="#fff" stroke="#aebfc9" filter="url(#d)"/>
<rect x="42" y="38" width="1116" height="72" rx="24" fill="#10243a"/><rect x="42" y="84" width="1116" height="26" fill="#10243a"/>
<text x="78" y="84" fill="#fff" font-family="Arial" font-size="28" font-weight="700">Answer architecture fit depends on the decision job</text>
<style>.h{font:700 23px Arial;fill:#10243a}.p{font:18px Arial;fill:#334b5c}.s{font:700 16px Arial;fill:#fff}.b{fill:#fff;stroke:#91a7b4;stroke-width:2}.x{fill:#9a5d25}.l{stroke:#607b8c;stroke-width:4;fill:none}.q{stroke:#9a5d25;stroke-width:4;stroke-dasharray:10 8;fill:none}</style><circle cx="410" cy="280" r="155" fill="#e8f2f7" stroke="#2b6887" stroke-width="4"/><circle cx="790" cy="280" r="155" fill="#f8efe3" stroke="#9a5d25" stroke-width="4"/><circle cx="410" cy="455" r="155" fill="#e8f6f1" stroke="#14766f" stroke-width="4"/><circle cx="790" cy="455" r="155" fill="#f2edfa" stroke="#7055a0" stroke-width="4"/><text class="h" x="330" y="245">BI</text><text class="p" x="315" y="285">metrics + reports</text><text class="h" x="720" y="245">DOC RAG</text><text class="p" x="700" y="285">passages + synthesis</text><text class="h" x="320" y="465">GRAPH</text><text class="p" x="300" y="505">named relationships</text><text class="h" x="700" y="465">CONTEXT</text><text class="p" x="675" y="505">task + policy + state</text><rect class="x" x="505" y="315" width="190" height="105" rx="18"/><text class="s" x="555" y="360">HYBRID</text><text class="s" x="530" y="390">compose by job</text></svg>