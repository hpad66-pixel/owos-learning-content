<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img"><title>Answer architecture fit depends on the decision job</title><desc>A four-region fit map places BI, document RAG, graph retrieval, and context engine around a central governed hybrid based on the task job</desc>
