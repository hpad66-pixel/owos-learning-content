<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img"><title>Permission must interrupt the transition from answer to action</title><desc>A chain moves from retrieve to analyze, recommend, draft, approve, and act with permission and human approval gates blocking unauthorized transitions</desc>
<defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#f7fbfd"/><stop offset="1" stop-color="#e5eef3"/></linearGradient><filter id="d"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-opacity=".13"/></filter></defs>
<rect width="1200" height="675" rx="28" fill="url(#g)"/><rect x="42" y="38" width="1116" height="599" rx="24" fill="#fff" stroke="#aebfc9" filter="url(#d)"/>
<rect x="42" y="38" width="1116" height="72" rx="24" fill="#10243a"/><rect x="42" y="84" width="1116" height="26" fill="#10243a"/>
<text x="78" y="84" fill="#fff" font-family="Arial" font-size="28" font-weight="700">Permission must interrupt the transition from answer to action</text>
<style>.h{font:700 23px Arial;fill:#10243a}.p{font:18px Arial;fill:#334b5c}.s{font:700 16px Arial;fill:#fff}.b{fill:#fff;stroke:#91a7b4;stroke-width:2}.x{fill:#a33f3f}.l{stroke:#607b8c;stroke-width:4;fill:none}.q{stroke:#a33f3f;stroke-width:4;stroke-dasharray:10 8;fill:none}</style><path class="q" d="M80 350H1120"/><g class="b"><circle cx="125" cy="350" r="65"/><circle cx="315" cy="350" r="65"/><circle cx="505" cy="350" r="65"/><circle cx="695" cy="350" r="65"/><circle cx="885" cy="350" r="65"/><circle cx="1075" cy="350" r="65"/></g><text class="h" x="83" y="357">RETRIEVE</text><text class="h" x="270" y="357">ANALYZE</text><text class="h" x="448" y="357">RECOMMEND</text><text class="h" x="660" y="357">DRAFT</text><text class="h" x="840" y="357">APPROVE</text><text class="h" x="1045" y="357">ACT</text><rect class="x" x="760" y="155" width="250" height="70" rx="14"/><text class="s" x="805" y="198">HUMAN APPROVAL GATE</text><path class="q" d="M885 225V285"/><text class="p" x="340" y="500">Each transition has its own evidence, permission, and stop condition.</text></svg>