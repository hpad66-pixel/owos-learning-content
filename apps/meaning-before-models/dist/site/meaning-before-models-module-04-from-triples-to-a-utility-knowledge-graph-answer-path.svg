<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Illuminated customer exposure answer path</title><desc id="d">A five-node path connects Pump P-104 to an active hospital customer account with each supporting predicate and source shown.</desc><rect width="1200" height="620" rx="28" fill="#0d1928"/><text x="60" y="64" font-family="Arial" font-size="18" font-weight="700" fill="#9ee7dc">ANSWER PATH / CUSTOMER EXPOSURE</text><text x="60" y="98" font-family="Arial" font-size="25" font-weight="700" fill="white">Follow the evidence. Do not jump across a missing edge.</text><path d="M120 300h950" stroke="#344861" stroke-width="14" stroke-linecap="round"/><path d="M120 300h950" stroke="#fbbf24" stroke-width="5" stroke-linecap="round"/><g font-family="Arial" text-anchor="middle"><g><circle cx="120" cy="300" r="64" fill="#0f766e"/><text x="120" y="294" font-size="17" font-weight="700" fill="white">Pump</text><text x="120" y="318" font-size="16" fill="white">P-104</text></g><g><circle cx="360" cy="300" r="64" fill="#236b80"/><text x="360" y="294" font-size="17" font-weight="700" fill="white">Pressure</text><text x="360" y="318" font-size="16" fill="white">Zone 3</text></g><g><circle cx="600" cy="300" r="64" fill="#8a6124"/><text x="600" y="294" font-size="17" font-weight="700" fill="white">Premise</text><text x="600" y="318" font-size="16" fill="white">882</text></g><g><circle cx="840" cy="300" r="64" fill="#675392"/><text x="840" y="294" font-size="17" font-weight="700" fill="white">Account</text><text x="840" y="318" font-size="16" fill="white">882</text></g><g><circle cx="1080" cy="300" r="64" fill="#9a4936"/><text x="1080" y="290" font-size="16" font-weight="700" fill="white">Active</text><text x="1080" y="314" font-size="16" fill="white">Hospital</text></g><g fill="#fbbf24" font-size="15" font-weight="700"><text x="240" y="225">serves</text><text x="480" y="225">contains</text><text x="720" y="225">hasAccount</text><text x="960" y="225">status + class</text></g><g fill="#b9c7d8" font-size="14"><text x="240" y="395">GIS</text><text x="480" y="395">GIS</text><text x="720" y="395">Customer</text><text x="960" y="395">Customer</text></g></g><rect x="270" y="470" width="660" height="88" rx="18" fill="#172943" stroke="#3a526f" stroke-width="2"/><text x="600" y="505" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#9ee7dc">BOUNDED ANSWER</text><text x="600" y="535" text-anchor="middle" font-family="Arial" font-size="17" fill="white">Account 882 is an active hospital account in the zone served by P-104.</text></svg>
