<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" role="img" aria-labelledby="t d"><title id="t">The RDF object fork</title><desc id="d">The object position branches to another identified resource or to a literal value.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#e8752f"/></marker></defs><rect width="1200" height="610" rx="30" fill="#f7faf9"/><text x="55" y="60" font-family="system-ui" font-size="30" font-weight="800" fill="#17324d">Ask one question at the object position.</text><g font-family="system-ui"><rect x="420" y="100" width="360" height="90" rx="22" fill="#102a43"/><text x="600" y="140" text-anchor="middle" fill="#ffb27b" font-size="14" font-weight="800">OBJECT POSITION</text><text x="600" y="170" text-anchor="middle" fill="#fff" font-size="19" font-weight="800">Another thing, or a value?</text><path d="M540 190C470 250 350 250 300 300" fill="none" stroke="#e8752f" stroke-width="5" marker-end="url(#a)"/><path d="M660 190C730 250 850 250 900 300" fill="none" stroke="#e8752f" stroke-width="5" marker-end="url(#a)"/><rect x="70" y="315" width="460" height="215" rx="26" fill="#dff2ee"/><text x="105" y="360" fill="#147d88" font-size="15" font-weight="800">ANOTHER RESOURCE</text><text x="105" y="402" fill="#17324d" font-size="20" font-weight="800">Outfall_12 locatedIn Watershed_4</text><text x="105" y="448" fill="#526d7d" font-size="16">Watershed_4 can have more relationships.</text><text x="105" y="486" fill="#526d7d" font-size="16">The graph path can continue.</text><rect x="670" y="315" width="460" height="215" rx="26" fill="#fff1e6"/><text x="705" y="360" fill="#a34e1f" font-size="15" font-weight="800">LITERAL VALUE</text><text x="705" y="402" fill="#17324d" font-size="20" font-weight="800">Observation_771 numericValue 7.2</text><text x="705" y="448" fill="#526d7d" font-size="16">7.2 carries a typed value.</text><text x="705" y="486" fill="#526d7d" font-size="16">It is not the next identified utility thing.</text></g></svg>
