<text x="78" y="84" fill="#fff" font-family="Arial" font-size="28" font-weight="700">Evidence stability and wording stability are separate promises</text>
<style>.h{font:700 23px Arial;fill:#10243a}.p{font:18px Arial;fill:#334b5c}.s{font:700 16px Arial;fill:#fff}.b{fill:#fff;stroke:#91a7b4;stroke-width:2}.x{fill:#14766f}.l{stroke:#607b8c;stroke-width:4;fill:none}.q{stroke:#14766f;stroke-width:4;stroke-dasharray:10 8;fill:none}</style><text class="h" x="80" y="190">EVIDENCE TRACE</text><rect class="b" x="300" y="135" width="250" height="100" rx="18"/><rect class="b" x="650" y="135" width="250" height="100" rx="18"/><text class="p" x="340" y="180">Passages P4 + P9</text><text class="p" x="690" y="180">Graph bindings B7</text><path class="l" d="M550 185H650"/><rect class="x" x="950" y="135" width="180" height="100" rx="18"/><text class="s" x="985" y="178">RECEIPT</text><text class="s" x="975" y="208">stable sources</text><text class="h" x="80" y="405">EXPRESSION TRACE</text><rect class="b" x="300" y="340" width="370" height="105" rx="18"/><rect class="b" x="760" y="340" width="370" height="105" rx="18"/><text class="p" x="335" y="385">Run A: Three stations may</text><text class="p" x="335" y="417">contribute upstream.</text><text class="p" x="795" y="385">Run B: Upstream evidence</text><text class="p" x="795" y="417">identifies three stations.</text><path class="q" d="M1035 235V340M485 235V340"/><text class="h" x="390" y="535">Test evidence, claims, wording, and blocked state separately.</text></svg>