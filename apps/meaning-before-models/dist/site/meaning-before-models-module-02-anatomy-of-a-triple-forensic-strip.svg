<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">What the three-cell result forgot</title><desc id="d">An ambiguous result row is annotated with five missing evidence questions and expanded into precise observation statements.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#e8752f"/></marker></defs><rect width="1200" height="620" rx="30" fill="#f4faf8"/><text x="55" y="58" font-family="system-ui" font-size="30" font-weight="800" fill="#17324d">A tidy row can still lose the evidence.</text><g font-family="system-ui"><rect x="55" y="110" width="420" height="130" rx="22" fill="#102a43"/><text x="82" y="147" fill="#ffb27b" font-size="14" font-weight="800">INCOMING ROW</text><text x="82" y="196" fill="#fff" font-size="23" font-weight="800">Outfall 12  →  has result  →  7.2</text><path d="M475 175H560" stroke="#e8752f" stroke-width="5" marker-end="url(#a)"/><rect x="580" y="90" width="565" height="305" rx="24" fill="#fff" stroke="#cddddd"/><text x="610" y="130" fill="#17324d" font-size="20" font-weight="800">Evidence questions</text><g fill="#526d7d" font-size="17"><text x="620" y="174">1. Which identified observation?</text><text x="620" y="214">2. Which measured property?</text><text x="620" y="254">3. Is 7.2 text or a decimal?</text><text x="620" y="294">4. When was it observed?</text><text x="620" y="334">5. Which record supports it?</text></g><rect x="55" y="300" width="470" height="240" rx="24" fill="#fff"/><text x="82" y="340" fill="#147d88" font-size="15" font-weight="800">REPAIRED PATTERN</text><g fill="#17324d" font-size="16"><text x="82" y="384">Observation_771 → observedProperty → pH</text><text x="82" y="424">Observation_771 → numericValue → 7.2 decimal</text><text x="82" y="464">Observation_771 → observedAt → 09:30 date-time</text><text x="82" y="504">Observation_771 → atLocation → Outfall_12</text></g><rect x="580" y="430" width="565" height="110" rx="22" fill="#dff2ee"/><text x="610" y="474" fill="#17324d" font-size="19" font-weight="800">What changed?</text><text x="610" y="510" fill="#526d7d" font-size="16" textLength="505" lengthAdjust="spacingAndGlyphs">The observation, measure, value, type, time, and location now have separate jobs.</text></g></svg>
