<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620"><title>OWOS explanatory visual</title><desc>Original instructional diagram with all relationships labeled in the surrounding lesson.</desc><rect width="1200" height="620" rx="28" fill="#f7f2e8"/><g font-family="Arial"><text x="55" y="65" font-size="27" font-weight="700" fill="#26334b">ONTOLOGY SCOPE CANVAS</text><rect x="55" y="110" width="520" height="410" rx="24" fill="#d8eee7" stroke="#0f766e" stroke-width="3"/><text x="90" y="160" font-size="21" font-weight="700" fill="#12463f">INCLUDED</text><g font-size="17"><text x="90" y="210">Customer hasServiceAgreement Agreement</text><text x="90" y="250">Agreement servesPremise Premise</text><text x="90" y="290">Premise insideZone PressureZone</text><text x="90" y="330">PressureEvent affects PressureZone</text><text x="90" y="370">Customer hasCriticality Classification</text><text x="90" y="410">Agreement effectiveAt Time</text></g><rect x="625" y="110" width="520" height="195" rx="24" fill="#efd8d2" stroke="#a64b37" stroke-width="3"/><text x="660" y="160" font-size="21" font-weight="700" fill="#713225">EXCLUDED</text><text x="660" y="210" font-size="17">payment history • marketing preference</text><text x="660" y="250" font-size="17">meter register • every contact detail</text><rect x="625" y="325" width="520" height="195" rx="24" fill="#f4dfb8" stroke="#b7791f" stroke-width="3"/><text x="660" y="375" font-size="21" font-weight="700" fill="#5e3e0d">UNRESOLVED / ESCALATE</text><text x="660" y="425" font-size="17">occupancy authority • temporary service</text><text x="660" y="465" font-size="17">joint-account contact responsibility</text><rect x="345" y="545" width="510" height="48" rx="24" fill="#26334b"/><text x="600" y="576" text-anchor="middle" font-size="17" fill="white">A boundary is a design decision, not missing ambition.</text></g></svg>
