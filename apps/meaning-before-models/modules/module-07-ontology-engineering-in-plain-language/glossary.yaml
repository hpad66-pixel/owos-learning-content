terms: [{term: ontology, definition: A shared model of concepts relationships and selected semantic rules.}, {term: competency question, definition: A question used to test whether a model supports its intended job.}, {term: ontology boundary, definition: The concepts uses and meanings explicitly included or excluded.}, {term: upper ontology, definition: A reusable model of very general concepts.}, {term: domain ontology, definition: A model for concepts and relationships in a particular field.}, {term: application profile, definition: A selected and constrained use of terms for one implementation.}, {term: alignment, definition: A recorded correspondence between concepts in different models.}, {term: axiom, definition: A formal statement accepted within an ontology.}, {term: deprecation, definition: A governed indication that a term should no longer be used in new work.}]
