  "schema_version": 1,
  "module_id": "mbm001:20",
  "terms": [
    {"term": "Knowledge Spine", "definition": "The course architecture term for governed ontology, semantic platform, connection fabric, evidence, context, and consumption capabilities connected to real sources and accountable operating controls."},
    {"term": "operational question", "definition": "A bounded question tied to a real user, decision, evidence need, permitted action, measure, and stop condition."},
    {"term": "identity crosswalk", "definition": "A governed record connecting source identifiers to a candidate shared identity with evidence, conflicts, confidence, and ownership."},
    {"term": "competency question", "definition": "A question the semantic model and its connected evidence must be able to answer."},
    {"term": "proof query", "definition": "A testable graph query used to show whether the pilot can answer a competency question with traceable evidence."},
    {"term": "validation shape", "definition": "A declared SHACL contract describing required graph structure and producing a conformance report."},
    {"term": "inference boundary", "definition": "The explicit line between asserted facts, permitted logical conclusions, unknowns, unsupported assumptions, and prohibited conclusions."},
    {"term": "runtime context", "definition": "The task-specific package of intent, evidence, definitions, policy, permissions, time, workflow state, tools, and output limits."},
    {"term": "idempotency", "definition": "The ability to recognize one intended request so recovery or retry does not create duplicate side effects."},
    {"term": "postcondition", "definition": "The external state that must be read back and verified before an action counts as complete."},
    {"term": "audit trace", "definition": "The linked record of question, evidence, validation, inference, context, policy, approval, execution, verification, correction, time, and ownership."},
    {"term": "portable use-case configuration", "definition": "The laboratory's planning artifact that records a governed question-to-action pattern without acting as production code or authorization."}
  ]
}

