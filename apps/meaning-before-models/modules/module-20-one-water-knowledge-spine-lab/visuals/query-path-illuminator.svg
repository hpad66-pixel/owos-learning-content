<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t d">
<title id="t">SPARQL query path illuminator</title><desc id="d">Readable query clauses align with a highlighted graph path from LS-7 to an upstream asset, inspection, and condition.</desc>
<rect width="1200" height="720" rx="28" fill="#071f33"/><text x="55" y="65" font-family="Arial" font-size="31" font-weight="700" fill="#fff">The query is a visible relationship path</text>
<rect x="55" y="105" width="500" height="540" rx="20" fill="#102f49"/><g font-family="monospace" font-size="23" fill="#d9f5ff"><text x="90" y="165">SELECT ?asset ?inspection ?condition</text><text x="90" y="215">WHERE {</text><text x="120" y="275">?asset :upstreamOf :LS_7 .</text><text x="120" y="335">?inspection :inspected ?asset .</text><text x="120" y="395">?inspection :foundCondition ?condition .</text><text x="90" y="455">}</text></g>
<g stroke="#55d6c2" stroke-width="8" fill="none"><path d="M665 215L850 215L1010 360L850 510"/></g><g font-family="Arial" text-anchor="middle" font-size="20" font-weight="700"><g fill="#087fbd"><circle cx="665" cy="215" r="70"/><circle cx="850" cy="215" r="70"/><circle cx="1010" cy="360" r="70"/><circle cx="850" cy="510" r="70"/></g><g fill="#fff"><text x="665" y="222">LS-7</text><text x="850" y="208">Pump</text><text x="850" y="236">P-204</text><text x="1010" y="353">Inspection</text><text x="1010" y="381">778</text><text x="850" y="503">Seal</text><text x="850" y="531">Leak</text></g></g>
<text x="620" y="625" font-family="Arial" font-size="21" fill="#b9deec">Each returned binding keeps the matched path and source evidence.</text>
</svg>
