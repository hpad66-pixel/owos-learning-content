schema_version: 1
module_id: mbm001:20
visuals:
- visual_id: mbm20-living-graph
  title: One relationship at a time becomes a living utility graph
  asset_class: executable-wastewater-node-link-graph
  locator: visuals/living-utility-graph.svg
  component_id: null
  teaching_idea: Show explicit wastewater triples forming a connected evidence structure
  learner_conclusion: The graph grows from small named relationships rather than one
    giant document
  reading_guide: Begin at Overflow Event 21, follow the event to LS-7, then trace
    the upstream pump, inspection, condition, procedure, and draft work order
  alternative_text: Overflow Event 21 connects to LS-7, Pump P-204, Inspection 778,
    a seal leak, Procedure WW-12, and Draft Work Order 4821
  text_equivalent: Overflow Event 21 occurred at LS-7. Pump P-204 pumps to LS-7. Inspection
    778 inspected P-204 and found a seal leak. Procedure WW-12 applies to overflow
    response. The governed evidence supports one draft inspection work order.
  mobile_treatment: Use a vertical event-to-asset-to-evidence-to-action composition
    with the complete overview visible first
  mobile_steps:
  - title: Event
    body: Overflow Event 21 occurred at LS-7.
  - title: Upstream asset
    body: Pump P-204 pumps to LS-7.
  - title: Evidence
    body: Inspection 778 inspected P-204 and found a seal leak.
  - title: Governed next step
    body: Procedure WW-12 and current evidence can support one draft inspection work
      order.
  reduced_motion_treatment: Keep every node, edge, label, and reading order visible
    without graph-growth animation
  creator: One Water OS course production
  source: Original fictional LS-7 instructional scenario
  license: Original OWOS course asset
  permission_status: approved
  originality_status: original
  storyboard_status: approved
  rendered_review_status: approved
- visual_id: mbm20-query-illuminator
  title: A readable SPARQL pattern illuminates the evidence path
  asset_class: synchronized-query-and-graph-path
  locator: visuals/query-path-illuminator.svg
  component_id: null
  teaching_idea: Connect query clauses to the exact relationships they match
  learner_conclusion: A graph query remains explainable when every binding retains
    its path and evidence
  reading_guide: Read each query clause on the left and match it to the highlighted
    LS-7, Pump P-204, Inspection 778, and seal-leak path
  alternative_text: SPARQL clauses align with a graph path from LS-7 to Pump P-204,
    Inspection 778, and a seal leak
  text_equivalent: The query asks for an asset upstream of LS-7, an inspection of
    that asset, and a condition found by that inspection. It returns Pump P-204, Inspection
    778, and Seal Leak with the matched path.
  mobile_treatment: Present each query clause directly above its matching path step
  mobile_steps:
  - title: Upstream clause
    body: Find an asset upstream of LS-7.
  - title: Inspection clause
    body: Find an inspection that inspected the asset.
  - title: Condition clause
    body: Find the condition recorded by that inspection.
  - title: Binding
    body: Return P-204, Inspection 778, and Seal Leak with evidence.
  reduced_motion_treatment: Show all query clauses and matched path steps simultaneously
  creator: One Water OS course production
  source: Original OWOS SPARQL path example
  license: Original OWOS course asset
  permission_status: approved
  originality_status: original
  storyboard_status: approved
  rendered_review_status: approved
- visual_id: mbm20-evidence-workbench
  title: Meaning and evidence failures belong to different workbenches
  asset_class: five-panel-meaning-evidence-inspector
  locator: visuals/meaning-evidence-workbench.svg
  component_id: null
  teaching_idea: Separate identity, semantics, source and time, validation, and inference
  learner_conclusion: A single quality score cannot diagnose five different governance
    failures
  reading_guide: Inspect identity and semantics first, then source and time, validation,
    and inference
  alternative_text: Five panels inspect identity, semantics, source and time, SHACL
    validation, and inference boundaries
  text_equivalent: LS-007 and LIFT_7 need identity evidence. pumps_to does not mean
    caused. Inspection 778 needs source authority and time. Missing date causes a
    validation violation. Requires inspection is permitted while caused overflow is
    prohibited.
  mobile_treatment: Stack the five workbench panels in diagnostic order
  mobile_steps:
  - title: Identity
    body: Prove that source identifiers refer to LS-7.
  - title: Semantics
    body: Preserve the meaning of each relationship.
  - title: Source and time
    body: Retain authority, version, and freshness.
  - title: Validation
    body: Test declared structural requirements.
  - title: Inference
    body: Permit inspection need and prohibit unsupported causation.
  reduced_motion_treatment: All diagnostic panels remain expanded
  creator: One Water OS course production
  source: Original OWOS meaning and evidence diagnostic
  license: Original OWOS course asset
  permission_status: approved
  originality_status: original
  storyboard_status: approved
  rendered_review_status: approved
- visual_id: mbm20-context-chamber
  title: The context engine assembles the smallest complete task packet
  asset_class: runtime-context-packet-composition
  locator: visuals/context-assembly-chamber.svg
  component_id: null
  teaching_idea: Show task intent, evidence, meaning, policy, permissions, time, state,
    tools, limits, and conflicts entering runtime context
  learner_conclusion: Context is a governed task-time package, not every available
    record
  reading_guide: Read the five inputs on each side, then inspect the central packet
    and its retained evidence status
  alternative_text: Ten governed inputs assemble around a runtime context packet for
    Overflow Event 21
  text_equivalent: The packet contains user intent, resolved entities, current evidence,
    definitions, policy, time, jurisdiction, permissions, workflow state, permitted
    tools, output limits, and unresolved conflicts.
  mobile_treatment: Group inputs into intent and evidence, policy and authority, and
    execution and output before showing the packet
  mobile_steps:
  - title: Intent and evidence
    body: Add the request, entities, sources, and current status.
  - title: Meaning and policy
    body: Add definitions, policy, time, and jurisdiction.
  - title: Authority and state
    body: Add permissions, workflow state, tools, and prohibited actions.
  - title: Output boundary
    body: Keep uncertainty and unresolved conflicts visible.
  reduced_motion_treatment: Show the complete packet and all inputs without assembly
    motion
  creator: One Water OS course production
  source: Original OWOS runtime context model
  license: Original OWOS course asset
  permission_status: approved
  originality_status: original
  storyboard_status: approved
  rendered_review_status: approved
- visual_id: mbm20-action-trace
  title: The graph-to-action flight trace survives an uncertain result
  asset_class: vertical-action-verification-audit-trace
  locator: visuals/graph-to-action-flight-trace.svg
  component_id: null
  teaching_idea: Preserve grounding, validation, authority, approval, request identity,
    timeout, reconciliation, verification, and audit
  learner_conclusion: A timeout requires external-state evidence before retry
  reading_guide: Follow request K-441 from recommendation through timeout, receipt
    discovery, verification, and audit
  alternative_text: A vertical flight trace follows a grounded recommendation through
    approval, request K-441, timeout, receipt reconciliation, verification, and audit
  text_equivalent: The grounded recommendation passes evidence and approval. Request
    K-441 times out. The system does not retry blindly. It finds Draft WO-4821 by
    receipt, verifies the postcondition, and completes the audit.
  mobile_treatment: Use the same vertical event sequence with one event per screen-width
    row
  mobile_steps:
  - title: Ground and validate
    body: Retain the path, citations, freshness, and SHACL report.
  - title: Authorize
    body: Record draft-only permission and approval.
  - title: Execute
    body: Send request K-441 with idempotency.
  - title: Reconcile
    body: After timeout, discover the existing draft before retry.
  - title: Verify and audit
    body: Confirm one correct draft and retain the complete trace.
  reduced_motion_treatment: All trace events remain visible without sequential reveal
  creator: One Water OS course production
  source: Original OWOS simulated action trace
  license: Original OWOS course asset
  permission_status: approved
  originality_status: original
  storyboard_status: approved
  rendered_review_status: approved
- visual_id: mbm20-transfer-map
  title: Change the utility use case while preserving the governed core
  asset_class: cross-domain-governance-transfer-map
  locator: visuals/scenario-transfer-map.svg
  component_id: null
  teaching_idea: Compare water, wastewater, stormwater, and custom use cases around
    shared governance
  learner_conclusion: Domain entities change while identity, evidence, validation,
    context, authority, verification, audit, ownership, and stop controls remain
  reading_guide: Read the governed core, then compare the four scenario modes around
    it
  alternative_text: Water, wastewater, stormwater, and custom use cases surround a
    governed core of identity, meaning, evidence, validation, context, authority,
    verification, and audit
  text_equivalent: Pressure Zone 3, LS-7 overflow, Outfall SW-14, and a custom decision
    use different entities and sources. All preserve identity evidence, meaning, provenance,
    validation, inference limits, context, permission, verification, audit, owners,
    measures, and stop conditions.
  mobile_treatment: Show the governed core first, followed by one compact scenario
    comparison at a time
  mobile_steps:
  - title: Governed core
    body: Preserve identity, meaning, evidence, context, authority, verification,
      and audit.
  - title: Water
    body: Use pressure zones, customers, facilities, and field inspection evidence.
  - title: Wastewater
    body: Use overflow, lift station, upstream assets, and maintenance evidence.
  - title: Stormwater
    body: Use outfall, catchments, debris, inspections, and maintenance.
  - title: Custom
    body: Supply one bounded question, decision, action, owner, tests, and stop conditions.
  reduced_motion_treatment: All scenarios and the governed core remain visible
  creator: One Water OS course production
  source: Original OWOS cross-domain transfer model
  license: Original OWOS course asset
  permission_status: approved
  originality_status: original
  storyboard_status: approved
  rendered_review_status: approved
- visual_id: mbm20-iphone-prompt-trace
  title: An iPhone prompt travels through the governed Knowledge Spine
  asset_class: mobile-prompt-to-graph-evidence-trace
  locator: visuals/iphone-prompt-graph-trace.svg
  component_id: null
  teaching_idea: Connect an ordinary utility prompt to identity, graph traversal,
    evidence validation, runtime context, authority, and a fixed response
  learner_conclusion: A prompt becomes defensible only when every evidence and authority
    stage remains visible
  reading_guide: Read the iPhone prompt, follow the five governed stages in the center,
    then inspect the fixed evidence answer and prohibited conclusions
  alternative_text: An iPhone prompt about Overflow Event 21 flows through identity
    resolution, graph traversal, evidence validation, context assembly, and authority
    checks before returning a fixed answer
  text_equivalent: 'The supervisor asks what to inspect first and whether the system
    can create a work order. The system resolves LS-7 and Overflow 21, traverses to
    Pump P-204 and Inspection 778, detects stale evidence, assembles policy and permissions,
    and checks authority. It answers: inspect P-204, refresh Inspection 778, and after
    approval create one draft. It may not set Priority 1, dispatch, close work, or
    claim causation.'
  mobile_treatment: Show the phone prompt first, followed by a vertical seven-stage
    traversal and the answer last
  mobile_steps:
  - title: Prompt
    body: Overflow 21 occurred. What should I inspect first, and can you create the
      work order?
  - title: Identity
    body: Resolve the event, LS-7, Pump P-204, Inspection 778, and the signed-in role.
  - title: Graph and evidence
    body: Run the fixed query and attach the frozen evidence path.
  - title: Validation and inference
    body: Detect stale evidence and prohibit an unsupported causation claim.
  - title: Context and authority
    body: Add current policy, permissions, time, workflow state, and draft-only action
      limits.
  - title: Answer
    body: Inspect P-204, refresh evidence, ask for approval, and create only one permitted
      draft.
  reduced_motion_treatment: Display the complete path and answer simultaneously
  creator: One Water OS course production
  source: Original OWOS prompt-to-graph simulation
  license: Original OWOS course asset
  permission_status: approved
  originality_status: original
  storyboard_status: approved
  rendered_review_status: approved
