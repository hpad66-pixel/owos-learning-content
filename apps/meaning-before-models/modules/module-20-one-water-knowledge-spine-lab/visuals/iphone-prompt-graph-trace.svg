<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t d">
<title id="t">iPhone prompt traveling through a governed Knowledge Spine</title><desc id="d">A utility prompt on an iPhone flows through identity, graph query, evidence, validation, context, authority, and a fixed evidence answer.</desc>
<rect width="1200" height="720" rx="28" fill="#eef6f8"/><text x="55" y="65" font-family="Arial" font-size="31" font-weight="700" fill="#0c2338">An ordinary prompt enters a governed evidence path</text>
<g transform="translate(55 115)"><rect width="250" height="515" rx="42" fill="#071f33"/><rect x="15" y="18" width="220" height="475" rx="30" fill="#fff"/><rect x="88" y="30" width="74" height="8" rx="4" fill="#071f33"/><text x="125" y="80" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#087fbd">ONE WATER ASSISTANT</text><rect x="38" y="115" width="174" height="155" rx="18" fill="#dff4ff"/><text x="52" y="150" font-family="Arial" font-size="16" font-weight="700" fill="#0c2338"><tspan x="52" dy="0">Overflow 21 occurred.</tspan><tspan x="52" dy="28">What should I inspect</tspan><tspan x="52" dy="28">first, and can you</tspan><tspan x="52" dy="28">create the work order?</tspan></text><rect x="38" y="315" width="174" height="105" rx="18" fill="#e8f6ef"/><text x="52" y="350" font-family="Arial" font-size="15" fill="#0c2338"><tspan x="52" dy="0">Inspect P-204 first.</tspan><tspan x="52" dy="25">Refresh evidence.</tspan><tspan x="52" dy="25">Ask for approval.</tspan></text></g>
<path d="M330 370H435" stroke="#f39b34" stroke-width="8"/><polygon points="435,370 410,355 410,385" fill="#f39b34"/>
<g font-family="Arial" text-anchor="middle"><g fill="#073d5b"><rect x="455" y="115" width="260" height="78" rx="16"/><rect x="455" y="218" width="260" height="78" rx="16"/><rect x="455" y="321" width="260" height="78" rx="16"/><rect x="455" y="424" width="260" height="78" rx="16"/><rect x="455" y="527" width="260" height="78" rx="16"/></g><g fill="#fff" font-size="19" font-weight="700"><text x="585" y="162">1 · Resolve identity</text><text x="585" y="265">2 · Traverse graph</text><text x="585" y="368">3 · Validate evidence</text><text x="585" y="471">4 · Assemble context</text><text x="585" y="574">5 · Check authority</text></g></g>
<path d="M740 370H830" stroke="#55bcae" stroke-width="8"/><polygon points="830,370 805,355 805,385" fill="#55bcae"/>
<rect x="850" y="155" width="295" height="430" rx="28" fill="#071f33"/><text x="885" y="205" font-family="Arial" font-size="18" font-weight="700" fill="#8fe4da">FIXED EVIDENCE ANSWER</text><text x="885" y="255" font-family="Arial" font-size="19" font-weight="700" fill="#fff"><tspan x="885">Inspect Pump P-204 first.</tspan><tspan x="885" dy="34">Refresh Inspection 778.</tspan><tspan x="885" dy="34">After approval, create one</tspan><tspan x="885" dy="34">draft inspection work order.</tspan></text><line x1="885" y1="410" x2="1110" y2="410" stroke="#406076" stroke-width="2"/><text x="885" y="450" font-family="Arial" font-size="16" fill="#f9df91"><tspan x="885">No Priority 1 · no dispatch</tspan><tspan x="885" dy="28">no closure · no causation claim</tspan></text><text x="885" y="535" font-family="Arial" font-size="14" fill="#b9d9e6">Frozen snapshot + fixed query +</text><text x="885" y="558" font-family="Arial" font-size="14" fill="#b9d9e6">fixed rules + fixed template</text>
</svg>
