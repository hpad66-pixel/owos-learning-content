<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t d">
<title id="t">Runtime context assembly chamber</title><desc id="d">Ten governed context elements enter a task packet while prohibited and stale material remain outside.</desc>
<rect width="1200" height="720" rx="28" fill="#e9f6f4"/><text x="55" y="65" font-family="Arial" font-size="31" font-weight="700" fill="#0c2338">The context engine assembles a task packet, not a data dump</text>
<g font-family="Arial" font-size="18" font-weight="700" text-anchor="middle"><g fill="#fff" stroke="#73a6b6" stroke-width="3"><rect x="55" y="120" width="210" height="70" rx="15"/><rect x="55" y="215" width="210" height="70" rx="15"/><rect x="55" y="310" width="210" height="70" rx="15"/><rect x="55" y="405" width="210" height="70" rx="15"/><rect x="55" y="500" width="210" height="70" rx="15"/></g><g fill="#0c2338"><text x="160" y="162">User intent</text><text x="160" y="257">Resolved entities</text><text x="160" y="352">Current evidence</text><text x="160" y="447">Definitions + policy</text><text x="160" y="542">Time + jurisdiction</text></g>
<g fill="#fff" stroke="#73a6b6" stroke-width="3"><rect x="935" y="120" width="210" height="70" rx="15"/><rect x="935" y="215" width="210" height="70" rx="15"/><rect x="935" y="310" width="210" height="70" rx="15"/><rect x="935" y="405" width="210" height="70" rx="15"/><rect x="935" y="500" width="210" height="70" rx="15"/></g><g fill="#0c2338"><text x="1040" y="162">Permissions</text><text x="1040" y="257">Workflow state</text><text x="1040" y="352">Permitted tools</text><text x="1040" y="447">Output limits</text><text x="1040" y="542">Unresolved conflicts</text></g></g>
<g stroke="#3f8295" stroke-width="5"><path d="M275 155L425 250"/><path d="M275 535L425 445"/><path d="M925 155L775 250"/><path d="M925 535L775 445"/></g><rect x="425" y="190" width="350" height="350" rx="32" fill="#073d5b"/><text x="600" y="275" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#8fe4da">RUNTIME CONTEXT</text><text x="600" y="335" text-anchor="middle" font-family="Arial" font-size="22" fill="#fff">Overflow-21 decision packet</text><text x="600" y="385" text-anchor="middle" font-family="Arial" font-size="18" fill="#c9e6ee">Evidence status retained</text><text x="600" y="425" text-anchor="middle" font-family="Arial" font-size="18" fill="#c9e6ee">Authority checked separately</text><rect x="500" y="460" width="200" height="38" rx="19" fill="#f2c94c"/><text x="600" y="486" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#183145">SMALLEST COMPLETE PACKET</text>
</svg>
