schema_version: 1
status: approved_for_design
course_id: owos-course-semantic-data-ai-001
module:
  id: mbm001:20
  number: 20
  title: "One Water Knowledge Spine Lab: From Utility Question to Governed Action"
  part: Apply the backbone
  curriculum_role: applied_simulation_and_transfer
learning_job:
  learner_question: How does a real utility question become a governed, graph-grounded application?
  outcome: Build, test, break, repair, and adapt one complete question-to-action Knowledge Spine pattern.
  prior_knowledge: Modules 1 through 19, an approved bounded pilot decision, and the accumulated fieldbook.
  misconception: Once the architecture is designed, the relationships, evidence, context, and action controls will work automatically.
  transfer_task: Configure and defend the same governed process for a different water, wastewater, stormwater, or learner-supplied use case.
depth:
  common_route: Follow one utility question through identity, triples, graph traversal, validation, inference, evidence, context, authorization, execution, verification, and audit.
  practitioner: Inspect the executable graph, query, shape, context, action contract, failure tests, and portable configuration.
  leader: Observe how design choices alter evidence quality, operational risk, human authority, measurable value, and readiness to scale.
experience:
  archetype: full_screen_applied_simulation_laboratory
  opening: The approved pilot canvas looks complete, but the first live rehearsal exposes an identity conflict, stale evidence, and a denied action.
  mental_model: A governed utility question moves through a visible chain of meaning, evidence, decision, permission, action, verification, and learning.
  signature_mechanism: Build, run, break, repair, and adapt the complete One Water Knowledge Spine in a live HTML laboratory.
  visual_jobs:
    - Show a real graph growing from explicit utility triples.
    - Animate a readable SPARQL traversal and its evidence path.
    - Reveal the context and authorization controls between a grounded recommendation and an action.
    - Preserve a complete graph-to-action trace through verification and audit.
    - Let the learner switch among water, wastewater, stormwater, and guided custom scenarios.
  assessment_jobs:
    - Make correct modeling, evidence, and control decisions during the simulation.
    - Diagnose deliberate identity, freshness, validation, inference, permission, execution, and verification failures.
    - Adapt the governed sequence to a learner-selected use case.
  work_product: Portable One Water Knowledge Spine Use-Case Configuration
  capstone_contribution: Applied demonstration and transfer proof after the Module 19 capstone decision.
evidence:
  source_refs: [SRC-001, SRC-002, SRC-003, SRC-004, SRC-005, SRC-011, DIR-004, DIR-005]
  claim_refs: [CLM-010, CLM-019, CLM-027, CLM-028, CLM-036]
  boundary: The laboratory is an instructional simulation. It does not connect to production utility systems or authorize operational actions.
sequence:
  requires: [mbm001:01, mbm001:02, mbm001:03, mbm001:04, mbm001:05, mbm001:06, mbm001:07, mbm001:08, mbm001:09, mbm001:10, mbm001:11, mbm001:12, mbm001:13, mbm001:14, mbm001:15, mbm001:16, mbm001:17, mbm001:18, mbm001:19]
