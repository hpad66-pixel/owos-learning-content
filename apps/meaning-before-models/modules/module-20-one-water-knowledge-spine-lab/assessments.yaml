        "sources_access": "Structured and unstructured sources with virtual, indexed, cached, or materialized access",
        "query_path": "Competency question, readable query pattern, expected result, and evidence path",
        "validation_inference": "Required shapes, permitted inferences, unknowns, and prohibited conclusions",
