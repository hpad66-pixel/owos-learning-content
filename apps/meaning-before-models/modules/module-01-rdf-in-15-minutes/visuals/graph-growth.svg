<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Three triples become one answer path</title>
  <desc id="desc">Three source statements share Pressure Zone 3 and Premise 88, forming a graph path from Pump P-104 to Service Account 901.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#17324d" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0 0L11 5.5L0 11Z" fill="#e8752f"/>
    </marker>
  </defs>
  <rect width="1200" height="760" rx="34" fill="#f7faf9"/>
  <text x="60" y="60" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#17324d">Three small statements</text>
  <text x="60" y="91" font-family="Arial, sans-serif" font-size="18" fill="#48647a">Shared identifiers turn separate facts into one traversable path.</text>

  <g font-family="Arial, sans-serif" filter="url(#shadow)">
    <g transform="translate(60 130)">
      <rect width="335" height="120" rx="20" fill="#ffffff" stroke="#9cc9c4" stroke-width="3"/>
      <circle cx="37" cy="35" r="19" fill="#173d5b"/>
      <text x="37" y="42" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">1</text>
      <text x="70" y="40" font-size="17" font-weight="700" fill="#17324d">Operational model</text>
      <text x="24" y="82" font-size="18" fill="#17324d">Pump_P104</text>
      <text x="150" y="82" font-size="17" font-weight="700" fill="#a74718">serves</text>
      <text x="218" y="82" font-size="18" fill="#0e626c">Zone_3</text>
    </g>
    <g transform="translate(432 130)">
      <rect width="335" height="120" rx="20" fill="#ffffff" stroke="#e8bc9d" stroke-width="3"/>
      <circle cx="37" cy="35" r="19" fill="#e8752f"/>
      <text x="37" y="42" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">2</text>
      <text x="70" y="40" font-size="17" font-weight="700" fill="#17324d">Geographic model</text>
      <text x="24" y="82" font-size="18" fill="#0e626c">Zone_3</text>
      <text x="102" y="82" font-size="17" font-weight="700" fill="#a74718">contains</text>
      <text x="190" y="82" font-size="18" fill="#0e626c">Premise_88</text>
    </g>
    <g transform="translate(804 130)">
      <rect width="335" height="120" rx="20" fill="#ffffff" stroke="#9cc9c4" stroke-width="3"/>
      <circle cx="37" cy="35" r="19" fill="#147d88"/>
      <text x="37" y="42" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">3</text>
      <text x="70" y="40" font-size="17" font-weight="700" fill="#17324d">Customer system</text>
      <text x="24" y="82" font-size="17" fill="#0e626c">Premise_88</text>
      <text x="126" y="82" font-size="15" font-weight="700" fill="#a74718">has_account</text>
      <text x="226" y="82" font-size="17" fill="#0e626c">901</text>
    </g>
  </g>

  <path d="M227 268C227 335 360 330 360 395" fill="none" stroke="#b7cbd0" stroke-width="4" stroke-dasharray="8 9"/>
  <path d="M600 268V395" fill="none" stroke="#b7cbd0" stroke-width="4" stroke-dasharray="8 9"/>
  <path d="M972 268C972 335 840 330 840 395" fill="none" stroke="#b7cbd0" stroke-width="4" stroke-dasharray="8 9"/>
  <rect x="465" y="305" width="270" height="52" rx="26" fill="#dfeaec"/>
  <text x="600" y="338" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#17324d">shared nodes connect the claims</text>

  <g font-family="Arial, sans-serif" filter="url(#shadow)">
    <rect x="45" y="430" width="235" height="125" rx="62" fill="#173d5b"/>
    <text x="162" y="486" text-anchor="middle" font-size="23" font-weight="700" fill="#ffffff">Pump P-104</text>
    <text x="162" y="516" text-anchor="middle" font-size="16" fill="#cfe1e8">asset identifier</text>

    <rect x="342" y="430" width="235" height="125" rx="62" fill="#dff2ee" stroke="#147d88" stroke-width="4"/>
    <text x="459" y="486" text-anchor="middle" font-size="23" font-weight="700" fill="#0e5962">Pressure Zone 3</text>
    <text x="459" y="516" text-anchor="middle" font-size="16" fill="#3d6f70">shared node</text>

    <rect x="639" y="430" width="235" height="125" rx="62" fill="#fff1e6" stroke="#e8752f" stroke-width="4"/>
    <text x="756" y="486" text-anchor="middle" font-size="23" font-weight="700" fill="#873c16">Premise 88</text>
    <text x="756" y="516" text-anchor="middle" font-size="16" fill="#7b543c">shared node</text>

    <rect x="936" y="430" width="235" height="125" rx="62" fill="#ffffff" stroke="#9cc9c4" stroke-width="4"/>
    <text x="1053" y="478" text-anchor="middle" font-size="21" font-weight="700" fill="#17324d">Service Account</text>
    <text x="1053" y="508" text-anchor="middle" font-size="23" font-weight="700" fill="#17324d">901</text>
  </g>

  <path d="M280 492H329" stroke="#e8752f" stroke-width="8" marker-end="url(#arrow)"/>
  <path d="M577 492H626" stroke="#e8752f" stroke-width="8" marker-end="url(#arrow)"/>
  <path d="M874 492H923" stroke="#e8752f" stroke-width="8" marker-end="url(#arrow)"/>
  <g font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#a74718">
    <text x="304" y="466" text-anchor="middle">serves</text>
    <text x="600" y="466" text-anchor="middle">contains</text>
    <text x="899" y="454" text-anchor="middle">has service</text>
    <text x="899" y="474" text-anchor="middle">account</text>
  </g>

  <rect x="60" y="590" width="1080" height="130" rx="24" fill="#102a43"/>
  <text x="95" y="628" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="1.5" fill="#80d1ca">WHAT THE PATH SUPPORTS</text>
  <text x="95" y="665" font-family="Arial, sans-serif" font-size="21" fill="#ffffff">Account 901 is connected to a premise in the zone served by Pump P-104.</text>
  <text x="95" y="698" font-family="Arial, sans-serif" font-size="17" fill="#cfe1e8">It does not prove that the pump caused a complaint or authorize a customer notification.</text>
</svg>
