schema_version: 1
module_id: mbm001:01
terms:
  - term: Resource Description Framework
    short: RDF
    definition: A World Wide Web Consortium framework for representing information as subject, predicate, object statements.
  - term: triple
    definition: One complete statement with a subject, predicate, and object.
  - term: subject
    definition: The identified thing the statement describes.
  - term: predicate
    definition: The named, directed relationship between the subject and object.
  - term: object
    definition: The identified thing or literal value on the other end of the predicate.
  - term: graph
    definition: A connected set of identified nodes and directed, named relationships.
