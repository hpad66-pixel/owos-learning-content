{
  "schema_version": 1,
  "module_id": "mbm001:13",
  "terms": [
    {
      "term": "semantic mapping",
      "definition": "A governed rule connecting source structures and values to semantic classes, properties, identities, and statements."
    },
    {
      "term": "source contract",
      "definition": "The reviewed structure, meaning, codes, units, authority, and change expectations of a source."
    },
    {
      "term": "R2RML",
      "definition": "The World Wide Web Consortium language for customized mappings from relational databases to RDF datasets."
    },
    {
      "term": "Direct Mapping",
      "definition": "A standard default transformation from relational database structure and content to an RDF graph."
    },
    {
      "term": "expected triple",
      "definition": "A subject-predicate-object statement a mapping test predicts from a known source row."
    },
    {
      "term": "regression test",
      "definition": "A repeatable check that detects whether a change broke an established result."
    }
  ]
}
