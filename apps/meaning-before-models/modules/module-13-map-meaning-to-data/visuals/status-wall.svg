<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img"><title>The same label can conceal three different meanings</title><desc>Three source boards show Active outfall status Overdue inspection status and Online telemetry status with different subjects and code lists</desc>
<defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#f7fbfd"/><stop offset="1" stop-color="#e5eef3"/></linearGradient><filter id="d"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-opacity=".13"/></filter></defs>
<rect width="1200" height="675" rx="28" fill="url(#g)"/><rect x="42" y="38" width="1116" height="599" rx="24" fill="#fff" stroke="#aebfc9" filter="url(#d)"/>
<rect x="42" y="38" width="1116" height="72" rx="24" fill="#10243a"/><rect x="42" y="84" width="1116" height="26" fill="#10243a"/>
<text x="78" y="84" fill="#fff" font-family="Arial" font-size="28" font-weight="700">The same label can conceal three different meanings</text>
<style>.h{font:700 23px Arial;fill:#10243a}.p{font:18px Arial;fill:#334b5c}.s{font:700 16px Arial;fill:#fff}.b{fill:#fff;stroke:#91a7b4;stroke-width:2}.x{fill:#b45f25}.l{stroke:#607b8c;stroke-width:4;fill:none}.q{stroke:#b45f25;stroke-width:4;stroke-dasharray:10 8;fill:none}</style><g class="b"><rect x="80" y="155" width="320" height="390" rx="22"/><rect x="440" y="155" width="320" height="390" rx="22"/><rect x="800" y="155" width="320" height="390" rx="22"/></g><text class="h" x="125" y="205">GIS.STATUS</text><text class="p" x="125" y="260">Subject: Outfall O-7</text><text class="p" x="125" y="310">Value: Active</text><text class="p" x="125" y="360">Codes: Active, Inactive,</text><text class="p" x="125" y="392">Seasonal</text><text class="h" x="485" y="205">WORK.STATUS</text><text class="p" x="485" y="260">Subject: Inspection WO-88</text><text class="p" x="485" y="310">Value: Overdue</text><text class="p" x="485" y="360">Codes: Open, Complete,</text><text class="p" x="485" y="392">Overdue</text><text class="h" x="845" y="205">SCADA.STATUS</text><text class="p" x="845" y="260">Subject: Channel C-7</text><text class="p" x="845" y="310">Value: Online</text><text class="p" x="845" y="360">Codes: Online, Offline</text><rect class="x" x="210" y="475" width="770" height="44" rx="10"/><text class="s" x="315" y="504">ONE LABEL DOES NOT CREATE ONE SEMANTIC PROPERTY</text></svg>