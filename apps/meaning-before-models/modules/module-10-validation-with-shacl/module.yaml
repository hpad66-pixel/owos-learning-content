      "Distinguish a data graph from a shapes graph",
      "Read focus node path constraint severity and message",
      "Repair and rerun a validation case",
      "Separate conformance from truth completeness safety and fitness"
    ],
    "prior_knowledge": "The learner understands triples classes properties and ontology terms.",
    "misconception": "A conforming graph is complete true safe and fit for every operational use.",
