{
  "schema_version": 1,
  "module_id": "mbm001:10",
  "terms": [
    {
      "term": "SHACL",
      "definition": "A W3C language for describing and validating conditions over RDF graphs."
    },
    {
      "term": "shape",
      "definition": "A set of declared validation targets and constraints."
    },
    {
      "term": "focus node",
      "definition": "The graph node being validated."
    },
    {
      "term": "result path",
      "definition": "The property path associated with a validation result."
    },
    {
      "term": "constraint component",
      "definition": "The kind of validation rule that produced a result."
    },
    {
      "term": "conformance",
      "definition": "The outcome that a data graph satisfies the evaluated shapes under a validation run."
    },
    {
      "term": "results graph",
      "definition": "The RDF graph containing the validation report and individual results."
    }
  ]
}
