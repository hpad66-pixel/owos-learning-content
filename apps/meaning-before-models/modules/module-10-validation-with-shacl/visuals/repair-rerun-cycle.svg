<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img">
<title>Validation is a controlled repair and rerun cycle</title><desc>A five-step loop validates diagnoses repairs preserves provenance and reruns a utility graph shape</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f8fbfd"/><stop offset="1" stop-color="#e8f0f4"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-opacity=".12"/></filter></defs>
<rect width="1200" height="675" rx="28" fill="url(#bg)"/><rect x="42" y="38" width="1116" height="599" rx="24" fill="#fff" stroke="#b8c7d0" filter="url(#s)"/>
<rect x="42" y="38" width="1116" height="70" rx="24" fill="#10243a"/><rect x="42" y="84" width="1116" height="24" fill="#10243a"/>
<text x="78" y="83" fill="#fff" font-family="Arial" font-size="28" font-weight="700">Validation is a controlled repair and rerun cycle</text>
<style>.h{font:700 23px Arial;fill:#10243a}.p{font:18px Arial;fill:#334b5c}.s{font:700 16px Arial;fill:#fff}.box{fill:#fff;stroke:#9fb0bc;stroke-width:2}.accent{fill:#245f88}.line{stroke:#607b8c;stroke-width:4;fill:none}.dash{stroke:#245f88;stroke-width:4;stroke-dasharray:9 8;fill:none}</style>
<circle cx="600" cy="355" r="190" fill="#eef4f7" stroke="#6f8795" stroke-width="4"/><circle cx="600" cy="355" r="72" class="accent"/><text class="s" x="560" y="348">SHAPE</text><text class="s" x="555" y="377">v2.4</text><g class="h"><text x="535" y="150">1 VALIDATE</text><text x="830" y="280">2 DIAGNOSE</text><text x="750" y="555">3 REPAIR / ROUTE</text><text x="235" y="555">4 PRESERVE SOURCE</text><text x="165" y="280">5 RERUN</text></g><path class="dash" d="M640 165C855 190 890 360 815 465M725 545C570 625 410 570 350 490M245 430C170 260 300 150 485 160"/></svg>