<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img">
<title>A validation result is an exact diagnostic</title><desc>A diagnostic card identifies Pump P-104 ratedFlowUnit minCount violation severity and repair message</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f8fbfd"/><stop offset="1" stop-color="#e8f0f4"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-opacity=".12"/></filter></defs>
<rect width="1200" height="675" rx="28" fill="url(#bg)"/><rect x="42" y="38" width="1116" height="599" rx="24" fill="#fff" stroke="#b8c7d0" filter="url(#s)"/>
<rect x="42" y="38" width="1116" height="70" rx="24" fill="#10243a"/><rect x="42" y="84" width="1116" height="24" fill="#10243a"/>
<text x="78" y="83" fill="#fff" font-family="Arial" font-size="28" font-weight="700">A validation result is an exact diagnostic</text>
<style>.h{font:700 23px Arial;fill:#10243a}.p{font:18px Arial;fill:#334b5c}.s{font:700 16px Arial;fill:#fff}.box{fill:#fff;stroke:#9fb0bc;stroke-width:2}.accent{fill:#c16b20}.line{stroke:#607b8c;stroke-width:4;fill:none}.dash{stroke:#c16b20;stroke-width:4;stroke-dasharray:9 8;fill:none}</style>
<rect x="120" y="145" width="960" height="430" rx="24" fill="#fdfdfc" stroke="#8fa3b0" stroke-width="3"/><rect class="accent" x="120" y="145" width="960" height="62" rx="24"/><text class="s" x="160" y="183">VALIDATION RESULT VR-104-02</text><text class="h" x="170" y="255">1  Focus node</text><text class="p" x="470" y="255">Pump P-104</text><line x1="160" y1="277" x2="1040" y2="277" stroke="#d8e0e5"/><text class="h" x="170" y="325">2  Result path</text><text class="p" x="470" y="325">ratedFlowUnit</text><line x1="160" y1="347" x2="1040" y2="347" stroke="#d8e0e5"/><text class="h" x="170" y="395">3  Constraint</text><text class="p" x="470" y="395">minCount 1</text><line x1="160" y1="417" x2="1040" y2="417" stroke="#d8e0e5"/><text class="h" x="170" y="465">4  Severity</text><text class="p" x="470" y="465">Violation</text><line x1="160" y1="487" x2="1040" y2="487" stroke="#d8e0e5"/><text class="h" x="170" y="535">5  Message</text><text class="p" x="470" y="535">Add verified unit or route exception</text></svg>