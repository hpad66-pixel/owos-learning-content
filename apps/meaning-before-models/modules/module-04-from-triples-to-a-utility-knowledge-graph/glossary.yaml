schema_version: 1
module_id: mbm001:04
terms:
  - {term: RDF graph, definition: A set of Resource Description Framework triples.}
  - {term: node, definition: A resource or value that participates in graph statements.}
  - {term: edge, definition: A directed predicate relationship from a subject to an object.}
  - {term: path, definition: A sequence of connected statements followed through a graph.}
  - {term: shared node, definition: A governed resource identity reused by statements so separate paths can meet.}
  - {term: graph visualization, definition: A human-readable display of graph content rather than the graph itself.}
  - {term: RDF dataset, definition: A collection containing a default graph and zero or more named graphs.}
  - {term: named graph, definition: An RDF graph associated with a graph name inside a dataset.}
  - {term: competency question, definition: A specific question used to test whether a model or graph contains the required concepts and relationships.}
  - {term: source group, definition: A bounded collection of statements kept attributable to a particular source or governance context.}
