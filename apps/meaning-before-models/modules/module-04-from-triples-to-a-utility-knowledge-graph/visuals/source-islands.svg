<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Five source islands and one unanswered utility question</title><desc id="d">GIS, customer, maintenance, operations, and permit source islands contain local records but have no connecting paths to a central question.</desc><rect width="1200" height="620" rx="28" fill="#f3efe4"/><path d="M0 470C190 430 260 515 430 473s282-32 430 13 246-22 340-10v144H0z" fill="#d8e8e4"/><rect x="388" y="28" width="424" height="82" rx="20" fill="#172943"/><text x="600" y="60" text-anchor="middle" font-family="Arial" font-size="18" fill="#9ee7dc">OPERATIONS QUESTION</text><text x="600" y="88" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="white">Which customers and work are connected to P-104?</text><g font-family="Arial"><g transform="translate(60 160)"><path d="M0 90Q40 0 160 10t170 80q-20 100-160 100T0 90" fill="#cfe8e4" stroke="#0f766e" stroke-width="3"/><text x="165" y="62" text-anchor="middle" font-size="20" font-weight="700" fill="#12463f">GIS</text><text x="165" y="96" text-anchor="middle" font-size="16">P-104 → Zone 3</text><text x="165" y="126" text-anchor="middle" font-size="15" fill="#526077">local answer only</text></g><g transform="translate(435 160)"><path d="M0 90Q40 0 160 10t170 80q-20 100-160 100T0 90" fill="#e8ddc7" stroke="#b7791f" stroke-width="3"/><text x="165" y="62" text-anchor="middle" font-size="20" font-weight="700" fill="#70420e">CUSTOMER</text><text x="165" y="96" text-anchor="middle" font-size="16">Premise 882 → Account 882</text><text x="165" y="126" text-anchor="middle" font-size="15" fill="#526077">no zone edge</text></g><g transform="translate(810 160)"><path d="M0 90Q40 0 160 10t170 80q-20 100-160 100T0 90" fill="#ddd9ee" stroke="#6d5aa8" stroke-width="3"/><text x="165" y="62" text-anchor="middle" font-size="20" font-weight="700" fill="#45366f">MAINTENANCE</text><text x="165" y="96" text-anchor="middle" font-size="16">WO-4821 → P-104</text><text x="165" y="126" text-anchor="middle" font-size="15" fill="#526077">separate source</text></g><g transform="translate(245 395)"><rect width="280" height="110" rx="45" fill="#d8e4f1" stroke="#35668f" stroke-width="3"/><text x="140" y="45" text-anchor="middle" font-size="20" font-weight="700" fill="#234b6d">OPERATIONS</text><text x="140" y="76" text-anchor="middle" font-size="16">Event 77 → Zone 3</text></g><g transform="translate(675 395)"><rect width="280" height="110" rx="45" fill="#f0d8d1" stroke="#a64b37" stroke-width="3"/><text x="140" y="45" text-anchor="middle" font-size="20" font-weight="700" fill="#703022">PERMIT</text><text x="140" y="76" text-anchor="middle" font-size="16">Permit 8 → Outfall 12</text></g><path d="M600 125v28" stroke="#b94343" stroke-width="5" stroke-dasharray="8 8"/><text x="600" y="560" text-anchor="middle" font-size="20" font-weight="700" fill="#913a2c">RECORDS PRESENT • CONNECTING PATH ABSENT</text></g></svg>
