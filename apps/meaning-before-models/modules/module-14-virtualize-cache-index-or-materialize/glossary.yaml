{
  "schema_version": 1,
  "module_id": "mbm001:14",
  "terms": [
    {
      "term": "virtualization",
      "definition": "Accessing governed data through mapped queries while the authoritative records remain in source systems."
    },
    {
      "term": "cache",
      "definition": "A temporary reusable result or bounded copy maintained under freshness and invalidation rules."
    },
    {
      "term": "index",
      "definition": "A derived retrieval structure that helps find source evidence."
    },
    {
      "term": "materialization",
      "definition": "A persisted representation created for repeated query or processing use."
    },
    {
      "term": "query pushdown",
      "definition": "Executing parts of a query in the source system rather than moving all source data."
    },
    {
      "term": "freshness",
      "definition": "How current evidence must be for a defined use."
    },
    {
      "term": "recovery objective",
      "definition": "A measurable target for restoring service or data after failure."
    }
  ]
}
