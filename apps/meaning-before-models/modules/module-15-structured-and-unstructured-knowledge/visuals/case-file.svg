<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img"><title>Four credible artifacts can disagree</title><desc>A case file shows telemetry, maintenance note, procedure, and permit claims about Lift Station 7 with different times and authority</desc>
<defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#f7fbfd"/><stop offset="1" stop-color="#e5eef3"/></linearGradient><filter id="d"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-opacity=".13"/></filter></defs>
<rect width="1200" height="675" rx="28" fill="url(#g)"/><rect x="42" y="38" width="1116" height="599" rx="24" fill="#fff" stroke="#aebfc9" filter="url(#d)"/>
<rect x="42" y="38" width="1116" height="72" rx="24" fill="#10243a"/><rect x="42" y="84" width="1116" height="26" fill="#10243a"/>
<text x="78" y="84" fill="#fff" font-family="Arial" font-size="28" font-weight="700">Four credible artifacts can disagree</text>
<style>.h{font:700 23px Arial;fill:#10243a}.p{font:18px Arial;fill:#334b5c}.s{font:700 16px Arial;fill:#fff}.b{fill:#fff;stroke:#91a7b4;stroke-width:2}.x{fill:#a46024}.l{stroke:#607b8c;stroke-width:4;fill:none}.q{stroke:#a46024;stroke-width:4;stroke-dasharray:10 8;fill:none}</style><g class="b"><rect x="70" y="145" width="250" height="190" rx="18"/><rect x="350" y="145" width="250" height="190" rx="18"/><rect x="630" y="145" width="250" height="190" rx="18"/><rect x="910" y="145" width="220" height="190" rx="18"/></g><text class="h" x="105" y="190">TELEMETRY</text><text class="p" x="105" y="235">High level 09:14</text><text class="p" x="105" y="275">provisional quality</text><text class="h" x="385" y="190">MAINTENANCE</text><text class="p" x="385" y="235">Pump B unavailable</text><text class="p" x="385" y="275">reviewed 09:10</text><text class="h" x="665" y="190">PROCEDURE</text><text class="p" x="665" y="235">Start Pump B</text><text class="p" x="665" y="275">version uncertain</text><text class="h" x="945" y="190">PERMIT</text><text class="p" x="945" y="235">Notify regulator</text><text class="p" x="945" y="275">current clause</text><rect class="x" x="220" y="410" width="760" height="100" rx="18"/><text class="s" x="285" y="450">KEEP THE DISAGREEMENT, SOURCE, TIME, AND AUTHORITY</text><text class="s" x="420" y="482">VISIBLE BEFORE DECIDING</text></svg>