        {
          "text": "Retain both source paths",
          "correct": true
        },
        {
          "text": "Record governing use and effective interval",
          "correct": true
        },
        {
          "text": "Delete the losing statement",
          "correct": false
        },
        {
          "text": "Record missing evidence and reviewer",
          "correct": true
        },
        {
          "text": "Treat similarity score as authority",
          "correct": false
        }
