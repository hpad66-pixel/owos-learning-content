      "cognitive_job": "separate retrieval jobs",
      "prompt": "Match each method to its primary job.",
      "targets": [
        "Keyword search",
        "Vector similarity",
        "Extraction",
        "Graph assertion"
      ],
      "pairs": [
        {
          "prompt": "Find exact terms and filters",
          "answer": "Keyword search"
        },
        {
          "prompt": "Retrieve semantically related passages",
          "answer": "Vector similarity"
        },
        {
          "prompt": "Create candidate entities and claims",
          "answer": "Extraction"
        },
        {
          "prompt": "Connect a reviewed statement to identities and evidence",
          "answer": "Graph assertion"
        }
      ],
      "feedback": {
        "correct": "Correct. Each method now has a visible job and limit.",
        "incorrect": "Separate exact retrieval, approximate retrieval, candidate creation, and explicit semantic assertion."
      },
      "completion_id": "methods"
    },
    {
