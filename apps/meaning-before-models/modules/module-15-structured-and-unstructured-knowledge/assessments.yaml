    {
      "assessment_id": "mbm15-opening",
      "type": "flip-cards",
      "cognitive_job": "preserve conflict",
      "prompt": "Predict what must remain visible before turning each evidence card.",
      "cards": [
        {
          "front": "Two sources disagree",
          "back": "Preserve both claims, both source paths, and the unresolved conflict."
        },
        {
          "front": "A document has no effective date",
          "back": "Mark time as missing and prevent time-sensitive governing use."
        },
        {
          "front": "A passage is semantically similar",
          "back": "Treat it as retrieved evidence, not as an approved graph assertion."
        },
        {
          "front": "A reviewer approves one scoped use",
          "back": "Record the reviewer, authority, scope, and effective interval without deleting history."
        }
      ],
      "feedback": {
        "correct": "You preserved conflict, time, evidence state, and scoped authority."
      },
      "completion_id": "opening"
    },
    {
      "assessment_id": "mbm15-methods",
