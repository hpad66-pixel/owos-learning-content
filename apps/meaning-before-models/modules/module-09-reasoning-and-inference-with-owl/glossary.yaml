{
  "schema_version": 1,
  "module_id": "mbm001:09",
  "terms": [
    {
      "term": "assertion",
      "definition": "A statement explicitly present in the graph."
    },
    {
      "term": "axiom",
      "definition": "A formal semantic declaration used by a reasoner."
    },
    {
      "term": "entailment",
      "definition": "A statement that follows from premises under declared semantics."
    },
    {
      "term": "inference",
      "definition": "The derivation or availability of an entailed statement."
    },
    {
      "term": "open-world assumption",
      "definition": "The principle that absence of a statement normally does not establish its opposite."
    },
    {
      "term": "reasoner",
      "definition": "Software that computes or checks logical consequences."
    },
    {
      "term": "proof trace",
      "definition": "A reviewable path from premises and axioms to a conclusion."
    }
  ]
}
