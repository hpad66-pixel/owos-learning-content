      "Distinguish known true known false and unknown",
      "Recognize inverse transitive equivalent-class and class-membership entailments",
      "Set an operational-use boundary for inferred statements"
    ],
    "prior_knowledge": "The learner understands RDF triples, graph paths, vocabularies, ontologies, and SPARQL patterns.",
