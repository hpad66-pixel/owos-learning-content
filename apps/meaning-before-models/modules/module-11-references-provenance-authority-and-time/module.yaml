  "learning": {
    "audience": [
      "Utility leaders and nontechnical professionals",
      "Data GIS IT OT engineering governance and AI practitioners"
    ],
    "outcomes": [
      "Explain reference provenance authority and time as separate controls",
      "Read an evidence envelope",
      "Distinguish observation record and effective time",
      "Apply scoped authority and supersession policy",
      "Preserve conflict while selecting a bounded governing statement"
    ],
    "prior_knowledge": "The learner understands RDF graphs, ontology meaning, inference, and validation boundaries.",
    "misconception": "The newest record, most confident model, or named system is automatically authoritative.",
    "transfer_task": "Reconcile a telemetry observation, maintenance record, engineering rule, procedure, and permit clause for one decision."
  },
  "sections": [
    {
      "section_id": "conflict",
      "title": "Five credible claims disagree",
      "kind": "Evidence room opening",
      "blocks": [
        {
          "type": "prose",
          "paragraphs": [
            "At 09:12 SCADA reports Outfall O-7 active. The CMMS record says inspection overdue. An approved engineering rule says an overdue inspection requires review before a status claim supports discharge decisions. A retired procedure says weekly visual checks are enough. The current permit clause uses a different inspection interval.",
            "Every statement may be represented as a triple, yet representation alone does not tell an agent which claim governs. The graph also needs references to source, production activity, responsible agent, time, version, review, supersession, and access."
          ]
        },
        {
          "type": "visual",
          "visual_id": "mbm11-evidence-envelope"
        },
        {
          "type": "assessment",
          "assessment_id": "mbm11-opening"
        }
      ]
    },
    {
      "section_id": "provenance",
      "title": "A claim has a production history",
      "kind": "Provenance chain",
      "blocks": [
        {
          "type": "prose",
          "paragraphs": [
            "PROV-O provides concepts such as Entity, Activity, and Agent. A sensor observation can be generated by a device, transformed by an ingestion process, mapped by a semantic pipeline, and reviewed by a steward. Each step can affect interpretation.",
            "Provenance is not a decorative source link. It lets a reviewer ask who or what produced the claim, from which input, through which activity, and whether the chain is reproducible."
          ]
        },
        {
          "type": "visual",
          "visual_id": "mbm11-provenance-chain"
        },
        {
          "type": "assessment",
          "assessment_id": "mbm11-provenance"
        }
      ]
    },
    {
      "section_id": "time",
      "title": "One timestamp cannot answer every temporal question",
      "kind": "Dual timeline",
      "blocks": [
        {
          "type": "prose",
          "paragraphs": [
            "Observation time says when the condition was observed. Record time says when the system stored or changed the statement. Effective time says when a policy, permit, or relationship governs. These clocks can diverge.",
            "A permit clause uploaded today may have been effective for months. A late-arriving sensor packet may be newly recorded but describe yesterday. Agents must compare the time relevant to the decision, not simply sort by newest file."
          ]
        },
        {
          "type": "visual",
          "visual_id": "mbm11-dual-timeline"
        },
        {
          "type": "assessment",
          "assessment_id": "mbm11-time"
        }
      ]
    },
    {
      "section_id": "hearing",
      "title": "Reconcile claims without deleting disagreement",
      "kind": "Evidence Reconciliation Hearing",
      "blocks": [
        {
          "type": "prose",
          "paragraphs": [
            "For each claim, inspect its source, production path, authority scope, effective interval, and review state. Choose Governing when policy authorizes it for this decision, Supporting when it informs but does not decide, Superseded when a governed version replaces it, or Hold when evidence is insufficient.",
            "The goal is not one universal winner. The same claim may govern one use and remain merely supporting for another."
          ]
        },
        {
          "type": "interaction",
          "interaction_id": "mbm11-evidence-hearing"
        }
      ]
    },
    {
      "section_id": "supersession",
      "title": "Current use and historical evidence must coexist",
      "kind": "Version ledger",
      "blocks": [
        {
          "type": "prose",
          "paragraphs": [
            "Supersession changes permitted current use without erasing history. Keep the retired procedure, its effective interval, and the statement that replaced it. That record explains past actions and prevents an agent from retrieving an obsolete rule as current.",
            "Authority must be scoped. The CMMS may be authoritative for work-order status, while the permit is authoritative for regulatory requirements and SCADA is evidence of observed process state."
          ]
        },
        {
          "type": "visual",
          "visual_id": "mbm11-supersession-ledger"
        },
        {
          "type": "assessment",
          "assessment_id": "mbm11-authority"
        }
      ]
    },
    {
      "section_id": "ledger",
      "title": "Package the claim before an agent receives it",
      "kind": "Professional application",
      "blocks": [
        {
          "type": "prose",
          "paragraphs": [
            "Build an evidence ledger for one contested utility decision. Preserve the original claim and source reference. Record what transformed it, who reviewed it, which time interval matters, and what policy assigns authority.",
            "If the evidence cannot support a decision, record Hold with the missing evidence and escalation route. Uncertainty made explicit is safer than false certainty."
          ]
        },
        {
          "type": "work_product",
          "work_product_id": "mbm11-authority-ledger"
        },
        {
          "type": "faq",
          "items": [
            {
              "question": "Is a source system automatically authoritative?",
              "answer": "No. Authority is assigned by organizational policy for a defined subject and use. A system name alone does not establish it."
            },
            {
              "question": "What is the difference between provenance and a citation?",
              "answer": "A citation points to a source. Provenance can describe the chain of entities activities and agents that produced or transformed a claim."
            },
            {
              "question": "Why keep superseded statements?",
              "answer": "They explain historical decisions, support audit, and show which effective interval applied. Mark them as superseded rather than deleting them."
            },
            {
              "question": "Which timestamp should an AI agent use?",
              "answer": "The timestamp tied to the decision: observation time for a measured condition, effective time for a governing rule, and record time for system history."
            },
            {
              "question": "Does PROV-O decide which source wins?",
              "answer": "No. PROV-O represents provenance relationships. Your governance policy assigns authority and governing use."
            }
          ]
        },
        {
          "type": "evidence",
          "statement": "PROV-O provides a vocabulary for provenance. Organizational policy, not RDF or PROV-O alone, assigns authority, supersession, access, and governing use.",
          "source_refs": [
            "w3c-prov-o",
            "w3c-rdf-concepts"
          ]
        }
      ]
    }
  ],
