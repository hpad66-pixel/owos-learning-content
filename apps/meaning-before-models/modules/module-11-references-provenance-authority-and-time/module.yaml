    "title": "References, Provenance, Authority, and Time",
    "eyebrow": "Meaning Before Models, Module 11",
    "promise": "Reconcile conflicting utility claims by preserving their sources, production histories, authority scopes, effective times, versions, and permitted uses.",
    "duration": "75 to 90 minutes",
    "level": "Foundation with Practitioner and Leader depth",
    "archetype": "evidence-reconciliation-room",
    "signature_mechanism": "claim-reconciliation-hearing",
