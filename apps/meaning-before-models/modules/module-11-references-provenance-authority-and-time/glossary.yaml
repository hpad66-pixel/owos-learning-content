  "terms": [
    {
      "term": "reference",
      "definition": "A durable locator or identifier that connects a claim to supporting material."
    },
    {
      "term": "provenance",
      "definition": "Information about the entities activities and agents involved in producing or transforming a claim."
    },
    {
      "term": "authority",
      "definition": "Policy-assigned permission for a source or role to govern a defined subject and use."
    },
    {
      "term": "observation time",
      "definition": "When a condition was observed or measured."
    },
    {
      "term": "record time",
      "definition": "When a system stored or changed a record."
    },
    {
      "term": "effective time",
      "definition": "The interval during which a rule relationship or statement governs."
    },
    {
      "term": "supersession",
      "definition": "A governed relationship stating that a newer version replaces another for defined uses."
    }
  ]
