<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img">
<title>Recorded today may have governed yesterday</title><desc>Two aligned timelines show a permit effective in January, uploaded in April, corrected in May, and a decision in March governed by the January effective interval</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f8fbfd"/><stop offset="1" stop-color="#e8f0f4"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-opacity=".12"/></filter></defs>
<rect width="1200" height="675" rx="28" fill="url(#bg)"/><rect x="42" y="38" width="1116" height="599" rx="24" fill="#fff" stroke="#b8c7d0" filter="url(#s)"/>
<rect x="42" y="38" width="1116" height="70" rx="24" fill="#10243a"/><rect x="42" y="84" width="1116" height="24" fill="#10243a"/>
<text x="78" y="83" fill="#fff" font-family="Arial" font-size="28" font-weight="700">Recorded today may have governed yesterday</text>
<style>.h{font:700 23px Arial;fill:#10243a}.p{font:18px Arial;fill:#334b5c}.s{font:700 16px Arial;fill:#fff}.box{fill:#fff;stroke:#9fb0bc;stroke-width:2}.accent{fill:#7a58a6}.line{stroke:#607b8c;stroke-width:4;fill:none}.dash{stroke:#7a58a6;stroke-width:4;stroke-dasharray:9 8;fill:none}</style>
<text class="h" x="90" y="190">EFFECTIVE TIME</text><line x1="300" y1="185" x2="1090" y2="185" stroke="#334b5c" stroke-width="5"/><rect x="390" y="150" width="520" height="70" rx="14" fill="#e7f5ef" stroke="#22805d" stroke-width="3"/><text class="p" x="470" y="193">Permit v4 governs Jan 1 → Jun 30</text><text class="h" x="90" y="405">RECORD TIME</text><line x1="300" y1="400" x2="1090" y2="400" stroke="#334b5c" stroke-width="5"/><circle cx="680" cy="400" r="14" class="accent"/><text class="p" x="625" y="450">Uploaded Apr 4</text><circle cx="860" cy="400" r="14" fill="#c57229"/><text class="p" x="810" y="500">Corrected May 9</text><path class="dash" d="M520 220V540"/><text class="h" x="410" y="585">Decision Mar 15: use effective interval, not upload date</text><text class="p" x="350" y="130">JAN</text><text class="p" x="650" y="130">APR</text><text class="p" x="835" y="130">MAY</text></svg>