- visual_id: mbm11-evidence-envelope
  title: A claim needs an evidence envelope
  asset_class: claim-context-envelope
  locator: visuals/evidence-envelope.svg
  component_id: null
  teaching_idea: Show the context required around a triple for governed use
  learner_conclusion: The triple remains central but cannot carry authority and time
    alone
  reading_guide: Start with the claim in the center and inspect each surrounding decision
    field
  alternative_text: A central Outfall O-7 has status Active triple is surrounded by
    source provenance authority time version review and access fields
  mobile_treatment: Stack the visual sequence vertically while preserving labels and
    arrows
  reduced_motion_treatment: The static diagram preserves the complete teaching meaning
