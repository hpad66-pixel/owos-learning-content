- visual_id: mbm11-supersession-ledger
  title: Supersession changes current use without erasing history
  asset_class: version-authority-stack
  locator: visuals/supersession-ledger.svg
  component_id: null
  teaching_idea: Preserve version history while clearly marking governing use
  learner_conclusion: Current and historical claims can coexist safely
  reading_guide: Read the stack from retained history to current governing version
