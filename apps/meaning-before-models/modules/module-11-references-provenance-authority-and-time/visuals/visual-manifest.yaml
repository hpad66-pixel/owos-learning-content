- visual_id: mbm11-dual-timeline
  title: Recorded today may have governed yesterday
  asset_class: dual-effective-record-timeline
  locator: visuals/dual-timeline.svg
  component_id: null
  teaching_idea: Separate system history from real-world or policy effect
  learner_conclusion: Select the clock relevant to the decision
  reading_guide: Compare the upper effective interval with lower record events at
    the same dates
  alternative_text: Two aligned timelines show a permit effective in January, uploaded
    in April, corrected in May, and a decision in March governed by the January effective
    interval
  mobile_treatment: Stack the visual sequence vertically while preserving labels and
