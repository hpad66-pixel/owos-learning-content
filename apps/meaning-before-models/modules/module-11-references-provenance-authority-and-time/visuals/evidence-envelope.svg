<rect class="accent" x="390" y="275" width="420" height="130" rx="24"/><text class="s" x="455" y="325">Outfall O-7 → hasStatus → Active</text><text class="s" x="500" y="365">THE CLAIM</text><g class="box"><rect x="90" y="150" width="250" height="100" rx="16"/><rect x="90" y="440" width="250" height="100" rx="16"/><rect x="860" y="150" width="250" height="100" rx="16"/><rect x="860" y="440" width="250" height="100" rx="16"/></g><text class="h" x="150" y="195">SOURCE</text><text class="p" x="130" y="225">SCADA packet + URI</text><text class="h" x="135" y="485">PROVENANCE</text><text class="p" x="125" y="515">sensor → transform</text><text class="h" x="925" y="195">TIME</text><text class="p" x="900" y="225">observed • recorded</text><text class="h" x="910" y="485">AUTHORITY</text><text class="p" x="895" y="515">scope • review • use</text><path class="dash" d="M340 215L450 290M340 490L450 390M860 215L750 290M860 490L750 390"/><text class="p" x="460" y="555">Version • supersession • access boundary</text></svg>