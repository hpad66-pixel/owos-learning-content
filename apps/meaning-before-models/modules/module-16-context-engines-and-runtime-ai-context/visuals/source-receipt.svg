<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img"><title>Every context element carries a source and state receipt</title><desc>Telemetry, permit, identity, workflow, and permission sources fan into a context receipt with time, version, authority, review, and access</desc>
<defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#f7fbfd"/><stop offset="1" stop-color="#e5eef3"/></linearGradient><filter id="d"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-opacity=".13"/></filter></defs>
<rect width="1200" height="675" rx="28" fill="url(#g)"/><rect x="42" y="38" width="1116" height="599" rx="24" fill="#fff" stroke="#aebfc9" filter="url(#d)"/>
<rect x="42" y="38" width="1116" height="72" rx="24" fill="#10243a"/><rect x="42" y="84" width="1116" height="26" fill="#10243a"/>
<text x="78" y="84" fill="#fff" font-family="Arial" font-size="28" font-weight="700">Every context element carries a source and state receipt</text>
<style>.h{font:700 23px Arial;fill:#10243a}.p{font:18px Arial;fill:#334b5c}.s{font:700 16px Arial;fill:#fff}.b{fill:#fff;stroke:#91a7b4;stroke-width:2}.x{fill:#6d55a0}.l{stroke:#607b8c;stroke-width:4;fill:none}.q{stroke:#6d55a0;stroke-width:4;stroke-dasharray:10 8;fill:none}</style><g class="b"><rect x="70" y="140" width="230" height="80" rx="15"/><rect x="70" y="250" width="230" height="80" rx="15"/><rect x="70" y="360" width="230" height="80" rx="15"/><rect x="70" y="470" width="230" height="80" rx="15"/></g><text class="h" x="110" y="190">TELEMETRY</text><text class="h" x="110" y="300">PERMIT</text><text class="h" x="110" y="410">IDENTITY</text><text class="h" x="110" y="520">WORKFLOW</text><path class="l" d="M300 180L470 315M300 290L470 335M300 400L470 375M300 510L470 395"/><rect class="x" x="470" y="205" width="330" height="340" rx="26"/><text class="s" x="545" y="260">CONTEXT RECEIPT</text><text class="s" x="530" y="320">source + locator + version</text><text class="s" x="530" y="365">observation / effective time</text><text class="s" x="530" y="410">authority + review</text><text class="s" x="530" y="455">access + transformation</text><path class="l" d="M800 375H900"/><rect class="b" x="900" y="265" width="230" height="220" rx="20"/><text class="h" x="950" y="315">PACKET</text><text class="p" x="940" y="365">included / denied</text><text class="p" x="940" y="405">fresh / stale</text><text class="p" x="940" y="445">resolved / hold</text></svg>