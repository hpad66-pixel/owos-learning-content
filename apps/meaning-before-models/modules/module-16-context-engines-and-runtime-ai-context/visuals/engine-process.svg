<style>.h{font:700 23px Arial;fill:#10243a}.p{font:18px Arial;fill:#334b5c}.s{font:700 16px Arial;fill:#fff}.b{fill:#fff;stroke:#91a7b4;stroke-width:2}.x{fill:#236b82}.l{stroke:#607b8c;stroke-width:4;fill:none}.q{stroke:#236b82;stroke-width:4;stroke-dasharray:10 8;fill:none}</style><path class="q" d="M90 355H1110"/><g class="b"><rect x="65" y="280" width="160" height="150" rx="18"/><rect x="245" y="280" width="160" height="150" rx="18"/><rect x="425" y="280" width="160" height="150" rx="18"/><rect x="605" y="280" width="160" height="150" rx="18"/><rect x="785" y="280" width="160" height="150" rx="18"/><rect x="965" y="280" width="170" height="150" rx="18"/></g><text class="h" x="90" y="325">INTENT</text><text class="p" x="90" y="370">task + role</text><text class="h" x="270" y="325">IDENTITY</text><text class="p" x="270" y="370">resolve subject</text><text class="h" x="450" y="325">RETRIEVE</text><text class="p" x="450" y="370">source evidence</text><text class="h" x="630" y="325">FILTER</text><text class="p" x="630" y="370">permissions</text><text class="h" x="810" y="325">VALIDATE</text><text class="p" x="810" y="370">fresh + conflict</text><text class="h" x="990" y="325">ASSEMBLE</text><text class="p" x="990" y="370">bounded packet</text></svg>