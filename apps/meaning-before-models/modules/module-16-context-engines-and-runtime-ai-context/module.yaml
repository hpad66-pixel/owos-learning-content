    ],
    "outcomes": [
      "Distinguish durable semantic assets, a context engine, and runtime AI context",
      "Identify required optional prohibited stale and conflicting context elements",
      "Trace every context element to source or runtime state",
      "Apply least privilege and fail-closed workflow gates",
      "Author and test a Runtime AI Context Contract"
    ],
    "prior_knowledge": "The learner understands meaning layers, provenance, mapping, access patterns, and evidence promotion.",
    "misconception": "A long prompt, vector search, or large context window is the same as governed runtime context.",
    "transfer_task": "Assemble context for an overflow-response recommendation under a current permit and approval workflow."
