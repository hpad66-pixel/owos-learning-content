schema_version: 1
module_id: mbm001:05
terms:
  - term: data model
    definition: A structured description of entities, attributes, relationships, keys, cardinalities, and constraints for a system, application, report, integration, or analytical use.
  - term: taxonomy
    definition: A controlled classification or hierarchy used to organize terms, categories, or types.
  - term: ontology
    definition: A shared description of domain concepts, relationships, classifications, and selected rules independently of one source system.
  - term: semantic layer
    definition: Governed mappings and services that connect shared business meaning to fields, tables, metrics, application interfaces, events, and authoritative sources.
  - term: AI context
    definition: The task-specific package of evidence, definitions, policy, time, permission, workflow state, conflicts, and output limits supplied at runtime.
  - term: context engine
    definition: A governed mechanism that retrieves, filters, validates, and assembles AI context for a task.
  - term: mapping
    definition: A controlled connection between a shared concept or relationship and its representation in an enterprise source.
  - term: effective time
    definition: The time at which a fact, rule, status, or policy applies to the decision.
  - term: authority
    definition: The recognized person, role, source, or process permitted to approve a definition, claim, policy, or action.
  - term: provenance
    definition: Information about where a statement came from, who asserted or transformed it, and under what conditions.
