schema_version: 1
status: approved_for_design
course_id: owos-course-semantic-data-ai-001
module:
  id: mbm001:05
  number: 5
  title: Data Model, Taxonomy, Ontology, Semantic Layer, and AI Context
  part: Build shared meaning
  curriculum_role: architecture_distinction_map
learning_job:
  learner_question: Which meaning artifact is doing which job?
  outcome: Distinguish five commonly mixed concepts and route a utility artifact to the correct layer.
  prior_knowledge: Connected graph paths from Module 04.
  misconception: Structure, classification, shared meaning, enterprise mapping, and runtime context are interchangeable.
  transfer_task: Diagnose a wastewater overflow architecture that mixes the five jobs.
depth:
  common_route: The question, artifact, utility example, and failure mode for each concept.
  practitioner: Map representative fields, definitions, policies, and context elements to the five jobs.
  leader: Assign ownership and funding responsibility across the five jobs.
experience:
  archetype: decision_room
  opening: A pressure-event team has data, definitions, mappings, and a prompt but still cannot agree on customer exposure.
  mental_model: Five distinct jobs connected in one governed answer path.
  signature_mechanism: Classify enterprise artifacts, assemble a context packet, and trace the failure caused by one missing job.
  visual_jobs:
    - Compare the five jobs without presenting them as a mandatory technology stack.
    - Show the evidence and accountable roles around a pressure-event decision.
    - Reveal how a missing definition, mapping, policy, or runtime element changes the result.
  assessment_jobs:
    - Classify artifacts by primary job.
    - Diagnose a mixed architecture.
    - Assign ownership and defend a five-layer meaning map.
  work_product: Five-Layer Meaning Map
  capstone_contribution: Architecture distinctions, accountable owners, and known gaps.
evidence:
  source_refs: [DIR-005, SRC-001, SRC-005]
  claim_refs: [CLM-028, CLM-029, CLM-030]
  boundary: These terms vary across organizations and products. The course defines its usage explicitly.
sequence:
  requires: [mbm001:04]
  prepares: [mbm001:06, mbm001:07, mbm001:12, mbm001:16]
