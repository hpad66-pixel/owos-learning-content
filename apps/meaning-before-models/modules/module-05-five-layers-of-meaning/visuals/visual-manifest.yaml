visuals:
- visual_id: mbm05-pressure-room
  title: The 2:10 a.m. pressure decision room
  asset_class: original-editorial-utility-scene
  locator: visuals/pressure-decision-room.svg
  component_id: null
  teaching_idea: Several utility systems contribute evidence, but no single system
    owns shared meaning, runtime scope, and operational authority.
  learner_conclusion: The team can possess the data and still lack a defensible answer.
  reading_guide: Begin at the pressure event, inspect CIS, GIS, SCADA, and procedure
    evidence, then follow the unresolved terms to the named human decision.
  alternative_text: A utility decision room at 2:10 a.m. shows a Zone 3 pressure event,
    evidence from four systems, disputed definitions, a mapping gap, runtime controls,
    and a duty manager responsible for the decision.
  mobile_treatment: Recompose the scene into event, evidence desk, and decision panels
    in reading order.
  reduced_motion_treatment: The static illustration contains all relationships and
    labels.
  creator: One Water OS course production
  source: Instructional Zone 3 scenario and Hardeep Anand course direction
  license: Planned original OWOS course asset
  permission_status: approved
  originality_status: original
  storyboard_status: approved
  rendered_review_status: approved
- visual_id: mbm05-five-job-comparison
  title: Five questions, five meaning jobs
  asset_class: governed-comparison
  locator: visuals/five-job-comparison.svg
  component_id: null
  teaching_idea: Data model, taxonomy, ontology, semantic layer, and AI context answer
    different architecture questions.
  learner_conclusion: Distinguish the terms by the job, artifact, owner, and failure
    rather than by a vendor label.
  reading_guide: Read each row from its plain-language question to its utility artifact,
    accountable owner, and missing-job failure.
  alternative_text: A five-row comparison distinguishes data model, taxonomy, ontology,
    semantic layer, and AI context through their questions, artifacts, owners, and
    failure modes.
  mobile_treatment: Convert rows into five ordered comparison cards with repeated
    column labels.
  reduced_motion_treatment: Static comparison contains the complete explanation.
  creator: One Water OS course production
  source: Approved OWOS five-job teaching framework
  license: Planned original OWOS course asset
  permission_status: approved
  originality_status: original
  storyboard_status: approved
  rendered_review_status: approved
- visual_id: mbm05-semantic-bridge
  title: From shared meaning to a current customer record
  asset_class: concept-to-source-connection-map
  locator: visuals/semantic-bridge.svg
  component_id: null
  teaching_idea: An ontology defines reusable meaning while the semantic layer maps
    that meaning to governed source fields and records.
  learner_conclusion: Correct meaning does not prevent mapping drift, so meanings
    and mappings need separate tests.
  reading_guide: Start with ActiveServiceAccount, cross the tested mapping bridge,
    inspect CIS fields, and finish at the effective record used for the event.
  alternative_text: A shared ActiveServiceAccount concept connects through a governed
    mapping to CIS status and effective-date fields, then to the current account record
    for the Zone 3 event.
  mobile_treatment: Stack concept, mapping, fields, and record vertically with the
    same numbered reading order.
  reduced_motion_treatment: Static bridge and text sequence preserve all states.
  creator: One Water OS course production
  source: Instructional utility mapping scenario
  license: Planned original OWOS course asset
  permission_status: approved
  originality_status: original
  storyboard_status: approved
  rendered_review_status: approved
- visual_id: mbm05-context-packet
  title: What this task needs now
  asset_class: runtime-context-packet-anatomy
  locator: visuals/context-packet.svg
  component_id: null
  teaching_idea: AI context is a bounded task package assembled from evidence and
    controls.
  learner_conclusion: Relevant evidence is necessary but insufficient without definitions,
    policy, time, permission, conflicts, and output limits.
  reading_guide: Read the task envelope first, then inspect the included evidence
    and controls, and finally inspect the excluded unauthorized or irrelevant material.
  alternative_text: An exploded AI context packet contains the task, evidence, definitions,
    current policy, time, permission, conflicts, workflow state, and output limits,
    while irrelevant and unauthorized records remain outside.
  mobile_treatment: Present the packet as ordered expandable groups with included
    and excluded states stated in text.
  reduced_motion_treatment: A fully expanded static alternative contains every packet
    element.
  creator: One Water OS course production
  source: Approved course direction on runtime AI context
  license: Planned original OWOS course asset
  permission_status: approved
  originality_status: original
  storyboard_status: approved
  rendered_review_status: approved
- visual_id: mbm05-failure-trace
  title: Find the first broken meaning job
  asset_class: executable-failure-propagation-map
  locator: visuals/failure-propagation.svg
  component_id: null
  teaching_idea: Missing structure, classification, meaning, mapping, or runtime context
    produces different downstream symptoms and repair owners.
  learner_conclusion: Repair should begin at the first broken responsibility, even
    when the symptom appears in the final answer.
  reading_guide: Select one missing job, follow its consequence through the answer
    path, and compare the recommended repair and accountable role.
  alternative_text: An interactive cause map traces five possible missing meaning
    jobs to distinct data, interpretation, retrieval, permission, and answer failures.
  mobile_treatment: Use one selectable failure path at a time followed by a complete
    textual cause and repair sequence.
  reduced_motion_treatment: State changes occur instantly and every path is available
    as text.
  creator: One Water OS course production
  source: Approved OWOS five-job teaching framework
  license: Planned original OWOS course component
  permission_status: approved
  originality_status: original
  storyboard_status: approved
  rendered_review_status: approved
