schema_version: 1
module_id: mbm001:02
terms:
  - {term: RDF term, definition: A value that may appear in an RDF triple position under the RDF data model.}
  - {term: IRI, definition: A globally scoped identifier used to denote a resource in RDF.}
  - {term: resource, definition: A thing in the domain that an RDF term denotes.}
  - {term: literal, definition: A value such as a string, number, date, or boolean represented in an RDF object position.}
  - {term: datatype, definition: An identifier defining how a literal's lexical form maps to a value.}
  - {term: label, definition: Human-readable text describing an identified resource.}
  - {term: lexical form, definition: The character sequence used to write a literal value.}
  - {term: prefix, definition: A syntax convenience that abbreviates a namespace IRI in serializations such as Turtle.}
  - {term: Turtle, definition: A compact textual syntax for writing RDF graphs.}
  - {term: serialization, definition: A concrete notation used to encode and exchange an RDF graph or dataset.}
