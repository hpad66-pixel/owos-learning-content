{
  "schema_version": 1,
  "module_id": "mbm001:12",
  "terms": [
    {
      "term": "Knowledge Spine",
      "definition": "A governed architecture that connects shared meaning, source data, semantic services, consumers, and corrections."
    },
    {
      "term": "semantic service",
      "definition": "A runtime capability such as graph query, reasoning, validation, reconciliation, or explanation."
    },
    {
      "term": "connection fabric",
      "definition": "Governed interfaces and mappings that connect concepts to owned sources."
    },
    {
      "term": "consumption plane",
      "definition": "The services that package governed evidence for business intelligence, applications, agents, and stewards."
    },
    {
      "term": "service level",
      "definition": "A measurable promise for latency, freshness, availability, or recovery."
    },
    {
      "term": "evidence receipt",
      "definition": "A record of the sources, time, version, proof, validation, and permissions behind an answer."
    }
  ]
}
