    "outcomes": [
      "Explain why an ontology file is not a running service",
      "Identify governance semantic connection consumption and reliability responsibilities",
      "Route one utility question to source-bounded evidence",
      "Assign accountable owners across the operating path",
      "Design a bounded Knowledge Spine without copying everything"
    ],
    "prior_knowledge": "The learner understands ontology, SPARQL, OWL, SHACL, provenance, authority, and time.",
