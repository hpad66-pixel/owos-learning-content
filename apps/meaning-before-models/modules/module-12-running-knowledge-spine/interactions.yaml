          {
            "label": "Action",
            "claim": "Authorize customer notification after review.",
            "evidence": "Current policy and accountable approval.",
            "rule": "Operational action remains under operating policy.",
            "answer": "Operations policy owner",
            "explanation": "Semantic evidence does not grant notification authority."
          },
          {
            "label": "Correction",
            "claim": "Investigate a conflicting customer-premise link.",
            "evidence": "Conflict queue and source receipts.",
            "rule": "A steward coordinates evidence and review.",
