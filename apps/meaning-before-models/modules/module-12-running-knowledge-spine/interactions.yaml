      "teaching_purpose": "Assign decisions to accountable operating roles.",
      "instructions": "Choose the accountable owner for each decision. Correct every handoff.",
      "completion_id": "accountability",
      "config": {
        "choices": [
          "Domain owner",
          "Source owner",
          "Semantic platform owner",
          "Application owner",
          "Operations policy owner",
          "Data steward"
