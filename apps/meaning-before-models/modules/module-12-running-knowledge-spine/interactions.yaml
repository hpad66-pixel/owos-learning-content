            "claim": "Deliver customer, date, policy, permissions, and evidence to an agent.",
            "evidence": "Consumer contract and runtime request.",
            "rule": "Consumer-specific packaging belongs in the consumption plane.",
            "answer": "Consumption plane",
            "explanation": "The plane shapes governed evidence for a particular consumer."
