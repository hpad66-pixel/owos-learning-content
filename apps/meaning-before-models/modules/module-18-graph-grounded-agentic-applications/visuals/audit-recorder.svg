<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Agent Action Flight Recorder</title>
  <desc id="desc">A timeline links proposal, evidence, policy, human approval, tool request, uncertain response, reconciliation, verification, and final audit receipt.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#516178"/></marker></defs>
  <rect width="1200" height="720" rx="34" fill="#f7f8fb"/>
  <text x="62" y="70" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#14213d">Agent Action Flight Recorder</text>
  <text x="62" y="106" font-family="Arial,sans-serif" font-size="18" fill="#516178">Every decision and side effect remains linked to one request identity.</text>
  <line x1="100" y1="330" x2="1100" y2="330" stroke="#516178" stroke-width="5" marker-end="url(#arrow)"/>
  <g font-family="Arial,sans-serif">
    <g fill="#fff" stroke="#738099" stroke-width="2">
      <rect x="54" y="156" width="150" height="120" rx="18"/><rect x="240" y="382" width="150" height="120" rx="18"/>
      <rect x="426" y="156" width="150" height="120" rx="18"/><rect x="612" y="382" width="150" height="120" rx="18"/>
      <rect x="798" y="156" width="150" height="120" rx="18"/><rect x="984" y="382" width="150" height="120" rx="18"/>
    </g>
    <g fill="#147d6f">
      <circle cx="129" cy="330" r="18"/><circle cx="315" cy="330" r="18"/><circle cx="501" cy="330" r="18"/>
      <circle cx="687" cy="330" r="18"/><circle cx="873" cy="330" r="18"/><circle cx="1059" cy="330" r="18"/>
    </g>
    <g stroke="#738099" stroke-width="3">
      <path d="M129 312v-36"/><path d="M315 348v34"/><path d="M501 312v-36"/><path d="M687 348v34"/><path d="M873 312v-36"/><path d="M1059 348v34"/>
    </g>
    <g text-anchor="middle" fill="#14213d">
      <text x="129" y="190" font-size="16" font-weight="700">PROPOSAL</text>
      <text x="129" y="219" font-size="14">Draft inspection</text><text x="129" y="241" font-size="14">work order</text>
      <text x="315" y="418" font-size="16" font-weight="700">EVIDENCE</text>
      <text x="315" y="447" font-size="14">Graph path +</text><text x="315" y="469" font-size="14">fresh inspection</text>
      <text x="501" y="190" font-size="16" font-weight="700">AUTHORITY</text>
      <text x="501" y="219" font-size="14">Draft role +</text><text x="501" y="241" font-size="14">policy v4.2</text>
      <text x="687" y="418" font-size="16" font-weight="700">TOOL CALL</text>
      <text x="687" y="447" font-size="14">Request K-441</text><text x="687" y="469" font-size="14">times out</text>
      <text x="873" y="190" font-size="16" font-weight="700">RECONCILE</text>
      <text x="873" y="219" font-size="14">WO-881 found</text><text x="873" y="241" font-size="14">with key K-441</text>
      <text x="1059" y="418" font-size="16" font-weight="700">VERIFY</text>
      <text x="1059" y="447" font-size="14">One draft exists</text><text x="1059" y="469" font-size="14">no dispatch</text>
    </g>
    <rect x="236" y="570" width="728" height="92" rx="24" fill="#14213d"/>
    <text x="600" y="604" text-anchor="middle" font-size="16" fill="#c9d4e5">FINAL AUDIT RECEIPT</text>
    <text x="600" y="632" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">Proposal + evidence + policy + actor + tool + verification + owners</text>
    <text x="600" y="647" text-anchor="middle" font-size="13" fill="#c9d4e5">A timeout is preserved as an event, not rewritten as success or failure.</text>
  </g>
</svg>
