{
  "schema_version": 1,
  "module_id": "mbm001:18",
  "terms": [
    {"term": "agentic application", "definition": "Software that uses a model or other decision logic to plan or select steps and invoke tools within an operating boundary."},
    {"term": "grounding", "definition": "Connecting an answer or proposal to identified evidence, relationships, sources, and applicable meaning."},
    {"term": "authorization", "definition": "The decision that an authenticated actor may perform a specific action on a specific target under current policy and conditions."},
    {"term": "delegated authority", "definition": "A bounded set of actions an accountable owner permits a role or system to perform without a new approval each time."},
    {"term": "tool contract", "definition": "The allowed operation, input schema, parameter limits, preconditions, outputs, errors, and postconditions for an external tool."},
    {"term": "idempotency key", "definition": "A stable identifier for one intended request that helps a receiving system detect and prevent duplicate side effects."},
    {"term": "external state", "definition": "The current condition of a system outside the model or agent, such as whether a work order already exists."},
    {"term": "postcondition", "definition": "The state that must be true after an action succeeds, verified in an authoritative system."},
    {"term": "audit receipt", "definition": "A linked record of proposal, evidence, policy, approval, tool execution, verification, time, and accountable ownership."},
    {"term": "stop state", "definition": "A controlled outcome that prevents an unsafe, prohibited, ambiguous, stale, or unverifiable action from proceeding."}
  ]
}
