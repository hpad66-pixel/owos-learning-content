        "Fixed",
        "Configurable",
        "Probabilistic",
        "External"
      ],
      "pairs": [
        {
          "prompt": "Version-pinned SPARQL text",
          "answer": "Fixed"
        },
        {
          "prompt": "Entailment profile selected at deployment",
          "answer": "Configurable"
        },
        {
          "prompt": "Sampling-enabled generated wording",
          "answer": "Probabilistic"
        },
        {
          "prompt": "Source API availability and current records",
          "answer": "External"
        }
      ],
      "feedback": {
        "correct": "Correct. Repeatability can now be tested stage by stage.",
        "incorrect": "Separate frozen artifacts, chosen settings, sampled behavior, and outside state."
      },
      "completion_id": "stability"
