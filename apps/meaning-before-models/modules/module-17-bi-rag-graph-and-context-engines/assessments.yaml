        {
          "front": "Query stage",
          "back": "Test graph bindings, metric rows, time boundaries, and source snapshots."
        },
        {
          "front": "Generation stage",
          "back": "Test factual claims separately from permitted wording variation."
        },
        {
          "front": "Operational control stage",
          "back": "Test latency, denied permissions, stale evidence, and blocked states."
        }
      ],
      "feedback": {
        "correct": "The evaluation plan now tests evidence, claims, expression, performance, and controls separately."
      },
