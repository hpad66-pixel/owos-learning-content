<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620"><title>OWOS explanatory visual</title><desc>Original instructional diagram with all relationships labeled in the surrounding lesson.</desc><rect width="1200" height="620" rx="28" fill="#101c2d"/><g font-family="Arial"><text x="55" y="65" font-size="26" font-weight="700" fill="white">QUERY CLAUSES AND GRAPH EDGES SAY THE SAME THING</text><rect x="55" y="105" width="520" height="450" rx="22" fill="#172943"/><text x="85" y="150" font-size="18" fill="#9ee7dc">SPARQL</text><g font-family="monospace" font-size="17" fill="white"><text x="85" y="200">SELECT ?account ?work</text><text x="85" y="245">WHERE {</text><text x="110" y="285">:Event77 :affects ?zone .</text><text x="110" y="325">?pump :serves ?zone .</text><text x="110" y="365">?zone :contains ?premise .</text><text x="110" y="405">?premise :hasAccount ?account .</text><text x="110" y="445">?work :concerns ?pump .</text><text x="85" y="485">}</text></g><rect x="625" y="105" width="520" height="450" rx="22" fill="#f8fafc"/><text x="655" y="150" font-size="18" font-weight="700" fill="#24364b">MATCHING PATH</text><path d="M690 315h405" stroke="#fbbf24" stroke-width="6"/><g text-anchor="middle"><circle cx="690" cy="315" r="52" fill="#a64b37"/><circle cx="825" cy="315" r="52" fill="#35668f"/><circle cx="960" cy="315" r="52" fill="#0f766e"/><circle cx="1095" cy="315" r="52" fill="#6d5aa8"/><g fill="white" font-size="14"><text x="690" y="320">event</text><text x="825" y="320">zone</text><text x="960" y="320">premise</text><text x="1095" y="320">account</text></g><g fill="#24364b" font-size="14"><text x="758" y="270">affects</text><text x="892" y="270">contains</text><text x="1027" y="270">hasAccount</text></g></g><rect x="690" y="435" width="390" height="65" rx="16" fill="#ecfdf5" stroke="#0f766e" stroke-width="3"/><text x="885" y="475" text-anchor="middle" font-size="17" fill="#12463f">Shared variables keep the route connected.</text></g></svg>
