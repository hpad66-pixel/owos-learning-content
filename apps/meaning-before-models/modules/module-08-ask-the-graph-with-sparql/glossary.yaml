terms: [{term: SPARQL, definition: The standard query language and protocol family for RDF graph data.}, {term: variable, definition: A placeholder that can bind to a matching graph term.}, {term: triple pattern, definition: A subject predicate object pattern that may contain variables.}, {term: graph pattern, definition: One or more patterns combined to describe a match.}, {term: binding, definition: A value assigned to a query variable by a match.}, {term: SELECT, definition: The query form that returns variable bindings.}, {term: FILTER, definition: A condition applied to candidate query solutions.}, {term: OPTIONAL, definition: A pattern that may add bindings without requiring a match for the row to remain.}, {term: federation, definition: Querying across configured graph endpoints or mapped sources.}]
