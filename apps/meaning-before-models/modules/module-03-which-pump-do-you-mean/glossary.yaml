schema_version: 1
module_id: mbm001:03
terms:
  - {term: source identifier, definition: The identifier a particular source system uses for a record or resource.}
  - {term: canonical identifier, definition: A governed reference identifier used by a bounded cross-system process after review.}
  - {term: identity candidate, definition: A proposed relationship that still requires evidence and approval.}
  - {term: crosswalk, definition: A reviewed mapping between source identifiers and a governed identity.}
  - {term: equivalence, definition: A claim that two identifiers denote the same thing under the stated semantics.}
  - {term: corroborating evidence, definition: Independent evidence that supports the same identity conclusion.}
  - {term: contradicting evidence, definition: Evidence that conflicts with or weakens a proposed identity conclusion.}
  - {term: provenance, definition: Information about where a record or claim came from and how it was produced or changed.}
  - {term: conflict queue, definition: A governed list of unresolved identity candidates awaiting review or additional evidence.}
  - {term: blast radius, definition: The downstream systems, answers, and decisions affected by an incorrect mapping.}
