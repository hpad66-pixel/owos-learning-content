<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t d"><title id="t">Steward conflict ledger</title><desc id="d">Identity candidates move through approved held escalated and corrected states with evidence owners and next actions.</desc><rect width="1200" height="560" rx="28" fill="#102f49"/><g font-family="Arial"><text x="50" y="60" font-size="28" font-weight="700" fill="#fff">THE CONFLICT QUEUE IS A CONTROL, NOT A TRASH CAN.</text><g font-size="14" font-weight="700" fill="#73d2bd"><text x="60" y="112">STATUS</text><text x="245" y="112">EVIDENCE</text><text x="590" y="112">ACCOUNTABLE OWNER</text><text x="890" y="112">NEXT ACTION</text></g><g stroke="#49657a"><path d="M50 130H1150"/><path d="M50 225H1150"/><path d="M50 320H1150"/><path d="M50 415H1150"/><path d="M50 510H1150"/></g><g font-size="17" fill="#fff"><rect x="60" y="154" width="130" height="42" rx="21" fill="#19795c"/><text x="88" y="181" font-weight="700">APPROVED</text><text x="245" y="180">Serial + place + history align</text><text x="590" y="180">Asset Data Steward</text><text x="890" y="180">Publish crosswalk</text><rect x="60" y="249" width="130" height="42" rx="21" fill="#b26d17"/><text x="102" y="276" font-weight="700">HELD</text><text x="245" y="275">Location contradicts label</text><text x="590" y="275">Operations + GIS</text><text x="890" y="275">Inspect field evidence</text><rect x="60" y="344" width="130" height="42" rx="21" fill="#8d4f9c"/><text x="82" y="371" font-weight="700">ESCALATED</text><text x="245" y="370">Sources disagree on replacement</text><text x="590" y="370">Asset Governance Lead</text><text x="890" y="370">Approve authority rule</text><rect x="60" y="439" width="130" height="42" rx="21" fill="#437caa"/><text x="84" y="466" font-weight="700">CORRECTED</text><text x="245" y="465">False merge withdrawn</text><text x="590" y="465">System Owners</text><text x="890" y="465">Recompute affected uses</text></g></g></sv