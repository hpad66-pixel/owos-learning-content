<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t d"><title id="t">Identity evidence bridge</title><desc id="d">Source identifiers cross several evidence checks and a steward approval gate before reaching a canonical identity.</desc><rect width="1200" height="560" rx="28" fill="#102f49"/><g font-family="Arial"><text x="55" y="62" font-size="28" font-weight="700" fill="#fff">IDENTITY IS A REVIEWED CROSSING</text><rect x="55" y="120" width="220" height="110" rx="14" fill="#fff"/><text x="80" y="158" font-size="14" font-weight="700" fill="#1d7b75">SOURCE IDENTIFIERS</text><text x="80" y="193" font-size="22" font-weight="700" fill="#102f49">GIS-8831</text><text x="80" y="218" font-size="18" fill="#344b59">PUMP-104</text><g fill="#dff3ed" stroke="#50a891" stroke-width="2"><rect x="335" y="100" width="170" height="58" rx="29"/><rect x="335" y="177" width="170" height="58" rx="29"/><rect x="335" y="254" width="170" height="58" rx="29"/><rect x="335" y="331" width="170" height="58" rx="29"/></g><g font-size="15" font-weight="700" fill="#184d42"><text x="376" y="136">Serial 88K21</text><text x="374" y="213">Same location</text><text x="368" y="290">Same network role</text><text x="374" y="367">Commissioned 2019</text></g><g stroke="#f47c2c" stroke-width="5"><path d="M275 175H335"/><path d="M505 129H595"/><path d="M505 206H595"/><path d="M505 283H595"/><path d="M505 360H595"/></g><rect x="595" y="120" width="220" height="255" rx="18" fill="#fff7ed" stroke="#f47c2c" stroke-width="4"/><text x="628" y="165" font-size="14" font-weight="700" fill="#a7431d">STEWARD GATE</text><text x="628" y="207" font-size="20" font-weight="700" fill="#102f49">Evidence complete?</text><text x="628" y="244" font-size="17" fill="#344b59">Authority known?</text><text x="628" y="277" font-size="17" fill="#344b59">Conflict resolved?</text><text x="628" y="310" font-size="17" fill="#344b59">Effective date set?</text><rect x="628" y="328" width="150" height="30" rx="15" fill="#f47c2c"/><text x="664" y="349" font-size="14" font-weight="700" fill="#fff">APPROVED</text><path d="M815 248H910" stroke="#f47c2c" stroke-width="7"/><path d="M900 234L930 248 900 262Z" fill="#f47c2c"/><rect x="930" y="165" width="220" height="165" rx="18" fill="#dff3ed"/><text x="960" y="205" font-size="14" font-weight="700" fill="#1d7b75">CANONICAL IDENTITY</text><text x="960" y="251" font-size="25" font-weight="700" fill="#102f49">util:Pump_P104</text><text x="960" y="286" font-size="15" fill="#344b59">Reviewed crosswalk</text><text x="55" y="495" font-size="19" fill="#dce8ef">Text matching proposes the crossing. Evidence and accountable approval complete it.</text></g></svg>
