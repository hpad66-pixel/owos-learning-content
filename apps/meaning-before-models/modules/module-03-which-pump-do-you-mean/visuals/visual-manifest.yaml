visuals:
- visual_id: mbm03-evidence-wall
  title: Five records enter the room separately
  asset_class: forensic-evidence-wall
  locator: visuals/evidence-wall.svg
  component_id: null
  teaching_idea: Similar labels from different sources remain separate evidence until
    adjudication
  learner_conclusion: Five matching labels do not prove one physical asset
  reading_guide: Read each source card from left to right and compare location equipment
    role and date
  alternative_text: Five P-104 record cards from GIS maintenance SCADA work management
    and an operator note show conflicting locations and roles
  mobile_treatment: Stack the five cards in source order
  reduced_motion_treatment: Static evidence stamps contain all states
  creator: One Water OS course production
  source: Instructional Riverbend identity scenario
  license: Original OWOS course asset
  permission_status: approved
  originality_status: original
  storyboard_status: approved
  rendered_review_status: approved
- visual_id: mbm03-evidence-bridge
  title: Evidence must cross before identity is approved
  asset_class: identity-evidence-bridge
  locator: visuals/evidence-bridge.svg
  component_id: null
  teaching_idea: Corroborating attributes support a reviewed source-to-canonical mapping
  learner_conclusion: A crosswalk is an evidence-backed approval rather than a text
    replacement
  reading_guide: Start with two source identifiers follow the evidence cables and
    stop at the steward approval gate
  alternative_text: Source identifiers connect through serial location role history
    time and authority evidence to a steward gate and one canonical asset
  mobile_treatment: Stack source evidence gate and canonical result vertically
  reduced_motion_treatment: Static bridge shows every evidence cable
  creator: One Water OS course production
  source: Instructional identity governance pattern
  license: Original OWOS course asset
  permission_status: approved
  originality_status: original
  storyboard_status: approved
  rendered_review_status: approved
- visual_id: mbm03-record-role-network
  title: The pump sits at the center but the records keep their identities
  asset_class: record-role-network
  locator: visuals/record-role-network.svg
  component_id: null
  teaching_idea: Sensors work orders drawings and labels relate to an asset through
    different predicates
  learner_conclusion: A record about a pump is not another copy of the pump
  reading_guide: Begin at the center asset then read each incoming relationship and
    the distinct record it connects
  alternative_text: Pump P-104 connects to a SCADA point through monitors a work order
    through concerns a drawing through depicts and a nickname through labels
  mobile_treatment: Convert the radial network to a vertical relationship list
  reduced_motion_treatment: Static labeled links preserve all meaning
  creator: One Water OS course production
  source: W3C RDF concepts and instructional utility relationships
  license: Original OWOS course asset
  permission_status: approved
  originality_status: original
  storyboard_status: approved
  rendered_review_status: approved
- visual_id: mbm03-blast-radius
  title: One false equivalence creates four contaminated answer paths
  asset_class: false-merge-blast-radius
  locator: visuals/blast-radius.svg
  component_id: null
  teaching_idea: Unsupported identity propagates into maintenance operations analytics
    and agent context
  learner_conclusion: Correct identity before repairing downstream symptoms
  reading_guide: Start at the red false merge then follow each orange path to its
    downstream decision
  alternative_text: A false merge between a permanent pump and bypass pump branches
    into maintenance operations reliability and agent recommendation errors
  mobile_treatment: Stack the false merge followed by four numbered consequence paths
  reduced_motion_treatment: Static arrows show all propagation
  creator: One Water OS course production
  source: Instructional risk propagation scenario
  license: Original OWOS course asset
  permission_status: approved
  originality_status: original
  storyboard_status: approved
  rendered_review_status: approved
- visual_id: mbm03-steward-ledger
  title: Candidate approval hold and correction have named owners
  asset_class: steward-conflict-ledger
  locator: visuals/steward-ledger.svg
  component_id: null
  teaching_idea: Identity governance requires status authority evidence and next action
  learner_conclusion: Algorithms propose candidates while governed roles approve hold
    or correct them
  reading_guide: Read across each ledger row from status to evidence owner and next
    action
  alternative_text: A ledger compares approved held escalated and corrected identity
    cases with evidence owners and actions
  mobile_treatment: Render each row as a labeled case card
  reduced_motion_treatment: Static table preserves all responsibilities
  creator: One Water OS course production
  source: Instructional stewardship framework
  license: Original OWOS course asset
  permission_status: approved
  originality_status: original
  storyboard_status: approved
  rendered_review_status: approved
