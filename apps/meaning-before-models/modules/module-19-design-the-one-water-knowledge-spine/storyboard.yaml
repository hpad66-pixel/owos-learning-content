schema_version: 1
module_id: mbm001:19
version: 1.0.0
status: approved
approvals:
  narrative: approved
  visuals: approved
  interactions: approved
  assessments: approved
  owner: approved
beats:
- beat_id: proposal-autopsy
  learner_question: What decision does the enterprise proposal serve?
  instructor_purpose: Expose missing scope, measurement, ownership, authority, and
    stop controls.
  teaching_text_refs:
  - proposal-autopsy
  visual_refs:
  - mbm19-proposal-autopsy
  interaction_refs: []
  assessment_refs:
  - mbm19-opening
  intended_realization: Technical scale is not pilot readiness.
  transition: Replace enterprise ambition with one bounded question.
- beat_id: boundary
  learner_question: What is the smallest useful pilot?
  instructor_purpose: Bind the case to one question, decision, action, owner, baseline,
    target, and clock.
  teaching_text_refs:
  - boundary
  visual_refs: []
  interaction_refs:
  - mbm19-boundary-lab
  assessment_refs: []
  intended_realization: A pilot is one governed decision with a clock.
  transition: Test whether the decision actually needs a graph.
- beat_id: graph-fit
  learner_question: Has RDF earned a place?
  instructor_purpose: Prevent technology-first architecture.
  teaching_text_refs:
  - graph-fit
  visual_refs:
  - mbm19-evidence-spine
  interaction_refs: []
  assessment_refs:
  - mbm19-graph-fit
  intended_realization: A simpler governed solution may defeat the graph proposal.
  transition: Recover the prior-course artifacts needed for the bounded decision.
- beat_id: prerequisites
  learner_question: How do eighteen modules become one system?
  instructor_purpose: Give every artifact one non-substitutable design job.
  teaching_text_refs:
  - prerequisites
  visual_refs: []
  interaction_refs:
  - mbm19-artifact-map
  assessment_refs:
  - mbm19-artifact-check
  intended_realization: Meaning, evidence, context, authority, and measurement cooperate
    without collapsing.
  transition: Design only the semantics and source access the decision needs.
- beat_id: minimum-design
  learner_question: What is the minimum semantic design?
  instructor_purpose: Bound competency questions, identity, ontology, queries, shapes,
    inference, provenance, and access.
  teaching_text_refs:
  - minimum-design
  visual_refs:
  - mbm19-connected-canvas
  interaction_refs:
  - mbm19-design-challenge
  assessment_refs: []
  intended_realization: Every semantic and data choice must support the bounded question.
  transition: Connect the design to the Module 18 authority contract.
- beat_id: authority-handoff
  learner_question: What does the Agent Action Contract permit?
  instructor_purpose: Accept the handoff without enlarging authority.
  teaching_text_refs:
  - authority-handoff
  visual_refs: []
  interaction_refs: []
  assessment_refs:
  - mbm19-handoff
  intended_realization: Pilot approval permits rehearsal, not production operation.
  transition: Turn the design into evidence-producing phases.
- beat_id: roadmap
  learner_question: What must ninety days prove?
  instructor_purpose: Separate completed activity from decision evidence.
  teaching_text_refs:
  - roadmap
  visual_refs:
  - mbm19-roadmap
  interaction_refs: []
  assessment_refs:
  - mbm19-roadmap-check
  intended_realization: Each phase must reduce named uncertainty at a gate.
  transition: Defend the complete proposal before independent reviewers.
- beat_id: review-board
  learner_question: Can the pilot survive five review jobs?
  instructor_purpose: Make operations, semantics, security, governance, and value
    gates independent.
  teaching_text_refs:
  - review-board
  visual_refs:
  - mbm19-review-matrix
  interaction_refs:
  - mbm19-review-board
  assessment_refs: []
  intended_realization: A high average cannot rescue a failed hard gate.
  transition: Complete the professional Pilot Canvas and decision briefing.
- beat_id: work-product
  learner_question: What exactly should the utility approve?
  instructor_purpose: Produce a complete, bounded, evidence-backed investment artifact.
  teaching_text_refs:
  - work-product
  visual_refs: []
  interaction_refs: []
  assessment_refs:
  - mbm19-pilot-canvas
  - mbm19-defense
  intended_realization: BUILD, REVISE, and STOP are all valid evidence-backed decisions.
  transition: Hand the exact approved configuration to the Module 20 laboratory.
- beat_id: handoff
  learner_question: Can another team rehearse the design without inventing controls?
  instructor_purpose: Create a testable Module 19-to-20 handoff.
  teaching_text_refs:
  - handoff
  visual_refs: []
  interaction_refs: []
  assessment_refs: []
  intended_realization: The laboratory receives meaning, evidence, authority, tests,
    measures, and stops without undeclared additions.
  transition: Proceed to the One Water Knowledge Spine Live Lab.
