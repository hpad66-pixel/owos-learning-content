schema_version: 1
status: approved_for_design
course_id: owos-course-semantic-data-ai-001
module:
  id: mbm001:19
  number: 19
  title: Design the One Water Knowledge Spine
  part: Apply the backbone
  curriculum_role: capstone_design_and_defense
learning_job:
  learner_question: What is the smallest governed semantic pilot worth building?
  outcome: Design, measure, and defend one bounded One Water Knowledge Spine pilot.
  prior_knowledge: All prior modules and accumulated fieldbook evidence.
  misconception: A successful pilot begins by building the enterprise knowledge graph.
  transfer_task: Defend the pilot against scope, evidence, architecture, value, security, and authority challenges.
depth:
  common_route: Operational question, entities, relationships, evidence, mappings, access, context, controls, measures, and stop conditions.
  practitioner: Technical implementation roadmap, test plan, nonfunctional requirements, and integration sequence.
  leader: Investment decision, accountable owner, value measure, governance, review gates, and scale or stop decision.
experience:
  archetype: capstone_design_review
  opening: A proposal arrives to build the enterprise graph without one bounded decision or value measure.
  mental_model: A pilot canvas connecting one operational question to governed evidence and measurable action.
  signature_mechanism: Scope a pilot, test graph fit, assemble the evidence, and defend it before a review panel.
  visual_jobs:
    - Show the complete pilot canvas as connected decisions rather than a long form.
    - Reveal dependencies among identity, meaning, evidence, access, context, and action.
    - Compare baseline, target, stop condition, and ninety-day review.
  assessment_jobs:
    - Reject unbounded or unsupported scope.
    - Synthesize the complete pilot architecture and operating model.
    - Defend the recommendation and respond to review challenges.
  work_product: One Water Knowledge Spine Pilot Canvas and Decision Briefing
  capstone_contribution: Final integrated and reviewable capstone.
evidence:
  source_refs: [SRC-001, SRC-002, SRC-003, SRC-004, SRC-005, SRC-011, DIR-004, DIR-005]
  claim_refs: [CLM-010, CLM-019, CLM-027, CLM-028, CLM-036]
  boundary: The pilot must be bounded by a real question and measurable value. RDF is not automatically the right solution.
sequence:
  requires: [mbm001:01, mbm001:02, mbm001:03, mbm001:04, mbm001:05, mbm001:06, mbm001:07, mbm001:08, mbm001:09, mbm001:10, mbm001:11, mbm001:12, mbm001:13, mbm001:14, mbm001:15, mbm001:16, mbm001:17, mbm001:18]
  prepares: []
