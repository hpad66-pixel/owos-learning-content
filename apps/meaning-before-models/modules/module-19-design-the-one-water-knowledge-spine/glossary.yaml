{
  "schema_version": 1,
  "module_id": "mbm001:19",
  "terms": [
    {"term": "bounded pilot", "definition": "A time-limited experiment organized around one named decision, evidence boundary, owner, measure, and stop condition."},
    {"term": "Graph Fit Test", "definition": "An OWOS decision method for testing whether relationships, identity, semantics, provenance, and rules justify a graph over a simpler governed solution."},
    {"term": "competency question", "definition": "A question the semantic design must be able to answer and test."},
    {"term": "hard gate", "definition": "A release or investment condition that cannot be offset by a high average score elsewhere."},
    {"term": "Pilot Canvas", "definition": "The connected professional artifact defining scope, meaning, evidence, context, authority, owners, tests, measures, and stop conditions."},
    {"term": "Knowledge Spine", "definition": "An OWOS architecture term for instantiated, queryable, governed meaning connected to authoritative enterprise evidence."},
    {"term": "materialization", "definition": "Creating and governing a copy of selected data or relationships for a justified workload."},
    {"term": "stop condition", "definition": "A predefined finding that requires the pilot to pause, revise, use a simpler approach, or end."}
  ]
}
