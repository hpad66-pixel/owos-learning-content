<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 690" role="img" aria-labelledby="t d">
  <title id="t">Review Board Decision Matrix</title><desc id="d">Five reviewer roles test independent pilot hard gates.</desc>
  <rect width="1000" height="690" rx="32" fill="#f4f8fb"/>
  <text x="60" y="66" font-family="Arial" font-size="30" font-weight="700" fill="#17384f">Five reviewers. Five hard gates.</text>
  <g font-family="Arial">
    <g fill="#17384f"><rect x="60" y="100" width="880" height="58" rx="12"/><text x="84" y="137" fill="#fff" font-size="18" font-weight="700">REVIEWER</text><text x="290" y="137" fill="#fff" font-size="18" font-weight="700">QUESTION</text><text x="770" y="137" fill="#fff" font-size="18" font-weight="700">GATE</text></g>
    <g font-size="17"><g><rect x="60" y="172" width="880" height="78" rx="12" fill="#fff"/><text x="84" y="205" font-weight="700" fill="#18394e">Operations</text><text x="290" y="205" fill="#405c6d">Does this match the real decision?</text><text x="770" y="205" fill="#8c2f39" font-weight="700">Useful</text><text x="290" y="230" fill="#607b8b">Workflow, timing, evidence, consequence</text></g>
    <g><rect x="60" y="262" width="880" height="78" rx="12" fill="#fff"/><text x="84" y="295" font-weight="700" fill="#18394e">Semantics</text><text x="290" y="295" fill="#405c6d">Can another team test the meaning?</text><text x="770" y="295" fill="#8c2f39" font-weight="700">Testable</text><text x="290" y="320" fill="#607b8b">Identity, mappings, queries, shapes, inference</text></g>
    <g><rect x="60" y="352" width="880" height="78" rx="12" fill="#fff"/><text x="84" y="385" font-weight="700" fill="#18394e">Cybersecurity</text><text x="290" y="385" fill="#405c6d">Can access and tool scope be enforced?</text><text x="770" y="385" fill="#8c2f39" font-weight="700">Controlled</text><text x="290" y="410" fill="#607b8b">Credentials, denied paths, OT boundaries</text></g>
    <g><rect x="60" y="442" width="880" height="78" rx="12" fill="#fff"/><text x="84" y="475" font-weight="700" fill="#18394e">Governance</text><text x="290" y="475" fill="#405c6d">Who owns approval and correction?</text><text x="770" y="475" fill="#8c2f39" font-weight="700">Owned</text><text x="290" y="500" fill="#607b8b">Authority, stewardship, audit, escalation</text></g>
    <g><rect x="60" y="532" width="880" height="78" rx="12" fill="#fff"/><text x="84" y="565" font-weight="700" fill="#18394e">Finance</text><text x="290" y="565" fill="#405c6d">What evidence justifies investment?</text><text x="770" y="565" fill="#8c2f39" font-weight="700">Measurable</text><text x="290" y="590" fill="#607b8b">Baseline, target, cost, uncertainty, scale</text></g></g>
  </g>
  <text x="500" y="654" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#8c2f39">A failed hard gate forces REVISE or STOP.</text>
</svg>
