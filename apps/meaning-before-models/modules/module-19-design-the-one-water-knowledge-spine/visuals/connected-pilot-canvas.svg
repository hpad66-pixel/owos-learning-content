<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" role="img" aria-labelledby="t d">
  <title id="t">Connected Pilot Canvas</title><desc id="d">A bounded decision connects to six governed pilot design domains.</desc>
  <rect width="1000" height="760" rx="32" fill="#f4f8fb"/>
  <g stroke="#7aa8bd" stroke-width="4"><line x1="500" y1="380" x2="220" y2="170"/><line x1="500" y1="380" x2="500" y2="145"/><line x1="500" y1="380" x2="780" y2="170"/><line x1="500" y1="380" x2="220" y2="590"/><line x1="500" y1="380" x2="500" y2="615"/><line x1="500" y1="380" x2="780" y2="590"/></g>
  <circle cx="500" cy="380" r="132" fill="#123953"/><text x="500" y="357" text-anchor="middle" fill="#86e3d3" font-family="Arial" font-size="19" font-weight="700">BOUNDED DECISION</text><text x="500" y="397" text-anchor="middle" fill="#fff" font-family="Arial" font-size="24" font-weight="700">Build · Revise · Stop</text><text x="500" y="430" text-anchor="middle" fill="#dceaf1" font-family="Arial" font-size="17">LS-7 evidence pilot</text>
  <g font-family="Arial" font-size="20" font-weight="700" text-anchor="middle">
    <g><rect x="90" y="100" width="260" height="126" rx="22" fill="#fff" stroke="#d2e0e7"/><text x="220" y="152" fill="#18394e">Scope</text><text x="220" y="184" fill="#536f80" font-size="16">question · owner · exclusions</text></g>
    <g><rect x="370" y="70" width="260" height="126" rx="22" fill="#fff" stroke="#d2e0e7"/><text x="500" y="122" fill="#18394e">Meaning</text><text x="500" y="154" fill="#536f80" font-size="16">identity · ontology · queries</text></g>
    <g><rect x="650" y="100" width="260" height="126" rx="22" fill="#fff" stroke="#d2e0e7"/><text x="780" y="152" fill="#18394e">Evidence</text><text x="780" y="184" fill="#536f80" font-size="16">sources · provenance · time</text></g>
    <g><rect x="90" y="534" width="260" height="126" rx="22" fill="#fff" stroke="#d2e0e7"/><text x="220" y="586" fill="#18394e">Context + Authority</text><text x="220" y="618" fill="#536f80" font-size="16">policy · approval · tools</text></g>
    <g><rect x="370" y="564" width="260" height="126" rx="22" fill="#fff" stroke="#d2e0e7"/><text x="500" y="616" fill="#18394e">Tests + Owners</text><text x="500" y="648" fill="#536f80" font-size="16">failures · correction · audit</text></g>
    <g><rect x="650" y="534" width="260" height="126" rx="22" fill="#fff" stroke="#d2e0e7"/><text x="780" y="586" fill="#18394e">Measures + Stops</text><text x="780" y="618" fill="#536f80" font-size="16">baseline · target · gates</text></g>
