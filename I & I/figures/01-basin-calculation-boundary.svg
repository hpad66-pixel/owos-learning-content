<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">One-basin calculation boundary</title>
<desc id="desc">A five-stage sanitary sewer basin from water sources through force-main discharge, with physical, computation, evidence, and decision layers.</desc>
<rect width="1200" height="680" fill="#f7f5f0"/>
<style>
text { font-family: Inter, Arial, sans-serif; fill: #12233f; }
.title { font-size: 28px; font-weight: 700; }
.subtitle { font-size: 15px; fill: #667085; }
.axis { stroke: #12233f; stroke-width: 1.5; }
.grid { stroke: #d6dde4; stroke-width: 1; }
.tick { font-size: 13px; fill: #667085; }
.label { font-size: 15px; font-weight: 600; }
.legend { font-size: 14px; }
</style>
<text x="45" y="55" class="title">One-basin calculation boundary</text><text x="45" y="83" class="subtitle">The agent follows water, data, formulas, decisions, and verification through one declared control volume.</text><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#12233f"/></marker></defs><rect x="45" y="160" width="175" height="105" rx="12" fill="#36a9c5" opacity="0.18" stroke="#36a9c5" stroke-width="3"/><text x="132.5" y="205" text-anchor="middle" class="label">Rainfall and</text><text x="132.5" y="230" text-anchor="middle" class="label">Groundwater</text><rect x="260" y="160" width="175" height="105" rx="12" fill="#ef8354" opacity="0.18" stroke="#ef8354" stroke-width="3"/><text x="347.5" y="205" text-anchor="middle" class="label">Entry</text><text x="347.5" y="230" text-anchor="middle" class="label">Pathways</text><rect x="475" y="160" width="175" height="105" rx="12" fill="#176b87" opacity="0.18" stroke="#176b87" stroke-width="3"/><text x="562.5" y="205" text-anchor="middle" class="label">Gravity Basin</text><text x="562.5" y="230" text-anchor="middle" class="label">and Meter</text><rect x="690" y="160" width="175" height="105" rx="12" fill="#e6b655" opacity="0.18" stroke="#e6b655" stroke-width="3"/><text x="777.5" y="205" text-anchor="middle" class="label">Wet Well and</text><text x="777.5" y="230" text-anchor="middle" class="label">Pump Station</text><rect x="905" y="160" width="220" height="105" rx="12" fill="#2a9d78" opacity="0.18" stroke="#2a9d78" stroke-width="3"/><text x="1015.0" y="205" text-anchor="middle" class="label">Force Main and</text><text x="1015.0" y="230" text-anchor="middle" class="label">Downstream Node</text><line x1="228" y1="212.5" x2="252" y2="212.5" stroke="#12233f" stroke-width="3" marker-end="url(#arrow)"/><line x1="443" y1="212.5" x2="467" y2="212.5" stroke="#12233f" stroke-width="3" marker-end="url(#arrow)"/><line x1="658" y1="212.5" x2="682" y2="212.5" stroke="#12233f" stroke-width="3" marker-end="url(#arrow)"/><line x1="873" y1="212.5" x2="897" y2="212.5" stroke="#12233f" stroke-width="3" marker-end="url(#arrow)"/><rect x="45" y="320" width="1080" height="52" rx="8" fill="#ffffff" stroke="#d6dde4"/><text x="70" y="350" class="label">PHYSICAL LAYER</text><text x="300" y="350" class="subtitle">Assets, defects, groundwater, rain, flow, head, storage, energy</text><rect x="45" y="390" width="1080" height="52" rx="8" fill="#ffffff" stroke="#d6dde4"/><text x="70" y="420" class="label">COMPUTATION LAYER</text><text x="300" y="420" class="subtitle">DWF + GWI + RTK RDII + hydraulic operating point + storage routing + economics</text><rect x="45" y="460" width="1080" height="52" rx="8" fill="#ffffff" stroke="#d6dde4"/><text x="70" y="490" class="label">EVIDENCE LAYER</text><text x="300" y="490" class="subtitle">Source locator + units + data-quality state + applicability + uncertainty + formula version</text><rect x="45" y="530" width="1080" height="52" rx="8" fill="#ffffff" stroke="#d6dde4"/><text x="70" y="560" class="label">DECISION LAYER</text><text x="300" y="560" class="subtitle">Screen, diagnose, model, rehabilitate, verify, and block unsupported conclusions</text>
</svg>
