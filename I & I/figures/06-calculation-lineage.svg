<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Calculation lineage for the one-basin engine</title>
<desc id="desc">A directed graph from asset, dry-weather, and rainfall inputs through RTK, pump, storage, energy, and economics, with six validation gates.</desc>
<rect width="1200" height="680" fill="#f7f5f0"/>
<style>
text { font-family: Inter, Arial, sans-serif; fill: #12233f; }
.title { font-size: 28px; font-weight: 700; }
.subtitle { font-size: 15px; fill: #667085; }
.axis { stroke: #12233f; stroke-width: 1.5; }
.grid { stroke: #d6dde4; stroke-width: 1; }
.tick { font-size: 13px; fill: #667085; }
.label { font-size: 15px; font-weight: 600; }
.legend { font-size: 14px; }
</style>
<text x="60" y="50" class="title">Calculation lineage for the one-basin engine</text><text x="60" y="78" class="subtitle">Every result remains connected to accepted inputs, a versioned formula, tests, and a decision boundary.</text><defs><marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#667085"/></marker></defs><rect x="55" y="145" width="190" height="75" rx="10" fill="#176b87" opacity="0.17" stroke="#176b87" stroke-width="3"/><text x="150.0" y="190" text-anchor="middle" class="label">Asset inventory</text><rect x="55" y="250" width="190" height="75" rx="10" fill="#36a9c5" opacity="0.17" stroke="#36a9c5" stroke-width="3"/><text x="150.0" y="295" text-anchor="middle" class="label">Dry-weather flow</text><rect x="55" y="355" width="190" height="75" rx="10" fill="#ef8354" opacity="0.17" stroke="#ef8354" stroke-width="3"/><text x="150.0" y="400" text-anchor="middle" class="label">Rainfall</text><rect x="320" y="145" width="210" height="75" rx="10" fill="#176b87" opacity="0.17" stroke="#176b87" stroke-width="3"/><text x="425.0" y="190" text-anchor="middle" class="label">IDM and GWI</text><rect x="320" y="250" width="210" height="75" rx="10" fill="#36a9c5" opacity="0.17" stroke="#36a9c5" stroke-width="3"/><text x="425.0" y="295" text-anchor="middle" class="label">Expected DWF</text><rect x="320" y="355" width="210" height="75" rx="10" fill="#ef8354" opacity="0.17" stroke="#ef8354" stroke-width="3"/><text x="425.0" y="400" text-anchor="middle" class="label">RTK hydrograph</text><rect x="605" y="200" width="220" height="75" rx="10" fill="#12233f" opacity="0.17" stroke="#12233f" stroke-width="3"/><text x="715.0" y="245" text-anchor="middle" class="label">Total basin inflow</text><rect x="605" y="330" width="220" height="75" rx="10" fill="#e6b655" opacity="0.17" stroke="#e6b655" stroke-width="3"/><text x="715.0" y="375" text-anchor="middle" class="label">Pump and system point</text><rect x="895" y="200" width="245" height="75" rx="10" fill="#c94c4c" opacity="0.17" stroke="#c94c4c" stroke-width="3"/><text x="1017.5" y="245" text-anchor="middle" class="label">Capacity and storage</text><rect x="895" y="330" width="245" height="75" rx="10" fill="#2a9d78" opacity="0.17" stroke="#2a9d78" stroke-width="3"/><text x="1017.5" y="375" text-anchor="middle" class="label">Energy and economics</text><line x1="245" y1="182" x2="320" y2="182" stroke="#667085" stroke-width="3" marker-end="url(#arrow2)"/><line x1="245" y1="287" x2="320" y2="287" stroke="#667085" stroke-width="3" marker-end="url(#arrow2)"/><line x1="245" y1="392" x2="320" y2="392" stroke="#667085" stroke-width="3" marker-end="url(#arrow2)"/><line x1="530" y1="287" x2="605" y2="237" stroke="#667085" stroke-width="3" marker-end="url(#arrow2)"/><line x1="530" y1="392" x2="605" y2="237" stroke="#667085" stroke-width="3" marker-end="url(#arrow2)"/><line x1="530" y1="182" x2="895" y2="237" stroke="#667085" stroke-width="3" marker-end="url(#arrow2)"/><line x1="825" y1="237" x2="895" y2="237" stroke="#667085" stroke-width="3" marker-end="url(#arrow2)"/><line x1="825" y1="367" x2="895" y2="367" stroke="#667085" stroke-width="3" marker-end="url(#arrow2)"/><line x1="715" y1="275" x2="715" y2="330" stroke="#667085" stroke-width="3" marker-end="url(#arrow2)"/><rect x="65" y="520" width="165" height="90" rx="8" fill="#ffffff" stroke="#d6dde4"/><text x="147.5" y="552" text-anchor="middle" class="subtitle">Units</text><text x="147.5" y="585" text-anchor="middle" class="label">declared</text><rect x="250" y="520" width="165" height="90" rx="8" fill="#ffffff" stroke="#d6dde4"/><text x="332.5" y="552" text-anchor="middle" class="subtitle">Domain</text><text x="332.5" y="585" text-anchor="middle" class="label">passed</text><rect x="435" y="520" width="165" height="90" rx="8" fill="#ffffff" stroke="#d6dde4"/><text x="517.5" y="552" text-anchor="middle" class="subtitle">Mass balance</text><text x="517.5" y="585" text-anchor="middle" class="label">closed</text><rect x="620" y="520" width="165" height="90" rx="8" fill="#ffffff" stroke="#d6dde4"/><text x="702.5" y="552" text-anchor="middle" class="subtitle">Formula</text><text x="702.5" y="585" text-anchor="middle" class="label">versioned</text><rect x="805" y="520" width="165" height="90" rx="8" fill="#ffffff" stroke="#d6dde4"/><text x="887.5" y="552" text-anchor="middle" class="subtitle">Sources</text><text x="887.5" y="585" text-anchor="middle" class="label">located</text><rect x="990" y="520" width="165" height="90" rx="8" fill="#ffffff" stroke="#d6dde4"/><text x="1072.5" y="552" text-anchor="middle" class="subtitle">Review</text><text x="1072.5" y="585" text-anchor="middle" class="label">gated</text>
</svg>
