<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Direct marginal-cost economic screen</title>
<desc id="desc">Bar chart comparing present-value gross benefits, costs, and negative net present value for the hypothetical rehabilitation scenario.</desc>
<rect width="1200" height="680" fill="#f7f5f0"/>
<style>
text { font-family: Inter, Arial, sans-serif; fill: #12233f; }
.title { font-size: 28px; font-weight: 700; }
.subtitle { font-size: 15px; fill: #667085; }
.axis { stroke: #12233f; stroke-width: 1.5; }
.grid { stroke: #d6dde4; stroke-width: 1; }
.tick { font-size: 13px; fill: #667085; }
.label { font-size: 15px; font-weight: 600; }
.legend { font-size: 14px; }
</style>
<text x="75" y="55" class="title">Direct marginal-cost economic screen</text><text x="75" y="82" class="subtitle">Capacity, overflow, compliance, reliability, environmental, and public-health benefits are deliberately excluded.</text><line x1="250" y1="350" x2="1120" y2="350" class="axis"/><rect x="340" y="341.97" width="150" height="8.03" rx="5" fill="#2a9d78" opacity="0.82"/><text x="415" y="385" text-anchor="middle" class="label">PV benefits</text><text x="415" y="329.97" text-anchor="middle" class="label">$0.34M</text><rect x="600" y="106.89" width="150" height="243.11" rx="5" fill="#2a9d78" opacity="0.82"/><text x="675" y="385" text-anchor="middle" class="label">PV costs</text><text x="675" y="94.89" text-anchor="middle" class="label">$10.29M</text><rect x="860" y="350.00" width="150" height="235.08" rx="5" fill="#c94c4c" opacity="0.82"/><text x="935" y="385" text-anchor="middle" class="label">NPV</text><text x="935" y="610.08" text-anchor="middle" class="label">$-9.95M</text><text x="75" y="655" class="subtitle">Interpretation: the narrow direct-cost screen fails. It is not a complete benefit-cost determination.</text>
</svg>
