technical_position:
  statement: >-
    I&I calculations are valid only when the system boundary, flow components,
    time basis, units, data quality, hydrologic conditions, and intended decision
    are explicit. The application must fail closed rather than convert an
    undefined input or inapplicable threshold into a confident result.
