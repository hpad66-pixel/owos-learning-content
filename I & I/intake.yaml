owner_direction:
  status: active
  verbatim: >-
    I want to do a very detailed paper on the topic of infiltration and inflow.
    The focus will be on Miami-Dade County. For that matter, it should apply
    anywhere in the country, in the United States. This white paper will be a
    detailed research paper rising to the level of a detailed technical analysis
    that will describe everything, including the components, calculations, and
    formulas with examples.
  interpreted_requirements:
    - Produce a long-form, detailed technical white paper on wastewater collection-system infiltration and inflow.
    - Use Miami-Dade County as the primary case study.
    - Make the concepts, methods, calculations, formulas, and worked examples transferable across the United States.
    - Explain components, mechanisms, measurement, analysis, diagnosis, rehabilitation, economics, and verification.
    - Do not present a local threshold or requirement as a national standard.
  correction_2026_07_27:
    verbatim: >-
      This is not for teaching, this is a research paper, a very, very deep
      research paper, and this is for universal INI calculations, which apply
      anywhere, right? I don't want you to give me this course or anything like
      that. This is going to be an agentic application that we're going to
      build, so all the formulas, everything, better be 100% correct. Take it to
      level 10 out of 10!
    interpreted_requirements:
      - Treat INI as I&I, meaning infiltration and inflow.
      - Do not create a course, lesson, assessment, storyboard, or learner-facing product.
      - Build a deep engineering research paper and computational specification.
      - Make every universal method portable across United States utilities.
      - Make Miami-Dade a fully researched case study without universalizing local thresholds.
      - Give every formula variables, units, assumptions, applicability, provenance, test vectors, uncertainty, and fail-closed conditions.
      - Support a future agentic application rather than a one-time narrative calculation.
