schema_version: 2
contract: owos-learning-record-credential/1
owner: Hardeep Anand
status: implementation_readiness
services:
  learning_record_service: OWOS Learning Record Service
  credential_service: OWOS Credential Service
  learner_dashboard: OWOS Learner Dashboard
  pathway_agent: OWOS Learning Pathway Agent
interoperability:
  canonical_event_profile: owos-xapi-profile/1
  xapi_target: xAPI 2.0
  lms_launch_preferred: cmi5
  legacy_lms_adapter: SCORM 2004
  portable_credential_target: Open Badges 3.0
  learner_record_export_target: Comprehensive Learner Record 2.0
issuance:
  fail_closed: true
  required_gates:
    - offering
    - content_release
    - identity
    - participation
    - assessment
    - evaluation_when_required
    - accreditor_when_credit_claimed
    - issuer_and_status
  credit_layers:
    provider:
      unit: OWOS Provider Learning Hour
      claim_state: provider_issued
      accreditor_gate: not_applicable
      annual_ledger: calendar_year
    external:
      supported_units:
        - PDH
        - CEU
        - CU
        - contact_hour
      preparation_state: external_approval_pending
      approved_state: approved_external
      accreditor_gate: required
      count_pending_as_approved: false
  allowed_states:
    - evidence_pending
    - eligible
    - issued
    - expired
    - superseded
    - revoked
annual_record:
  grouped_by:
    - calendar_year
    - program
    - jurisdiction
    - unit
  downloads:
    - PDF
    - CSV
  immutable_awards: true
recommendations:
  product_term: AI-assisted skills-based learning pathways
  item_term: next-best-learning recommendation
  lanes:
    - deepen
    - reskill
    - cross-skill
  rules_before_ai: true
  learner_control_required: true
  protected_traits_prohibited: true
  facility_sensitive_data_prohibited: true
