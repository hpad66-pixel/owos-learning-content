experience_contract:
  visual_explanations_minimum: 2
  distributed_checks_minimum: 2
  dynamic_explanation_required: true
  final_applied_check_required: true
  cross_sector_connection_required: true
  allowed_dynamic_modes: [step, play, pause, back, reset, compare, manipulate, trace, diagnose]
  animation_meaning_jobs: [change, cause, consequence, sequence, dependency, hidden_structure]
  required_equivalents: [mobile, reduced_motion, no_javascript, structured_text]

continuing_education:
  default_state: readiness_only
  credit_claim_allowed_without_approval: false
  required_evidence:
    - authenticated_learner_identity
    - stated_learning_outcomes
    - instructional_time_basis
    - participation_evidence
    - assessment_and_passing_rule
    - completion_record
    - content_version
    - instructor_or_provider_record
    - evaluation_record
    - accreditor_approval

learning_record_contract:
  placement_required: true
  capability_lock_required: true
  stable_event_namespace_required: true
  privacy_classification_required: true
  supersession_and_correction_notification_required: true
  facility_sensitive_data_default: prohibited
  assessment_version_required: true
  simulation_model_version_required: true
  language_and_unit_policy_required: true
  measured_time_basis_required: true

credential_and_pathway_contract:
  standard: core/standards/OWOS-LEARNING-RECORD-CREDENTIAL-AND-PATHWAY-STANDARD.md
  contract: owos-learning-record-credential/1
  canonical_event_profile: owos-xapi-profile/1
  preferred_lms_launch: cmi5
  legacy_lms_adapter: SCORM 2004
  portable_credential_target: Open Badges 3.0
  learner_record_export_target: Comprehensive Learner Record 2.0
  credential_schema: core/schemas/owos-credential-record.schema.json
  learning_record_schema: core/schemas/owos-learning-record.schema.json
  recommendation_schema: core/schemas/owos-learning-recommendation.schema.json
  required_recommendation_lanes: [deepen, reskill, cross-skill]
  explainability_required: true
  learner_control_required: true
  protected_traits_prohibited: true
  facility_sensitive_data_prohibited: true
  accreditor_gate_required_for_credit: true
  issuance_fail_closed: true
