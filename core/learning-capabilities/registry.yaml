registry_version: 1
registry_id: owos-learning-capabilities/1
owner: Hardeep Anand
authority: Shared source of truth for OWOS learning components used by both compiler engines.

engines:
  course:
    standard_name: OWOS Course Engine
    compiler_name: OWOS Course Compiler
    contract: owos-course-compiler/1
    package_unit: multi-module course
  concept_brief:
    standard_name: OWOS Concept Engine
    compiler_name: OWOS Concept Brief Compiler
    contract: owos-concept-brief/2
    package_unit: one-module concept brief

catalog_sources:
  visual_arsenal: core/standards/VISUAL-ARSENAL.md
  component_catalog: core/components/COMPONENTS.md
  component_gallery: core/components/component-gallery.html
  quiz_catalog: core/components/QUIZ-TYPES.md
  quiz_gallery: core/components/quiz-gallery.html

assessment_types:
  multiple-choice: {catalog_label: Multiple choice, cognitive_jobs: [judgment, diagnosis, selection], compiler_support: [course, concept_brief]}
  multi-select: {catalog_label: Multi-select, cognitive_jobs: [boundary, evidence_selection, diagnosis], compiler_support: [course, concept_brief]}
  flip-cards: {catalog_label: Flip cards, cognitive_jobs: [retrieval, terminology], compiler_support: [course, concept_brief]}
  matching: {catalog_label: Matching, cognitive_jobs: [relationship, terminology], compiler_support: [course, concept_brief]}
  classify-sort: {catalog_label: Classify / sort, cognitive_jobs: [classification, boundary], compiler_support: []}
  estimate: {catalog_label: Estimate, cognitive_jobs: [quantity_sense, calibration], compiler_support: []}
  true-false: {catalog_label: True / false, cognitive_jobs: [misconception, retrieval], compiler_support: []}
  fill-blank: {catalog_label: Fill in the blank, cognitive_jobs: [retrieval], compiler_support: []}
  put-in-order: {catalog_label: Put in order, cognitive_jobs: [sequence, process], compiler_support: []}
  reflection: {catalog_label: Reflection, cognitive_jobs: [explanation, transfer], compiler_support: [concept_brief]}
  applied-work-product: {catalog_label: Applied work product, cognitive_jobs: [application, transfer], compiler_support: [course, concept_brief]}

